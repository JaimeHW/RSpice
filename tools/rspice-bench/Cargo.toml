[package]
name = "rspice-bench"
description = "Developer benchmarks and performance qualification tools for RSpice"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rspice-bench"
path = "src/main.rs"

[features]
# Opt-in: pulls the whole generated built-in corpus into this binary. The
# models are independent packages so Cargo can cache and compile them in
# parallel, but the complete corpus remains inappropriate for the default
# process-level benchmark build.
generated-stamp-base = ["dep:rspice-core", "dep:rspice-conformance"]
generated-stamp = ["generated-stamp-base", "corpus-all"]

# Five representative models for routine development measurements. Use
# `generated-stamp` when a measurement must cover the complete corpus.
generated-stamp-subset = ["generated-stamp-base", "corpus-five"]

corpus-all = ["rspice-core/veriloga-builtins-models"]
corpus-five = [
    "rspice-core/veriloga-model-vbic13",
    "rspice-core/veriloga-model-r2-cmc",
    "rspice-core/veriloga-model-diode-cmc",
    "rspice-core/veriloga-model-juncap200",
    "rspice-core/veriloga-model-epfl-hemt-10a",
]

[dependencies]
blake3 = "1.5"
clap.workspace = true
# No `features` here on purpose: the model set is selected by `corpus-all` or
# `corpus-five` above. Pinning it in the dependency entry made the full corpus
# unconditional whenever this dependency was enabled at all.
rspice-core = { path = "../../crates/rspice-core", version = "0.1.0", optional = true, default-features = false }
# The stamp bench and golden-fingerprint capture live with the Verilog-A suite
# in rspice-conformance, not in the library they measure. This crate is a
# benchmark rig rather than a shipping frontend, so depending on a conformance
# crate is fine — `tools/ci/test_ci_configuration.py` enforces the ban only
# against the crates that ship.
rspice-conformance = { path = "../rspice-conformance", version = "0.1.0", optional = true, default-features = false, features = [
    "veriloga-builtins-base",
] }
# The `klu` subcommand measures the solver kernels where they live, in
# rspice-matrix, rather than through the `rspice-core` re-export. That keeps it
# off the optional dependency above and out of the corpus build entirely: this
# crate is lean (faer, log, num-complex, rustc-hash, thiserror), so `klu` stays
# a seconds-to-build command.
rspice-matrix.workspace = true
rspice-veriloga = { path = "../../crates/rspice-veriloga", version = "0.1.0", features = ["native"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3.20"
wait-timeout = "0.2.1"

[lints]
workspace = true
