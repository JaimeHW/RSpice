<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>RSpice browser Automation runtime qualification</title>
<body>
<pre id="result">running</pre>
<script type="module">
const result = document.querySelector("#result");
const protocol = { major: 1, minor: 3 };
const bytes = (hex) => Array.from(hex.match(/../g), pair => Number.parseInt(pair, 16));
const environmentDigest = bytes("d445b1443965be4e6b1b191ee023176dbd35430ac3cd00603458384ea03b8518");
const id = {
  project: "11111111-1111-4111-8111-111111111111",
  workspace: "22222222-2222-4222-8222-222222222222",
  entry: "33333333-3333-4333-8333-333333333333",
  lock: "44444444-4444-4444-8444-444444444444",
  permissions: "55555555-5555-4555-8555-555555555555",
};
const lock = `format = "rspice-python-lock/v3"
python = ">=3.14.0,<3.15.0"
rspice-api = ">=1.0.0,<2.0.0"
browser-runtime = "=314.0.2"
environment_digest = "sha256:d445b1443965be4e6b1b191ee023176dbd35430ac3cd00603458384ea03b8518"
`;
const permissions = `project_files = "read"
artifact_directory = "write"
network = "deny"
process_spawn = "deny"
environment = []
secret_logging = "redact"
`;
const snapshot = {
  project_id: id.project,
  workspace_id: id.workspace,
  workspace_revision: 1,
  closure_digest: Array(32).fill(1),
  environment_digest: environmentDigest,
  permission_digest: Array(32).fill(3),
  entry_document_id: id.entry,
  selected_run_plan_document_id: null,
  python_requirement: ">=3.14.0,<3.15.0",
  api_requirement: ">=1.0.0,<2.0.0",
  browser_runtime_requirement: "=314.0.2",
  documents: [
    {
      document_id: id.entry,
      logical_path: "flows/qualification.py",
      revision: 1,
      role: "python-entry",
      read_only: false,
      source: "value = 40 + 2\n",
    },
    {
      document_id: id.lock,
      logical_path: "environment/requirements.lock",
      revision: 1,
      role: "environment-lock",
      read_only: true,
      source: lock,
    },
    {
      document_id: id.permissions,
      logical_path: "security/permissions.toml",
      revision: 1,
      role: "permission-manifest",
      read_only: false,
      source: permissions,
    },
  ],
  capabilities: [],
};
const worker = new Worker("/crates/rspice-ui/web/automation-worker.js", { type: "module" });
const events = [];
const finish = (status, detail) => {
  const qualification = { status, ...detail, event_count: events.length };
  window.RSPICE_AUTOMATION_QUALIFICATION = qualification;
  result.textContent = JSON.stringify(qualification, null, 2);
  worker.terminate();
};
// Runtime startup is qualified separately from the user-code wall budget.
// Debug WASM builds can spend materially longer compiling the pinned runtime
// than optimized release builds, but the qualification must still terminate.
const timer = setTimeout(() => finish("failed", { error: "runtime qualification timed out" }), 120000);
worker.onerror = (event) => {
  clearTimeout(timer);
  finish("failed", { error: event.message || "worker error" });
};
worker.onmessage = (message) => {
  const envelope = message.data?.envelope;
  if (!envelope) return;
  events.push(envelope);
  if (envelope.event?.event === "worker-failed") {
    clearTimeout(timer);
    finish("failed", { error: envelope.event.message, code: envelope.event.code });
    return;
  }
  if (envelope.request_id === 2 && envelope.event?.event === "state") {
    if (envelope.event.state === "completed") {
      clearTimeout(timer);
      const hello = events.find(event => event.event?.event === "hello")?.event.identity;
      finish("complete", {
        runtime: hello?.runtime_build,
        python: hello?.python_version,
        validation: envelope.event.detail,
      });
    } else if (envelope.event.state === "failed") {
      clearTimeout(timer);
      finish("failed", { error: envelope.event.detail });
    }
  }
};
worker.postMessage({
  type: "automation-request",
  envelope: { protocol, request_id: 1, request: { operation: "probe" } },
});
worker.postMessage({
  type: "automation-request",
  envelope: {
    protocol,
    request_id: 2,
    request: {
      operation: "launch",
      mode: "validate",
      snapshot,
      limits: {
        wall_time_ms: 20000,
        cpu_time_ms: 10000,
        memory_bytes: 268435456,
        output_bytes: 1048576,
        artifact_bytes: 1048576,
        max_tasks: 16,
        max_stack_depth: 256,
      },
      breakpoints: [],
      exception_policy: "uncaught",
    },
  },
});
</script>
</body>
</html>
