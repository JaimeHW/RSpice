<!-- Capacitance meter (cmeter): instrument circle marked with the measured
     unit F (farads), in the style of a voltmeter's V or ammeter's A.
     Box 40x20, pins in(0,10), out(40,10). -->
<svg viewBox="0 0 40 20" xmlns="http://www.w3.org/2000/svg">
  <path d="M 0,10 H 11.5" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 11.5,10 A 8.5,8.5 0 0 1 28.5,10 A 8.5,8.5 0 0 1 11.5,10" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 17.3,14.5 V 5.5 H 23 M 17.3,9.8 H 21.6" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 28.5,10 H 40" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
</svg>
