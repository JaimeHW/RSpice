  <path d="M 0,30 H 10" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 10,4 H 30 V 36 H 10 Z" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 23,14.5 H 17 L 21.5,20 L 17,25.5 H 23" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 30,10 H 40" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 30,30 H 40" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
