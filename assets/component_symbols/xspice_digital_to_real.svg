<!-- Digital-to-real bridge (d_to_real): digital square wave becomes a
     real-valued event staircase (sample dots mark the real side).
     Box 40x20, pins in(0,10), enable(20,0) (optional), out(40,10). -->
<svg viewBox="0 0 40 20" xmlns="http://www.w3.org/2000/svg">
  <path d="M 0,10 H 8" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 20,0 V 2" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 8,2 H 32 V 18 H 8 Z" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 11,13 H 13 V 7 H 15.5 V 13 H 18" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 21.5,13 H 24 V 9.5 H 26.5 V 6 H 29" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 23,9.5 a 1,1 0 1 0 2,0 a 1,1 0 1 0 -2,0 Z" fill="#000000" stroke="none"/>
  <path d="M 25.5,6 a 1,1 0 1 0 2,0 a 1,1 0 1 0 -2,0 Z" fill="#000000" stroke="none"/>
  <path d="M 32,10 H 40" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
</svg>
