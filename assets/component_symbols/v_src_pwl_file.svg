<!-- File-backed PWL voltage source: the PWL trace drawn on a page, so it reads
     as the same waveform family as v_src_pwl but sourced from a data file.
     Box 28x40, pins +(14,0), -(14,40). -->
<svg viewBox="0 0 28 40" xmlns="http://www.w3.org/2000/svg">
  <path d="M 14,0 V 10" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 14,10 A 10,10 0 0 1 14,30 A 10,10 0 0 1 14,10" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 9,14.5 H 16.5 L 19,17 V 25.5 H 9 Z" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 16.5,14.5 V 17 H 19" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 10.6,22.6 L 12.6,19.4 L 14.6,21.8 L 17,18.9" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 14,30 V 40" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
</svg>
