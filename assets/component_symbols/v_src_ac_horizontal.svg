<?xml version="1.0" encoding="UTF-8"?>
<!-- AC voltage source, horizontal orientation (used at 90/270 rotation so the
     sine stays readable). Box 40x28, pins (0,14) and (40,14). -->
<svg viewBox="0 0 40 28" xmlns="http://www.w3.org/2000/svg">
  <path d="M 0,14 H 10" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 10,14 A 10,10 0 0 1 30,14 A 10,10 0 0 1 10,14" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 15,14 C 16.3,9.6 18.7,9.6 20,14 C 21.3,18.4 23.7,18.4 25,14" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 30,14 H 40" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
</svg>
