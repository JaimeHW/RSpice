  <path d="M 3.5,8 a 0.55,0.55 0 1 0 1.1,0 a 0.55,0.55 0 1 0 -1.1,0 Z" fill="#000000" stroke="none"/>
  <path d="M 3.5,10 a 0.55,0.55 0 1 0 1.1,0 a 0.55,0.55 0 1 0 -1.1,0 Z" fill="#000000" stroke="none"/>
