  <path d="M 11,13 V 7 H 13.2 V 13 H 15.4 V 7 H 18.8 V 13 H 22.2 V 7 H 27 V 13" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 13.5,16.5 L 24.8,5.2" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 26.5,3.5 L 25.16,6.4 L 23.6,4.84 Z" fill="#000000" stroke="none"/>
  <path d="M 32,10 H 40" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
</svg>
