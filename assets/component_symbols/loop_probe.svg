<?xml version="1.0" encoding="UTF-8"?>
<!-- Loop probe (stability injection plane). Box 40x20, pins (0,10) and (40,10).
     The conductor runs through unbroken: the probe is a 0 V source, a short at
     every operating point, and Tian's method measures the loop without opening
     it. The transverse bar marks the plane the loop gain is referred to; it is
     deliberately symmetric because the extracted gain does not depend on which
     way round the probe is placed. -->
<svg viewBox="0 0 40 20" xmlns="http://www.w3.org/2000/svg">
  <path d="M 0,10 H 40" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 14,10 A 6,6 0 0 1 26,10 A 6,6 0 0 1 14,10" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 20,1.5 V 18.5" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
</svg>
