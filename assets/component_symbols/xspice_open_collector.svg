  <path d="M 29,7.8 L 31.2,10 L 29,12.2 L 26.8,10 Z" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 26.8,13.4 H 31.2" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 31.2,10 H 40" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
</svg>
