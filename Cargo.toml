[workspace]
resolver = "2"
# Normal developer builds select the shipping applications and their dependency
# closure. Tools and all-model qualification remain explicit -p or
# --workspace builds; selecting every generated model is not a useful default.
default-members = ["crates/rspice-cli", "crates/rspice-app"]
members = [
    "crates/rspice-matrix",
    "crates/rspice-veriloga-runtime",
    "crates/rspice-veriloga-models",
    "crates/rspice-veriloga-models/models/*",
    "crates/rspice-core",
    "crates/rspice-core-base",
    "crates/rspice-core-netlist",
    "crates/rspice-core-devices",
    "crates/rspice-output",
    "crates/rspice-design-model",
    "crates/rspice-automation-protocol",
    "crates/rspice-automation-runtime",
    "crates/rspice-cli",
    "crates/rspice-pack",
    "crates/rspice-cloud-domain",
    "crates/rspice-cloud-contract",
    "crates/rspice-cloud-client",
    "crates/rspice-engine-adapter",
    "crates/rspice-publication-contract",
    "crates/rspice-publish",
    "tools/rspice-sheet-publisher",
    "crates/rspice-viewer",
    "crates/rspice-app",
    "crates/rspice-app-runs",
    "crates/rspice-app-workbench",
    "crates/rspice-app-hardcopy",
    "crates/rspice-app-cloud",
    "crates/rspice-app-results",
    "crates/rspice-app-settings",
    "crates/rspice-app-sheets",
    "crates/rspice-app-services",
    "crates/rspice-app-state",
    "crates/rspice-ui-kit",
    "crates/rspice-fonts",
    "crates/rspice-schematic-editor",
    "crates/rspice-results-ui",
    "crates/rspice-vocabulary",
    "crates/rspice-results",
    "crates/rspice-units",
    "crates/rspice-hardcopy-contract",
    "crates/rspice-hardcopy",
    "crates/rspice-model-library",
    "crates/rspice-design",
    "crates/rspice-project",
    "crates/rspice-project-contract",
    "crates/rspice-formats",
    "crates/rspice-simulation-contract",
    "crates/rspice-simulation",
    "crates/rspice-worker",
    "crates/rspice-veriloga",
    "tools/rspice-conformance",
    "tools/rspice-bench",
    "tools/xspice-catalog-dump",
    "tools/veriloga-catalog-dump",
]
# Third-party source built in place of its crates.io release; never a member,
# so the workspace's formatting, lint and test gates do not reach it.
exclude = ["vendor/epaint"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["RSpice Contributors"]
license-file = "LICENSE"
publish = false
rust-version = "1.94"

[workspace.dependencies]
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Core dependencies - faer for high-performance sparse linear algebra
faer = { version = "0.24", default-features = false, features = ["std"] }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
num-complex = { version = "0.4", features = ["serde"] }
qd = "0.8"
rustfft = "=6.4.1"

# Property testing. `default-features = false` with only `std` keeps this
# dev-dependency to the strategy engine and its shrinker: no process forking,
# no wall-clock timeouts and no entropy source, so a property case is a plain
# in-process call and a failure reproduces from the fixed seed each test
# declares.
proptest = { version = "1", default-features = false, features = ["std"] }

# Parallel computation
rayon = "1.10"

# Deterministic fast hashing for integer-keyed hot maps (matrix stamp lookup)
rustc-hash = "2.1"

# CLI
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
csv = "1.3"
# `float_roundtrip` because the default float parser is fast but NOT correctly
# rounded: it reads `1.3806505e-23` — Boltzmann's constant exactly as it appears
# in shipped Verilog-A models — back as `1.3806504999999999e-23`. RSpice
# round-trips compiled model artifacts through JSON: `PreparedVerilogARuntime`
# stores `CompiledModel`/`CanonicalIrArtifact` as JSON strings and digests those
# strings, so an inexact parse silently changes device physics while the
# artifact digest still matches — the JSON text is intact, only the parse is
# lossy. Exactness belongs to the artifact format rather than to whichever crate
# happens to parse it, so it is declared once here instead of per crate; relying
# on cargo's feature unification from one consumer would leave every other
# binary parsing the same artifacts inexactly. Adds no crate and does not move
# `Cargo.lock`.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
semver = "1.0"
# Wasm execution needs checked loading and bounded native stack use even when
# optimized dependencies do not eliminate interpreter tail calls.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "portable-dispatch", "extra-checks", "prefer-btree-collections"] }
toml = "1.1.3"
unicode-normalization = "0.1"
usvg = { version = "0.48", default-features = false, features = ["text"] }
ropey = "1.6.1"
regex = "1.12"
web-time = "1.1"

# Cloud client closure. These pins mirror the RSpice-Cloud workspace pins the
# vendored crates were tested against (tools/cloud/vendor-manifest.json records
# the source commit); keep them aligned when re-syncing.
base64 = "0.23"
# Pure-Rust ed25519 with no default features: the pack trust crate verifies
# signatures and never needs a random-number source, so the browser image links
# only the verifying half.
ed25519-dalek = { version = "2.2", default-features = false, features = ["zeroize"] }
futures-util = "0.3"
flate2 = "1.1"
getrandom = "0.4"
gloo-timers = "0.4"
http = "1.3"
js-sys = "0.3"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
mime = "0.3"
miniz_oxide = "0.8"
reqwest = { version = "0.13.1", default-features = false, features = ["default-tls", "json", "webpki-roots"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2.5"
uuid = { version = "1.0", features = ["serde", "v4", "v7"] }
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
wasm-encoder = "0.262"
wasmparser = "0.262"
wasm-streams = "0.7"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "Headers",
    "ReadableStream",
    "ReferrerPolicy",
    "Request",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "RequestRedirect",
    "Response",
    "ServiceWorkerGlobalScope",
] }

# Internal crates
rspice-app-runs = { path = "crates/rspice-app-runs", version = "0.1.0" }
rspice-app-services = { path = "crates/rspice-app-services", version = "0.1.0" }
rspice-app-state = { path = "crates/rspice-app-state", version = "0.1.0" }
rspice-app-workbench = { path = "crates/rspice-app-workbench", version = "0.1.0" }
rspice-app-hardcopy = { path = "crates/rspice-app-hardcopy", version = "0.1.0" }
rspice-app-cloud = { path = "crates/rspice-app-cloud", version = "0.1.0" }
rspice-app-results = { path = "crates/rspice-app-results", version = "0.1.0" }
rspice-app-settings = { path = "crates/rspice-app-settings", version = "0.1.0" }
rspice-app-sheets = { path = "crates/rspice-app-sheets", version = "0.1.0" }
rspice-ui-kit = { path = "crates/rspice-ui-kit", version = "0.1.0" }
rspice-fonts = { path = "crates/rspice-fonts", version = "0.1.0" }
rspice-schematic-editor = { path = "crates/rspice-schematic-editor", version = "0.1.0" }
rspice-results-ui = { path = "crates/rspice-results-ui", version = "0.1.0" }
rspice-vocabulary = { path = "crates/rspice-vocabulary", version = "0.1.0" }
rspice-results = { path = "crates/rspice-results", version = "0.1.0" }
rspice-units = { path = "crates/rspice-units", version = "0.1.0" }
rspice-hardcopy-contract = { path = "crates/rspice-hardcopy-contract", version = "0.1.0" }
rspice-hardcopy = { path = "crates/rspice-hardcopy", version = "0.1.0" }
rspice-model-library = { path = "crates/rspice-model-library", version = "0.1.0" }
rspice-design = { path = "crates/rspice-design", version = "0.1.0" }
rspice-project = { path = "crates/rspice-project", version = "0.1.0" }
rspice-project-contract = { path = "crates/rspice-project-contract", version = "0.1.0" }
rspice-formats = { path = "crates/rspice-formats", version = "0.1.0" }
rspice-simulation-contract = { path = "crates/rspice-simulation-contract", version = "0.1.0" }
rspice-simulation = { path = "crates/rspice-simulation", version = "0.1.0" }
rspice-cloud-client = { path = "crates/rspice-cloud-client", version = "0.1.0" }
rspice-design-model = { path = "crates/rspice-design-model", version = "0.1.0" }
rspice-matrix = { path = "crates/rspice-matrix", version = "0.1.0" }
rspice-output = { path = "crates/rspice-output", version = "0.1.0" }
rspice-pack = { path = "crates/rspice-pack", version = "0.1.0" }
rspice-publication-contract = { path = "crates/rspice-publication-contract", version = "0.1.0" }
rspice-publish = { path = "crates/rspice-publish", version = "0.1.0" }
rspice-veriloga-runtime = { path = "crates/rspice-veriloga-runtime", version = "0.1.0" }
rspice-veriloga-models = { path = "crates/rspice-veriloga-models", version = "0.1.0", default-features = false }
rspice-core = { path = "crates/rspice-core", version = "0.1.0" }
rspice-core-base = { path = "crates/rspice-core-base", version = "0.1.0", default-features = false }
rspice-core-netlist = { path = "crates/rspice-core-netlist", version = "0.1.0", default-features = false }
rspice-core-devices = { path = "crates/rspice-core-devices", version = "0.1.0", default-features = false }

# crates.io epaint 0.35.0 with the fix for emilk/egui#8576 (right-to-left runs
# got 2n-1 glyphs); see tools/vendor/vendor_epaint.py. Delete it, and the
# exclude above, at the first egui release that ships the fix.
[patch.crates-io]
epaint = { path = "vendor/epaint" }

# One lint policy for the whole workspace. Crates opt in with
# `lints.workspace = true`, so tightening a rule is a single edit here rather
# than seven. Everything below is currently clean tree-wide: these are
# ratchets against regression, not a cleanup backlog.
[workspace.lints.clippy]
# Debugging scaffolding and unfinished code must never reach a release build.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Enable incremental compilation for faster rebuilds
[profile.dev]
incremental = true

# Every Windows/MSVC build already links with `/DEBUG:NONE` (see
# `.cargo/config.toml`, a LNK1328 workaround for the big release test
# binaries), so no PDB is emitted for any target and `RUST_BACKTRACE=1` prints
# `<unknown>` frames whatever this says. Cargo's default of `true` therefore
# had rustc emit full CodeView info into every object and rlib for a linker
# that discards it: `librspice_core`'s debug rlib measured 761 MB against 43 MB
# for the largest release rlib in the workspace, and one target directory held
# 15.4 GB of debug rlibs against 0.2 GB of release ones. Every lane worktree
# owns a target directory, so that multiplied.
#
# Nothing reads the discarded information — no crate in the workspace uses
# `backtrace::`, `Backtrace::capture` or `RUST_BACKTRACE`. To debug one target,
# override both halves together, since setting `RUSTFLAGS` replaces the
# config's target rustflags entirely:
#
#   RUSTFLAGS="-C debuginfo=2 -C link-arg=/DEBUG:FULL -C llvm-args=-fast-isel=false" \
#     cargo test -p <crate> --test <target> --no-run
#
# For a recorded Windows x64 diagnostic build, use
# tools/diagnostics/build-windows.ps1 and the opt-in profile below.
debug = 0

# Every dependency is optimized in debug builds; the workspace's own crates are
# not, because `"*"` does not match a workspace member.
#
# The GUI suite renders real surfaces. A single case opens an `egui::Context`,
# lays out a 1400x2600 page and rasterizes every glyph on it, and the workbench
# tests do that thousands of times over — the studio's press sweep alone builds
# three hundred of them. Unoptimized, egui's layout and its text stack
# (harfrust shaping, skrifa outlines, vello_cpu rasterization) is where most of
# `cargo test -p rspice-app --lib` goes.
#
# Measured on a 28-core Windows box: the press-sweep module falls from 23s to
# 7.6s and the whole rspice-app library suite from 74s to 49s, for one dependency
# rebuild of about fifteen minutes. Restricting this to the render and text
# crates by name was measured too: it bought the same 7.6s on the sweep but only
# 60s on the suite, and it is a list that goes stale the next time egui changes
# which shaper it uses.
#
# Only `opt-level` is set. Debug info is untouched on both sides — the Windows
# link already runs with `/DEBUG:NONE` and the backtrace story is delicate — and
# `profile.release` is not involved.
[profile.dev.package."*"]
opt-level = 2

# The one workspace member optimized in debug builds. faer's dense eigen code
# is generic, so it is compiled in whichever crate calls it, and called from
# rspice-core it ran at `opt-level = 0`. rspice-matrix instantiates it, with
# the O(n³) residual qualification, behind the concrete
# `qualified_dense_eigenspectrum`. Measured in a debug test build: the
# cascaded-delay-line PSS case, whose 592-state Floquet spectrum dominated it,
# fell from 40 s to 6 s; this package's non-incremental build went from 3 s
# to 10 s.
[profile.dev.package.rspice-matrix]
opt-level = 2

[profile.release]
# Keep full per-function LLVM optimization while compiling independent solver
# and generated-device units in parallel. Whole-program fat LTO plus one
# codegen unit exceeded the five-minute cold-build budget and did not improve
# the KLU or generated-device runtime benchmarks.
incremental = false
lto = false
codegen-units = 16
opt-level = 3

[profile.generator]
inherits = "release"
incremental = true
lto = false
codegen-units = 16

# The published-page viewer runtime, built only for wasm32 by the component
# release workflow. Its small dependency tree makes whole-program LTO and a
# single codegen unit practical for reducing the first-activation download.
[profile.viewer-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Browser delivery is constrained by download, compilation, and per-instance
# memory costs. Optimize the shipped wasm for size and retain cross-crate thin
# LTO without the prohibitive link latency measured for fat LTO on this large
# application. Hot solver and JIT paths are benchmarked independently.
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# A part drag in the schematic editor runs these crates' connectivity, wire
# clean-up and sheet reconciliation on every frame, and its frames are held to
# the budgets in `rspice-app`'s `schematic::view::frame_cost`: each move under
# 8 ms, the drop within one 60 Hz frame. Built at "z", the shipping wasm missed
# both under Node (slowest move 8.3-8.5 ms, drop 18.0-18.8 ms); at "s" it
# meets them (7.6-7.7 ms, 15.0-15.6 ms). The production UI image grows 1.0 %
# raw (110.37 to 111.44 MiB) and 1.5 % gzipped (29.90 to 30.34 MiB). Levels 2
# and 3 were no faster and grew it 5.0 % and 5.5 % gzipped.
[profile.web-release.package.rspice-design-model]
opt-level = "s"

[profile.web-release.package.rspice-design]
opt-level = "s"

[profile.web-release.package.rspice-project]
opt-level = "s"

# Faster test compilation
[profile.test]
incremental = true
# For the reason `[profile.dev]` gives: the debug info this would emit is
# discarded by `/DEBUG:NONE` at link time, and the test binaries are the
# largest artifacts in the tree.
debug = 0

# Opt-in symbol-bearing builds. On Windows use the diagnostic build script:
# the ordinary /DEBUG:NONE linker workaround must be overridden as well.
# SelectionDAG remains required on Windows x64 for the callback regression.
[profile.diagnostic]
inherits = "dev"
debug = 2
incremental = false
strip = "none"
