[workspace]
resolver = "2"
members = [
    "crates/rspice-matrix",
    "crates/rspice-veriloga-runtime",
    "crates/rspice-veriloga-models",
    "crates/rspice-veriloga-models/models/*",
    "crates/rspice-core",
    "crates/rspice-cli",
    "crates/rspice-ui",
    "crates/rspice-veriloga",
    "crates/rspice-python",
    "crates/rspice-wasm",
    "crates/rspice-bench",
    "crates/rspice-conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["RSpice Contributors"]
license-file = "LICENSE"
publish = false
repository = "https://github.com/JaimeHW/RSpice"
rust-version = "1.94"

[workspace.dependencies]
# Core dependencies - faer for high-performance sparse linear algebra
faer = { version = "0.23", default-features = false, features = ["std"] }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
num-complex = { version = "0.4", features = ["serde"] }
rustfft = "6.2"

# Parallel computation
rayon = "1.10"
portable-atomic = { version = "1.10", features = ["float"] }

# Deterministic fast hashing for integer-keyed hot maps (matrix stamp lookup)
rustc-hash = "2.1"

# Parsing
nom = "8.0"

# CLI
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
unicode-normalization = "0.1"


# Internal crates
rspice-matrix = { path = "crates/rspice-matrix", version = "0.1.0" }
rspice-veriloga-runtime = { path = "crates/rspice-veriloga-runtime", version = "0.1.0" }
rspice-veriloga-models = { path = "crates/rspice-veriloga-models", version = "0.1.0", default-features = false }
rspice-core = { path = "crates/rspice-core", version = "0.1.0" }

# One lint policy for the whole workspace. Crates opt in with
# `lints.workspace = true`, so tightening a rule is a single edit here rather
# than seven. Everything below is currently clean tree-wide: these are
# ratchets against regression, not a cleanup backlog.
[workspace.lints.clippy]
# Debugging scaffolding and unfinished code must never reach a release build.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Enable incremental compilation for faster rebuilds
[profile.dev]
incremental = true

[profile.release]
# Keep full per-function LLVM optimization while compiling independent solver
# and generated-device units in parallel. Whole-program fat LTO plus one
# codegen unit exceeded the five-minute cold-build budget and did not improve
# the KLU or generated-device runtime benchmarks.
incremental = false
lto = false
codegen-units = 16
opt-level = 3

[profile.generator]
inherits = "release"
incremental = true
lto = false
codegen-units = 16

# Faster test compilation
[profile.test]
incremental = true
