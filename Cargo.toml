[workspace]
resolver = "2"
members = [
    "crates/rspice-core",
    "crates/rspice-cli",
    "crates/rspice-ui",
    "crates/rspice-veriloga",
    "crates/rspice-python",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["RSpice Contributors"]
license-file = "LICENSE"
repository = "https://github.com/JaimeHW/rspice"
rust-version = "1.85"

[workspace.dependencies]
# Core dependencies - faer for high-performance sparse linear algebra
faer = { version = "0.23", default-features = false, features = ["std"] }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
num-complex = "0.4"
rustfft = "6.2"

# Parallel computation
rayon = "1.10"
portable-atomic = { version = "1.10", features = ["float"] }

# Parsing
nom = "8.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Testing
approx = "0.5"

# Internal crates
rspice-core = { path = "crates/rspice-core" }

# Enable incremental compilation for faster rebuilds
[profile.dev]
incremental = true

[profile.release]
incremental = true

# Faster test compilation
[profile.test]
incremental = true
