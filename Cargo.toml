[workspace]
resolver = "2"
members = [
    "crates/rspice-core",
    "crates/rspice-cli",
    "crates/rspice-ui",
    "crates/rspice-veriloga",
    "crates/rspice-python",
    "crates/rspice-wasm",
    "crates/rspice-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["RSpice Contributors"]
license-file = "LICENSE"
publish = false
repository = "https://github.com/JaimeHW/RSpice"
rust-version = "1.94"

[workspace.dependencies]
# Core dependencies - faer for high-performance sparse linear algebra
faer = { version = "0.23", default-features = false, features = ["std"] }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
num-complex = "0.4"
rustfft = "6.2"

# Parallel computation
rayon = "1.10"
portable-atomic = { version = "1.10", features = ["float"] }

# Deterministic fast hashing for integer-keyed hot maps (matrix stamp lookup)
rustc-hash = "2.1"

# Parsing
nom = "8.0"

# CLI
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


# Internal crates
rspice-core = { path = "crates/rspice-core", version = "0.1.0" }

# Enable incremental compilation for faster rebuilds
[profile.dev]
incremental = true

[profile.release]
# Release artifacts should prioritize deterministic, fully optimized builds.
# Fat LTO + a single codegen unit let the optimizer inline faer's sparse
# kernels straight into the Newton/transient hot loops across crate
# boundaries; both are required for peak solver throughput.
incremental = false
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.generator]
inherits = "release"
incremental = true
lto = false
codegen-units = 16

# Faster test compilation
[profile.test]
incremental = true
