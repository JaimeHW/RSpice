[package]
name = "rspice-engine-adapter"
description = "Self-contained RSpice engine executor for the credentialless cloud worker protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rspice-core.workspace = true
rspice-output.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
uuid = { version = "1.0", default-features = false, features = ["serde", "std"] }

[dev-dependencies]
proptest.workspace = true

[target.'cfg(not(windows))'.dependencies]
# `termination` widens the handler past SIGINT to the SIGTERM a supervising
# worker actually sends, which is the stop request this executor must honor.
ctrlc = { version = "3.4", features = ["termination"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[lints]
workspace = true
