[package]
name = "rspice-ui-kit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Plot painting shares the results owner's exact axis and sampling contracts.
plot = ["dep:rspice-app-types", "dep:rspice-results"]
# Existing CPU render helpers shared by widget and application tests.
test-support = ["dep:sha2"]

[dependencies]
egui = { version = "0.36.2", default-features = false }
serde.workspace = true
unicode-segmentation = "1.12"
rspice-app-types = { workspace = true, optional = true }
rspice-results = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
