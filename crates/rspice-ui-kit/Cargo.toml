[package]
name = "rspice-ui-kit"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Plot painting shares the results owner's exact axis and sampling contracts.
plot = ["dep:rspice-vocabulary", "dep:rspice-results"]
# Existing CPU render helpers shared by widget and application tests.
test-support = ["dep:sha2"]

[dependencies]
egui = { version = "0.35.0", default-features = false }
rspice-fonts = { workspace = true, features = ["bidi", "egui"] }
serde.workspace = true
unicode-segmentation = "1.12"
rspice-vocabulary = { workspace = true, optional = true }
rspice-results = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# A desktop letters what no embedded face has from the faces installed there.
rspice-fonts = { workspace = true, features = ["bidi", "egui", "system"] }

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
