[package]
name = "rspice-simulation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
pdk-test-fixtures = ["dep:ed25519-dalek", "dep:wat"]
generated-veriloga-catalog = ["rspice-design/generated-veriloga-catalog"]
wasm-jit = ["rspice-veriloga/wasm-jit"]

[dependencies]
ed25519-dalek = { workspace = true, features = ["std"], optional = true }
wat = { version = "1", optional = true }
log.workspace = true
web-time.workspace = true
num-complex.workspace = true
base64.workspace = true
rspice-app-types.workspace = true
rspice-project-contract.workspace = true
rspice-results = { workspace = true, features = ["engine-evidence"] }
rspice-design.workspace = true
rspice-design-model.workspace = true
rspice-simulation-contract.workspace = true
rspice-model-library.workspace = true
rspice-core = { path = "../rspice-core", version = "0.1.0", default-features = false, features = ["veriloga"] }
rspice-veriloga = { path = "../rspice-veriloga", version = "0.1.0" }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v5"] }
wasmi.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent"] }

[dev-dependencies]
ed25519-dalek = { workspace = true, features = ["std"] }
wat = "1"
rspice-design = { workspace = true, features = ["schematic-test-fixtures"] }
ron = { version = "0.12.2", features = ["integer128"] }
