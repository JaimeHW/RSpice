[package]
name = "rspice-veriloga"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Verilog-A/AMS compiler for RSpice circuit simulator"

[lib]
doctest = false

[[bin]]
name = "rspice-veriloga-gen"
path = "src/bin/rspice-veriloga-gen.rs"
required-features = ["rust-codegen"]

[dependencies]
# Core dependencies
thiserror.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
blake3 = "1.5"
rspice-veriloga-runtime = { workspace = true, features = ["serde"] }
web-time = "1.1"
wasm-encoder = { workspace = true, optional = true }
wasmparser = { workspace = true, optional = true }

# Complex arithmetic for the s-domain (Laplace) filter realization.
num-complex = { workspace = true }
# Exact digital arithmetic beyond a machine word; already used by rspice-core.
num-bigint = "0.4.8"
num-traits = "0.2.19"

# Data structures
indexmap = "2.7"
smol_str = { version = "0.3", features = ["serde"] }

# Native JIT executable memory support.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
# Execution-level conformance tests run emitted secondary modules in an
# independent WebAssembly engine. This is test-only and cannot inflate either
# browser code image.
wasmi = { version = "1.1.0", default-features = false, features = ["std", "extra-checks", "prefer-btree-collections"] }

[features]
# Preserve the compiler/tooling API by default. Engine-only consumers disable
# defaults to omit the offline emitter while retaining serialized report types.
default = ["rust-codegen"]
rust-codegen = []
# Enable RSpice native JIT compilation. Native mode is full JIT or error.
native = ["dep:windows-sys", "dep:libc"]
# Compile deterministic standard WebAssembly modules from the canonical JIT
# plan. The emitter and verifier are host-testable; browser instantiation lives
# in the UI worker and is selected separately from the portable interpreter.
wasm-jit = ["dep:wasm-encoder", "dep:wasmparser"]
# Internal contract-test surface for the bytecode-native backend. Production
# native users must supply canonical IR and must not enable this feature.
native-bytecode-contract-tests = ["native"]

[lints]
workspace = true

# These suites exercise emitted Rust or the generator's corpus tooling.
# Runtime-only builds retain the remaining frontend, VM, and JIT suites.

[[test]]
name = "canonical_device"
required-features = ["rust-codegen"]

[[test]]
name = "canonical_ir"
required-features = ["rust-codegen"]

[[test]]
name = "canonical_state_correspondence"
required-features = ["rust-codegen"]

[[test]]
name = "cfg_derivatives"
required-features = ["rust-codegen"]

[[test]]
name = "cfg_emission"
required-features = ["rust-codegen"]

[[test]]
name = "cfg_lane_census"
required-features = ["rust-codegen"]

[[test]]
name = "cfg_lowering"
required-features = ["rust-codegen"]

[[test]]
name = "cfg_noise"
required-features = ["rust-codegen"]

[[test]]
name = "cfg_runtime"
required-features = ["rust-codegen"]

[[test]]
name = "cfg_scale"
required-features = ["rust-codegen"]

[[test]]
name = "cfg_stamp_plan"
required-features = ["rust-codegen"]

[[test]]
name = "digital_process_ir"
required-features = ["rust-codegen"]

[[test]]
name = "frontend_determinism"
required-features = ["rust-codegen"]

[[test]]
name = "frontend_profile"
required-features = ["rust-codegen"]

[[test]]
name = "generated_output_audit"
required-features = ["rust-codegen"]

[[test]]
name = "hierarchy_elaboration"
required-features = ["rust-codegen"]

[[test]]
name = "module_timing"
required-features = ["rust-codegen"]

[[test]]
name = "noise_processes"
required-features = ["rust-codegen"]

[[test]]
name = "runtime_compile_report"
required-features = ["rust-codegen"]
