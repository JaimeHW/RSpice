[package]
name = "rspice-veriloga"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Verilog-A/AMS compiler for RSpice circuit simulator"

[dependencies]
# Core dependencies
thiserror.workspace = true
log.workspace = true

# Parsing - using nom for professional-grade parsing
nom.workspace = true

# Data structures
indexmap = "2.7"
smol_str = "0.3"

# Native compilation support (optional) - Cranelift JIT
cranelift = { version = "0.115", optional = true }
cranelift-jit = { version = "0.115", optional = true }
cranelift-module = { version = "0.115", optional = true }
cranelift-codegen = { version = "0.115", optional = true }
cranelift-native = { version = "0.115", optional = true }

[build-dependencies]

[dev-dependencies]
approx.workspace = true
env_logger.workspace = true

[features]
default = []
# Enable Verilog-AMS mixed-signal support
ams = []
# Enable native JIT compilation via Cranelift
native = ["cranelift", "cranelift-jit", "cranelift-module", "cranelift-codegen", "cranelift-native"]
