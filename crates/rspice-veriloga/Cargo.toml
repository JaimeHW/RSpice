[package]
name = "rspice-veriloga"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Verilog-A/AMS compiler for RSpice circuit simulator"

[lib]
doctest = false

[dependencies]
# Core dependencies
thiserror.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
blake3 = "1.5"
rspice-veriloga-runtime.workspace = true
web-time = "1.1"
wasm-encoder = { workspace = true, optional = true }
wasmparser = { workspace = true, optional = true }

# Parsing - using nom for professional-grade parsing
nom.workspace = true

# Complex arithmetic for the s-domain (Laplace) filter realization.
num-complex = { workspace = true }

# Data structures
indexmap = "2.7"
smol_str = { version = "0.3", features = ["serde"] }

# Native JIT executable memory support.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
# Execution-level conformance tests run emitted secondary modules in an
# independent WebAssembly engine. This is test-only and cannot inflate either
# browser code image.
wasmi = { version = "1.1.0", default-features = false, features = ["std", "extra-checks", "prefer-btree-collections"] }
# `serde_json`'s default float parser is fast but not correctly rounded: it
# reads `1.3806505e-23` back as `1.3806504999999999e-23`. The whole-corpus
# census cache stores front-end artifacts as JSON and is only allowed to answer
# with exactly what the compiler produced, so its parse has to be exact. The
# feature adds no crate and does not move `Cargo.lock`; declared here rather
# than under `[dependencies]` so it is scoped to this crate's own test build
# and changes nothing about how anything ships.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[features]
default = []
# Enable RSpice native JIT compilation. Native mode is full JIT or error.
native = ["dep:windows-sys", "dep:libc"]
# Compile deterministic standard WebAssembly modules from the canonical JIT
# plan. The emitter and verifier are host-testable; browser instantiation lives
# in the UI worker and is selected separately from the portable interpreter.
wasm-jit = ["dep:wasm-encoder", "dep:wasmparser"]
# Internal contract-test surface for the bytecode-native backend. Production
# native users must supply canonical IR and must not enable this feature.
native-bytecode-contract-tests = ["native"]

[lints]
workspace = true
