[package]
name = "rspice-core-netlist"
description = "The RSpice engine's reading of a deck: netlist parsing and flattening, model libraries and the control-session vocabulary"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

# The feature set is rspice-core's, key for key, so that `family_features!`
# can assert at compile time that the crates agree; every feature forwards
# to rspice-core-base, and rspice-core forwards every one of them here.
[features]
default = ["faer-parallel", "parallel"]
wasm = ["rspice-core-base/wasm"]
parallel = ["rspice-core-base/parallel"]
faer-parallel = [
    "rspice-veriloga-runtime/faer-parallel",
    "rspice-core-base/faer-parallel",
]
veriloga = ["rspice-core-base/veriloga"]
veriloga-native = ["veriloga", "rspice-core-base/veriloga-native"]
veriloga-wasm-jit = ["veriloga", "rspice-core-base/veriloga-wasm-jit"]
veriloga-builtins-base = [
    "dep:rspice-veriloga-models",
    "rspice-core-base/veriloga-builtins-base",
]
veriloga-builtins-noise = [
    "veriloga-builtins-base",
    "rspice-veriloga-models/veriloga-builtins-noise",
    "rspice-core-base/veriloga-builtins-noise",
]
veriloga-model-diode-cmc = [
    "veriloga-builtins-base",
    "rspice-veriloga-models/veriloga-model-diode-cmc",
    "rspice-core-base/veriloga-model-diode-cmc",
]
