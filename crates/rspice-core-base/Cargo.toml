[package]
name = "rspice-core-base"
description = "The vocabulary every crate of the RSpice engine reads: numerics, solver, expressions, configuration and IO"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
rust-version.workspace = true

# The feature set is rspice-core's, key for key, so that `family_features!`
# can assert at compile time that the two agree; rspice-core forwards every
# one of them here. A feature this crate does not read is an empty list.
[features]
default = ["faer-parallel", "parallel"]
wasm = []
parallel = []
faer-parallel = [
    "rspice-matrix/faer-parallel",
    "rspice-veriloga-runtime/faer-parallel",
]
veriloga = []
veriloga-native = []
veriloga-wasm-jit = []
veriloga-builtins-base = []
veriloga-builtins-noise = []
veriloga-model-diode-cmc = []
veriloga-model-epfl-hemt-10a = []
veriloga-model-juncap200 = []
veriloga-model-psp104tva = []
veriloga-model-psp104va = []
veriloga-model-pspnqs104va = []
veriloga-model-angelov = []
veriloga-model-angelov-gan = []
veriloga-model-asmesd = []
veriloga-model-asmesd-dio = []
veriloga-model-asmhemt = []
veriloga-model-bjt505-va = []
veriloga-model-bjt505t-va = []
veriloga-model-bjtd505-va = []
veriloga-model-bjtd505t-va = []
veriloga-model-bsimbulk = []
veriloga-model-bsimcmg-va = []
veriloga-model-bsimimg = []
veriloga-model-bsimsoi-18c250bc = []
veriloga-model-bsimsoi-e2aff994 = []
veriloga-model-bsimsoi-va = []
veriloga-model-ekv3-rf = []
veriloga-model-ekv-va = []
veriloga-model-hicuml0va = []
veriloga-model-hicuml2va = []
veriloga-model-hisimhv-n4-va = []
veriloga-model-hisimhv-n5-va = []
veriloga-model-hisimhv-va = []
veriloga-model-hisimsoi-va-5be18005 = []
veriloga-model-hisimsoi-va-242bc21d = []
veriloga-model-hisimsoi-va-38074d06 = []
veriloga-model-hisimsotb-va = []
veriloga-model-l-utsoi-832ce87d = []
veriloga-model-l-utsoi-485e0ac9 = []
veriloga-model-mosvar = []
veriloga-model-mvsg-cmc = []
veriloga-model-r2-cmc = []
veriloga-model-r2-et-cmc = []
veriloga-model-r3-cmc = []
veriloga-model-vbic13 = []
veriloga-model-vbic13-3t-et = []
veriloga-model-vbic13-4t = []
veriloga-model-vbic-4t-et-cf = []
veriloga-builtins-models = []
veriloga-builtins = []
# Test helpers a crate built on this one compiles into its own unit tests.
# Additive only: it adds hidden items and changes no behaviour.
test-support = []

[lib]
doctest = false

[dependencies]
thiserror.workspace = true
log.workspace = true
num-complex.workspace = true
# Exact sparse rank decisions for ideal-source shooting constraints.
num-bigint = "0.4.8"
libm = "0.2"
# Pure-Rust HDF5, MIT, no C dependency. `mmap` is a default feature and is off
# here: `io::hdf5` builds a document in memory and hands the bytes to a writer,
# so nothing on the wasm path reaches for a file or a mapping.
rustyhdf5 = { version = "1.93", default-features = false }
rspice-matrix.workspace = true
rspice-veriloga-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
