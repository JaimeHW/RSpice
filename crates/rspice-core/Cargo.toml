[package]
name = "rspice-core"
description = "High-performance SPICE circuit simulation engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# parallel + simd ship in the default set so the CLI, Python bindings,
# and the default test configuration all exercise the fast paths;
# rspice-wasm opts out via default-features = false.
default = ["faer-parallel", "parallel", "simd"]
wasm = ["wasm-bindgen"]
parallel = ["rayon", "portable-atomic"]
faer-parallel = [
    "faer/rayon",
    "rspice-matrix/faer-parallel",
    "rspice-veriloga-runtime/faer-parallel",
]
veriloga = [
    "dep:rspice-veriloga",
    "dep:dirs",
]
# Native JIT for Verilog-A devices (native targets only). Native mode is full JIT or error.
veriloga-native = ["veriloga", "rspice-veriloga/native"]
# Browser JIT compiler. Runtime module compilation/instantiation is performed
# by the owning Web Worker; the core retains the authenticated artifacts and
# synchronous solver integration.
veriloga-wasm-jit = ["veriloga", "rspice-veriloga/wasm-jit"]
# Runtime integration shared by every build-time generated Verilog-A model.
# Prefer a `veriloga-model-*` feature for small production binaries and fast builds.
veriloga-builtins-base = ["dep:rspice-veriloga-models"]
# Noise analysis is independently selectable because its generated schedules are
# more than half of the checked-in Rust source. The compatibility umbrella below
# retains the historical all-model, noise-enabled behavior.
veriloga-builtins-noise = [
    "veriloga-builtins-base",
    "rspice-veriloga-models/veriloga-builtins-noise",
]
