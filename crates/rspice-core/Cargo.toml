[package]
name = "rspice-core"
description = "High-performance SPICE circuit simulation engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# parallel + simd ship in the default set so the CLI, Python bindings,
# and the default test configuration all exercise the fast paths;
# rspice-wasm opts out via default-features = false.
default = ["faer-parallel", "parallel", "simd"]
wasm = ["wasm-bindgen", "getrandom/js"]
parallel = ["rayon", "portable-atomic"]
faer-parallel = ["faer/rayon"]
ffi = ["libloading"]
veriloga = [
    "dep:rspice-veriloga",
    "dep:serde",
    "dep:serde_json",
    "dep:dirs",
]
# Native JIT for Verilog-A devices (native targets only). Native mode is full JIT or error.
veriloga-native = ["veriloga", "rspice-veriloga/native"]
# Runtime integration shared by every build-time generated Verilog-A model.
# Prefer a `veriloga-model-*` feature for small production binaries and fast builds.
veriloga-builtins-base = []
# Noise analysis is independently selectable because its generated schedules are
# more than half of the checked-in Rust source. The compatibility umbrella below
# retains the historical all-model, noise-enabled behavior.
veriloga-builtins-noise = ["veriloga-builtins-base"]
veriloga-model-diode-cmc = ["veriloga-builtins-base"]
veriloga-model-epfl-hemt-10a = ["veriloga-builtins-base"]
veriloga-model-juncap200 = ["veriloga-builtins-base"]
veriloga-model-psp104tva = ["veriloga-builtins-base"]
veriloga-model-psp104va = ["veriloga-builtins-base"]
veriloga-model-pspnqs104va = ["veriloga-builtins-base"]
veriloga-model-angelov = ["veriloga-builtins-base"]
veriloga-model-angelov-gan = ["veriloga-builtins-base"]
veriloga-model-asmesd = ["veriloga-builtins-base"]
veriloga-model-asmesd-dio = ["veriloga-builtins-base"]
veriloga-model-asmhemt = ["veriloga-builtins-base"]
veriloga-model-bjt505-va = ["veriloga-builtins-base"]
veriloga-model-bjt505t-va = ["veriloga-builtins-base"]
veriloga-model-bjtd505-va = ["veriloga-builtins-base"]
veriloga-model-bjtd505t-va = ["veriloga-builtins-base"]
veriloga-model-bsimbulk = ["veriloga-builtins-base"]
veriloga-model-bsimcmg-va = ["veriloga-builtins-base"]
veriloga-model-bsimimg = ["veriloga-builtins-base"]
veriloga-model-bsimsoi-18c250bc = ["veriloga-builtins-base"]
veriloga-model-bsimsoi-e2aff994 = ["veriloga-builtins-base"]
veriloga-model-bsimsoi-va = ["veriloga-builtins-base"]
veriloga-model-ekv-va = ["veriloga-builtins-base"]
veriloga-model-hicuml0va = ["veriloga-builtins-base"]
veriloga-model-hicuml2va = ["veriloga-builtins-base"]
veriloga-model-hisimhv-n4-va = ["veriloga-builtins-base"]
veriloga-model-hisimhv-n5-va = ["veriloga-builtins-base"]
veriloga-model-hisimhv-va = ["veriloga-builtins-base"]
veriloga-model-hisimsoi-va-5be18005 = ["veriloga-builtins-base"]
veriloga-model-hisimsoi-va-242bc21d = ["veriloga-builtins-base"]
veriloga-model-hisimsoi-va-38074d06 = ["veriloga-builtins-base"]
veriloga-model-hisimsotb-va = ["veriloga-builtins-base"]
veriloga-model-l-utsoi-832ce87d = ["veriloga-builtins-base"]
veriloga-model-l-utsoi-485e0ac9 = ["veriloga-builtins-base"]
veriloga-model-mosvar = ["veriloga-builtins-base"]
veriloga-model-mvsg-cmc = ["veriloga-builtins-base"]
veriloga-model-r2-cmc = ["veriloga-builtins-base"]
veriloga-model-r2-et-cmc = ["veriloga-builtins-base"]
veriloga-model-r3-cmc = ["veriloga-builtins-base"]
veriloga-model-vbic13 = ["veriloga-builtins-base"]
veriloga-model-vbic13-3t-et = ["veriloga-builtins-base"]
veriloga-model-vbic13-4t = ["veriloga-builtins-base"]
veriloga-model-vbic-4t-et-cf = ["veriloga-builtins-base"]
# Complete generated model catalog without the optional noise schedules.
veriloga-builtins-models = [
    "veriloga-model-diode-cmc",
    "veriloga-model-epfl-hemt-10a",
    "veriloga-model-juncap200",
    "veriloga-model-psp104tva",
    "veriloga-model-psp104va",
    "veriloga-model-pspnqs104va",
    "veriloga-model-angelov",
    "veriloga-model-angelov-gan",
    "veriloga-model-asmesd",
    "veriloga-model-asmesd-dio",
    "veriloga-model-asmhemt",
    "veriloga-model-bjt505-va",
    "veriloga-model-bjt505t-va",
    "veriloga-model-bjtd505-va",
    "veriloga-model-bjtd505t-va",
    "veriloga-model-bsimbulk",
    "veriloga-model-bsimcmg-va",
    "veriloga-model-bsimimg",
    "veriloga-model-bsimsoi-18c250bc",
    "veriloga-model-bsimsoi-e2aff994",
    "veriloga-model-bsimsoi-va",
    "veriloga-model-ekv-va",
    "veriloga-model-hicuml0va",
    "veriloga-model-hicuml2va",
    "veriloga-model-hisimhv-n4-va",
    "veriloga-model-hisimhv-n5-va",
    "veriloga-model-hisimhv-va",
    "veriloga-model-hisimsoi-va-5be18005",
    "veriloga-model-hisimsoi-va-242bc21d",
    "veriloga-model-hisimsoi-va-38074d06",
    "veriloga-model-hisimsotb-va",
    "veriloga-model-l-utsoi-832ce87d",
    "veriloga-model-l-utsoi-485e0ac9",
    "veriloga-model-mosvar",
    "veriloga-model-mvsg-cmc",
    "veriloga-model-r2-cmc",
    "veriloga-model-r2-et-cmc",
    "veriloga-model-r3-cmc",
    "veriloga-model-vbic13",
    "veriloga-model-vbic13-3t-et",
    "veriloga-model-vbic13-4t",
    "veriloga-model-vbic-4t-et-cf",
]
# Backwards-compatible complete generated catalog, including noise.
veriloga-builtins = ["veriloga-builtins-models", "veriloga-builtins-noise"]
simd = ["wide"]

[lib]
test = false
doctest = false

[dependencies]
# Faer for sparse linear algebra - workspace configures it with std only, faer-parallel feature adds rayon
faer.workspace = true
thiserror.workspace = true
log.workspace = true
nom.workspace = true
num-complex.workspace = true
libm = "0.2"
rustfft.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
blake3 = "1.5"
dirs = { version = "6.0", optional = true }

# Parallel computation (optional)
rayon = { workspace = true, optional = true }
portable-atomic = { workspace = true, optional = true }

# WASM support (optional)
wasm-bindgen = { version = "0.2", optional = true }

# getrandom for WASM - faer depends on this, needs explicit JS feature for wasm32
getrandom = { version = "0.2", optional = true }

# FFI support (optional)
libloading = { version = "0.9", optional = true }

# Verilog-A support (optional)
rspice-veriloga = { path = "../rspice-veriloga", version = "0.1.0", optional = true }

# SIMD acceleration (optional)
wide = { version = "1.5", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
blake3 = "1.5"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[[bin]]
name = "rspice-ngspice-case-runner"
path = "src/bin/ngspice_case_runner.rs"
test = false

[[bin]]
name = "rspice-xyce-case-runner"
path = "src/bin/xyce_case_runner.rs"
test = false

[lints]
workspace = true
