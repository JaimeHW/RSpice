[package]
name = "rspice-core"
description = "High-performance SPICE circuit simulation engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# parallel ships in the default set so the CLI, Python bindings,
# and the default test configuration all exercise the fast paths;
# the browser builds opt out via default-features = false.
default = ["faer-parallel", "parallel"]
wasm = [
    "rspice-core-base/wasm",
    "rspice-core-netlist/wasm",
    "rspice-core-devices/wasm",
]
parallel = [
    "rayon",
    "rspice-core-base/parallel",
    "rspice-core-netlist/parallel",
    "rspice-core-devices/parallel",
]
faer-parallel = [
    "faer/rayon",
    "rspice-matrix/faer-parallel",
    "rspice-veriloga-runtime/faer-parallel",
    "rspice-core-base/faer-parallel",
    "rspice-core-netlist/faer-parallel",
    "rspice-core-devices/faer-parallel",
]
veriloga = [
    "dep:rspice-veriloga",
    "dep:dirs",
    "rspice-core-base/veriloga",
    "rspice-core-netlist/veriloga",
    "rspice-core-devices/veriloga",
]
# Native JIT for Verilog-A devices (native targets only). Native mode is full JIT or error.
veriloga-native = [
    "veriloga",
    "rspice-veriloga/native",
    "rspice-core-base/veriloga-native",
    "rspice-core-netlist/veriloga-native",
    "rspice-core-devices/veriloga-native",
]
# Browser JIT compiler. Runtime module compilation/instantiation is performed
# by the owning Web Worker; the core retains the authenticated artifacts and
# synchronous solver integration.
veriloga-wasm-jit = [
    "veriloga",
    "rspice-veriloga/wasm-jit",
    "rspice-core-base/veriloga-wasm-jit",
    "rspice-core-netlist/veriloga-wasm-jit",
    "rspice-core-devices/veriloga-wasm-jit",
]
# Runtime integration shared by every build-time generated Verilog-A model.
# Prefer a `veriloga-model-*` feature for small production binaries and fast builds.
veriloga-builtins-base = [
    "dep:rspice-veriloga-models",
    "rspice-core-base/veriloga-builtins-base",
    "rspice-core-netlist/veriloga-builtins-base",
    "rspice-core-devices/veriloga-builtins-base",
]
# Noise analysis is independently selectable because its generated schedules are
# more than half of the checked-in Rust source. The compatibility umbrella below
# retains the historical all-model, noise-enabled behavior.
veriloga-builtins-noise = [
    "veriloga-builtins-base",
    "rspice-veriloga-models/veriloga-builtins-noise",
    "rspice-core-base/veriloga-builtins-noise",
    "rspice-core-netlist/veriloga-builtins-noise",
    "rspice-core-devices/veriloga-builtins-noise",
]
