[package]
name = "rspice-core"
description = "High-performance SPICE circuit simulation engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["faer-parallel"]
wasm = ["wasm-bindgen", "getrandom/js"]
parallel = ["rayon", "portable-atomic"]
faer-parallel = ["faer/rayon"]
ffi = ["libloading"]
veriloga = [
    "dep:rspice-veriloga",
    "dep:serde",
    "dep:bincode",
    "dep:blake3",
    "dep:dirs",
]
simd = ["wide"]

[dependencies]
# Faer for sparse linear algebra - workspace configures it with std only, faer-parallel feature adds rayon
faer.workspace = true
thiserror.workspace = true
log.workspace = true
nom.workspace = true
num-complex.workspace = true
rustfft.workspace = true
serde = { workspace = true, optional = true }
bincode = { version = "1.3", optional = true }
blake3 = { version = "1.5", optional = true }
dirs = { version = "6.0", optional = true }

# Parallel computation (optional)
rayon = { workspace = true, optional = true }
portable-atomic = { workspace = true, optional = true }

# WASM support (optional)
wasm-bindgen = { version = "0.2", optional = true }

# getrandom for WASM - faer depends on this, needs explicit JS feature for wasm32
getrandom = { version = "0.2", optional = true }

# FFI support (optional)
libloading = { version = "0.8", optional = true }

# Verilog-A support (optional)
rspice-veriloga = { path = "../rspice-veriloga", optional = true }

# SIMD acceleration (optional)
wide = { version = "0.7", optional = true }

[dev-dependencies]
approx.workspace = true
env_logger.workspace = true
rspice-veriloga = { path = "../rspice-veriloga" }
criterion = "0.5"

[[bench]]
name = "simulation_kernels"
harness = false


