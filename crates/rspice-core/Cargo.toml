[package]
name = "rspice-core"
description = "High-performance SPICE circuit simulation engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# parallel + simd ship in the default set so the CLI, Python bindings,
# and the default test configuration all exercise the fast paths;
# rspice-wasm opts out via default-features = false.
default = ["faer-parallel", "parallel", "simd"]
wasm = ["wasm-bindgen", "getrandom/js"]
parallel = ["rayon", "portable-atomic"]
faer-parallel = ["faer/rayon"]
ffi = ["libloading"]
veriloga = [
    "dep:rspice-veriloga",
    "dep:serde",
    "dep:bincode",
    "dep:blake3",
    "dep:dirs",
]
# Native JIT for Verilog-A devices (native targets only). Native mode is full JIT or error.
veriloga-native = ["veriloga", "rspice-veriloga/native"]
# Build-time generated Verilog-A built-ins compiled into rspice-core.
veriloga-builtins = []
simd = ["wide"]

[lib]
test = false
doctest = false

[dependencies]
# Faer for sparse linear algebra - workspace configures it with std only, faer-parallel feature adds rayon
faer.workspace = true
thiserror.workspace = true
log.workspace = true
nom.workspace = true
num-complex.workspace = true
rustfft.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, optional = true }
bincode = { version = "1.3", optional = true }
blake3 = { version = "1.5", optional = true }
dirs = { version = "6.0", optional = true }

# Parallel computation (optional)
rayon = { workspace = true, optional = true }
portable-atomic = { workspace = true, optional = true }

# WASM support (optional)
wasm-bindgen = { version = "0.2", optional = true }

# getrandom for WASM - faer depends on this, needs explicit JS feature for wasm32
getrandom = { version = "0.2", optional = true }

# FFI support (optional)
libloading = { version = "0.8", optional = true }

# Verilog-A support (optional)
rspice-veriloga = { path = "../rspice-veriloga", version = "0.1.0", optional = true }

# SIMD acceleration (optional)
wide = { version = "0.7", optional = true }

[[bin]]
name = "rspice-ngspice-case-runner"
path = "src/bin/ngspice_case_runner.rs"
test = false

[[bin]]
name = "rspice-xyce-case-runner"
path = "src/bin/xyce_case_runner.rs"
test = false
