# Additive only: it adds hidden items and changes no behaviour.
test-support = [
    "rspice-core-base/test-support",
    "rspice-core-netlist/test-support",
    "rspice-core-devices/test-support",
]

[lib]
test = false
doctest = false

[dependencies]
# Faer for sparse linear algebra - workspace configures it with std only, faer-parallel feature adds rayon
faer.workspace = true
thiserror.workspace = true
log.workspace = true
num-complex.workspace = true
# Exact sparse rank decisions for ideal-source shooting constraints.
num-bigint = "0.4.8"
libm = "0.2"
rustfft.workspace = true
rustc-hash.workspace = true
getrandom = { workspace = true, features = ["wasm_js"] }
rspice-core-base = { workspace = true, default-features = false }
rspice-core-netlist = { workspace = true, default-features = false }
rspice-core-devices = { workspace = true, default-features = false }
rspice-matrix.workspace = true
rspice-output.workspace = true
rspice-units.workspace = true
rspice-veriloga-runtime.workspace = true
rspice-veriloga-models = { workspace = true, optional = true }
# The shared typed result document in `execution::result_document` is a
# non-optional part of the core contract, so its encoder is too.
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
blake3 = { version = "1.5", features = ["pure"] }
flate2.workspace = true
miniz_oxide.workspace = true
dirs = { version = "7.0", optional = true }

# Parallel computation (optional)
rayon = { workspace = true, optional = true }

# Verilog-A support (optional)
rspice-veriloga = { path = "../rspice-veriloga", version = "0.1.0", optional = true, default-features = false }

[dev-dependencies]
# `execution_properties` states the planner, schema and bounded-IO laws as
# properties over generated inputs instead of hand-picked cases.
proptest.workspace = true
# `abort_iteration_bounds` pins the compute pool to one thread so an
# iteration bound is an exact number rather than a function of core count.
rayon.workspace = true
# The engine's unit tests build with the hidden helpers of the crates below.
rspice-core-base = { workspace = true, default-features = false, features = ["test-support"] }
rspice-core-netlist = { workspace = true, default-features = false, features = ["test-support"] }
rspice-core-devices = { workspace = true, default-features = false, features = ["test-support"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# Register the same public-core regressions with the workspace's WASM runner.
wasm-bindgen-test.workspace = true
# Proptest's rand 0.9 uses getrandom 0.3, separately from the core's 0.4.
# Its entropy backend must also be enabled when compiling WASM test binaries.
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[build-dependencies]
blake3 = { version = "1.5", features = ["pure"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true
