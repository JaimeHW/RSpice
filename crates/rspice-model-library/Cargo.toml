[package]
name = "rspice-model-library"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
catalog-test-observation = []

[dependencies]
base64.workspace = true
csv.workspace = true
rspice-vocabulary.workspace = true
rspice-design-model.workspace = true
# The engine's netlist and library modules, and the configuration
# vocabulary below them: a deck reader that never waits for the engine.
rspice-core-netlist.workspace = true
rspice-core-base.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ed25519-dalek = { workspace = true, features = ["std", "fast"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ed25519-dalek = { workspace = true, features = ["std"] }
