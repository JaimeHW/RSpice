[package]
name = "rspice-hardcopy"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
rspice-vocabulary.workspace = true
rspice-core = { path = "../rspice-core", version = "0.1.0", default-features = false }
rspice-formats = { workspace = true, features = ["project-results"] }
rspice-design = { workspace = true, features = ["symbol-artwork"] }
rspice-design-model.workspace = true
rspice-hardcopy-contract.workspace = true
rspice-project-contract.workspace = true
rspice-results = { workspace = true, features = ["engine-evidence"] }
serde.workspace = true
uuid.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-segmentation = "1.12"
sha2.workspace = true
png = "0.18"
base64.workspace = true
# Keep system font discovery disabled; rendering uses the pinned workspace fonts.
usvg.workspace = true
krilla = { version = "0.8.2", default-features = false, features = ["raster-images", "simple-text"] }
resvg = { version = "0.48", default-features = false, features = ["text"] }
tiff = { version = "0.11.3", default-features = false, features = ["deflate"] }
ttf-parser = "0.25.1"
# Print shapes each run and lays right-to-left text out in display order.
rspice-fonts = { workspace = true, features = ["bidi"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# A desktop prints what no embedded face has from the faces installed there.
rspice-fonts = { workspace = true, features = ["bidi", "system"] }

[dev-dependencies]
lopdf = { version = "0.45", default-features = false }
