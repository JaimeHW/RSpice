[package]
name = "rspice-python"
description = "Python bindings for RSpice circuit simulation engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "rspice"
crate-type = ["cdylib"]
test = false
doctest = false

[features]
default = []
# Extension module feature for pyo3 - required for building Python extension
extension-module = ["pyo3/extension-module"]

[dependencies]
# PyO3 for Python bindings with ABI3 for broad Python version support (3.8+).
# generate-import-lib lets Windows abi3 builds create python3.lib when the
# selected Python installation only ships a versioned import library.
pyo3 = { version = "0.23", features = ["abi3-py38", "generate-import-lib"] }

# NumPy integration for zero-copy array access
numpy = "0.23"

# Internal crate dependency
rspice-core = { path = "../rspice-core", version = "0.1.0" }

# For complex number support in AC results
num-complex.workspace = true

[build-dependencies]
pyo3-build-config = { version = "0.23", features = ["resolve-config"] }
