[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "rspice"
description = "Python bindings for the RSpice circuit simulation engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "RSpice Personal Use License" }
authors = [{ name = "RSpice Contributors" }]
keywords = ["spice", "circuit", "simulation", "eda", "analog"]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
dependencies = ["numpy>=2.0,<3"]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/JaimeHW/RSpice"
Changelog = "https://github.com/JaimeHW/RSpice/blob/main/crates/rspice-python/CHANGELOG.md"

[tool.maturin]
# Build the PyO3 extension with the abi3 wheel for broad version support.
features = ["extension-module"]
locked = true
module-name = "rspice"

[tool.pytest.ini_options]
testpaths = ["tests"]
