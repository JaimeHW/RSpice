[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

# Release checklist -- these four are correct for a pre-release crate and must
# change together at the first public release, along with the CI assertions in
# tools/ci/test_ci_configuration.py that pin this file:
#
#   1. Drop the "Private :: Do Not Upload" classifier, which is the guard that
#      makes an accidental `twine upload` fail rather than publish.
#   2. Raise Development Status past "3 - Alpha".
#   3. Replace the placeholder author with the releasing legal entity.
#   4. Migrate `license = { text = ... }` to PEP 639: a `license` SPDX
#      expression plus `license-files`. The table form is deprecated and newer
#      build backends warn on it.
[project]
name = "rspice"
description = "Python bindings for the RSpice circuit simulation engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "RSpice Personal Use License" }
authors = [{ name = "RSpice Contributors" }]
keywords = ["spice", "circuit", "simulation", "eda", "analog"]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
dependencies = ["numpy>=2.0,<3"]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/JaimeHW/RSpice"
Changelog = "https://github.com/JaimeHW/RSpice/blob/main/crates/rspice-python/CHANGELOG.md"

[tool.maturin]
# Build the PyO3 extension with the abi3 wheel for broad version support.
features = ["extension-module"]
locked = true
module-name = "rspice"

[tool.pytest.ini_options]
testpaths = ["tests"]
