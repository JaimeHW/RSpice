<!DOCTYPE html>
<html lang="en" data-rspice-wasm-jit-status="pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSpice WASM JIT qualification</title>
</head>
<body>
<p id="status" role="status">RSpice WASM JIT qualification is running.</p>
<script type="module">
  const root = document.documentElement;
  const status = document.getElementById("status");
  const expectedAbiVersion = Number.parseInt(
    new URL(location.href).searchParams.get("expectedAbi") || "",
    10,
  );
  const workerUrl = new URL("./simulation-worker.js", import.meta.url);
  workerUrl.searchParams.set("v", `qualification-${Date.now()}`);
  const worker = new Worker(workerUrl, { type: "module" });
  const timeout = setTimeout(() => finish("timeout", "Worker qualification timed out."), 60000);

  // The verdict goes to the local qualification server as well as the DOM. The
  // runner drives a real clock -- the stamp timing below is meaningless under
  // a virtual one, and a virtual clock also races past this timeout -- so it
  // needs a signal that the verdict exists rather than a fixed budget to wait
  // out.
  function report(result, message, capability) {
    const beacon = new URL("./rspice-qualification", location.href);
    beacon.searchParams.set("status", result);
    beacon.searchParams.set("message", message);
    if (capability) {
      beacon.searchParams.set("abi", String(capability.abiVersion));
      beacon.searchParams.set("solverResult", String(capability.solverResult));
      if (capability.kernel) {
        beacon.searchParams.set("contributions", String(capability.kernel.contributions));
        beacon.searchParams.set("jacobians", String(capability.kernel.jacobianEntries));
        beacon.searchParams.set("stamps", String(capability.kernel.stamps));
        beacon.searchParams.set(
          "nsPerStamp",
          capability.kernel.nanosecondsPerStamp.toFixed(1),
        );
      }
    }
    void fetch(beacon, { keepalive: true }).catch(() => {});
  }

  function finish(result, message, capability = null) {
    clearTimeout(timeout);
    root.setAttribute("data-rspice-wasm-jit-status", result);
    status.textContent = message;
    report(result, message, capability);
    if (capability) {
      root.setAttribute("data-rspice-wasm-jit-abi", String(capability.abiVersion));
      root.setAttribute(
        "data-rspice-wasm-jit-solver-result",
        String(capability.solverResult),
      );
      const kernel = capability.kernel;
      if (kernel) {
        root.setAttribute("data-rspice-wasm-jit-kernel-contributions", String(kernel.contributions));
        root.setAttribute("data-rspice-wasm-jit-kernel-jacobians", String(kernel.jacobianEntries));
        root.setAttribute("data-rspice-wasm-jit-kernel-stamps", String(kernel.stamps));
        root.setAttribute(
          "data-rspice-wasm-jit-kernel-ns-per-stamp",
          kernel.nanosecondsPerStamp.toFixed(1),
        );
      }
    }
    worker.terminate();
  }

  worker.addEventListener("message", (event) => {
    const message = event.data || {};
    if (message.type === "ready") {
      const capability = message.wasmJit || {};
      if (
        Number.isSafeInteger(expectedAbiVersion) &&
        expectedAbiVersion > 0 &&
        capability.available === true &&
        capability.abiVersion === expectedAbiVersion &&
        capability.result === 42 &&
        capability.solverResult === 15 &&
        capability.kernel?.contributions === 3 &&
        capability.kernel?.jacobianEntries === 14
      ) {
        finish("qualified", "RSpice WASM JIT qualification passed.", capability);
      } else {
        finish("rejected", capability.reason || "Worker capability evidence was incomplete.");
      }
    } else if (message.type === "error" && (!message.id || message.id === 0)) {
      finish("error", message.error || "Worker initialization failed.");
    }
  });
  worker.addEventListener("error", (event) => {
    finish("error", event.message || "Worker module failed to load.");
  });
</script>
</body>
</html>
