[package]
name = "rspice-ui"
version.workspace = true
edition.workspace = true
description = "Modern circuit simulator GUI for RSpice - Commercial-grade egui application"
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

# Library crate
[lib]
crate-type = ["rlib"]
doctest = false

# Desktop binary
[[bin]]
name = "rspice-ui"
path = "src/main.rs"
test = false

[[bin]]
name = "rspice-ui-worker"
path = "src/worker_main.rs"
test = false
required-features = ["browser-worker"]

[features]
default = []
generated-veriloga-catalog = ["rspice-core/veriloga-builtins"]
browser-worker = [
    "rspice-core/veriloga-wasm-jit",
    "rspice-veriloga/wasm-jit",
]

[dependencies]
# RSpice core simulation engine lives in the target sections below: native
# builds keep the default fast paths (parallel + simd), wasm opts out.
rspice-automation-protocol = { path = "../rspice-automation-protocol", version = "0.1.0" }

# Design-management state authority and the signed drawing-sheet package
# contract. Shared with the offline `rspice-sheet-publisher` ceremony, which
# links this crate rather than the GUI.
rspice-design-model = { workspace = true }

# Verilog-A compiler (pure Rust, works on all platforms)
rspice-veriloga = { path = "../rspice-veriloga", version = "0.1.0" }

# Async runtime — multi-thread runtime is a native-only luxury; the wasm
# build keeps the sync primitives + current-thread rt (see target sections)

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ron = { version = "0.12.2", features = ["integer128"] }
semver.workspace = true
toml.workspace = true
rspice-publication-contract.workspace = true
csv = "1.3"
rust_xlsxwriter = { version = "0.92", default-features = false }
# arrow-rs 59 is the first release whose parquet drops the `thrift` crate
# (GHSA-2f9f-gq7v-9h6m); every parquet <= 58 pins the unpatched `thrift ^0.17`.
arrow-array = "59"
arrow-schema = "59"
parquet = { version = "59", default-features = false, features = ["arrow"] }
thiserror.workspace = true
sha2 = "0.10"
regex = "1.12"
similar = "2.7"
# Signed PDK callbacks run in a deterministic, fuel-metered interpreter on
# every supported target. No WASI integration is linked, so callbacks receive
# only the explicit RSpice host capabilities declared by their signed contract.
wasmi = { version = "1.1.0", default-features = false, features = ["std", "extra-checks", "prefer-btree-collections"] }

# Logging
log = "0.4"

# FFT for frequency analysis
rustfft.workspace = true

# Complex number support
num-complex = "0.4"

# Image encoding for GPU output
png = "0.18"
base64 = "0.23"

# Lazy initialization
once_cell = "1.19"

# UUID for document identification
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
unicode-normalization.workspace = true
unicode-segmentation = "1.12"
ropey.workspace = true
krilla = { version = "0.8.2", default-features = false, features = ["raster-images", "simple-text"] }

# egui - Commercial-grade immediate mode GUI with native wgpu rendering
egui = { version = "0.35.0", default-features = false }
egui_extras = { version = "0.35.0", default-features = false }

# SVG parsing and deterministic software rendering. System font discovery stays
# disabled: hardcopy rendering loads only RSpice's pinned IBM Plex assets.
usvg = { version = "0.47", default-features = false, features = ["text"] }
resvg = { version = "0.47", default-features = false, features = ["text"] }
tiff = { version = "0.11.3", default-features = false, features = ["deflate"] }
ttf-parser = "0.25.1"

# Native file dialogs
rfd = { version = "0.17", features = ["file-handle-inner"] }

# Cross-platform config directories
dirs = "6.0"

[dev-dependencies]
# Keypair generation for license issuance in the `services::license` tests.
# The matching `rand_core` feature on ed25519-dalek is dev-only for the same
# reason: `cargo test` unions it in, `cargo build` never sees it.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
lopdf = { version = "0.44", default-features = false }
wat = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native builds expose egui's semantic tree to platform assistive technology
# through AccessKit. Keep this target-specific: eframe's browser backend does
# not currently publish its AccessKit tree to the DOM.
eframe = { version = "0.35.0", default-features = false, features = ["wgpu", "persistence", "accesskit"] }
rspice-automation-runtime = { path = "../rspice-automation-runtime", version = "0.1.0" }

# License verification is pure Rust on every target. Native clients retain
# dalek's precomputed tables for maximum throughput; key generation remains
# test-only through the dev-dependency above.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }

# No RSpice source names `winit`; this edge exists only to turn on winit's
# default features, which `eframe` above cannot reach: it is taken with
# `default-features = false`, and its only route to `winit/default` is its own
# `default` feature, which would also drag in `web_screen_reader` and the font
# set this crate replaces. Feature unification through this edge is what keeps
# `wayland-csd-adwaita` (window decorations on compositors that draw no
# server-side ones, e.g. GNOME) and `wayland-dlopen` (libwayland resolved at
# runtime, so an X11-only host still starts). Removing it silently drops both.
# eframe takes winit on this target only, so the edge belongs here too.
winit = "0.30"

env_logger = "0.11"
tokio = { version = "1", features = ["sync", "macros", "time", "rt-multi-thread"] }
# Live-session relay socket (ADR 0082). rustls + webpki roots keep the
# banned native-tls/openssl stacks out and share reqwest's TLS provider;
# futures-util supplies the Stream/Sink adapters the socket pump drives.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

# Cloud account boundary: the typed RSpice Cloud client, the OIDC token
# transport the client crate deliberately does not own, and RFC 3339 stamps
# for session freshness. `reqwest` is the native identity transport only — the
# browser fetches through web-sys, because reqwest's wasm backend cannot
# express the `redirect: error` this flow depends on.
getrandom = { workspace = true }
reqwest = { workspace = true }
rspice-cloud-client = { workspace = true }
time = { workspace = true }
url = { workspace = true }

# Model Hub trust: the crate that signs a pack in RSpice Cloud is the crate
# that verifies it here, so one code path reaches every trust verdict.
rspice-pack = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), any(target_arch = "x86_64", target_arch = "aarch64"), any(target_os = "macos", target_os = "linux", windows)))'.dependencies]
# Default features keep the desktop solver's parallel/SIMD paths. The native
# Verilog-A JIT is selected on each qualified desktop architecture.
rspice-core = { path = "../rspice-core", version = "0.1.0", features = ["veriloga-native"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(all(any(target_arch = "x86_64", target_arch = "aarch64"), any(target_os = "macos", target_os = "linux", windows)))))'.dependencies]
# Mobile/tablet and other unqualified architectures retain portable bytecode.
rspice-core = { path = "../rspice-core", version = "0.1.0", features = ["veriloga"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_IO",
] }

[target.'cfg(windows)'.build-dependencies]
# Embeds assets/brand/rspice.ico as the Windows .exe icon resource so
# Explorer / the file shell shows the brand mark. Windows-only; build.rs
# degrades to a cargo:warning if the resource compiler is unavailable.
winresource = "0.1"

[build-dependencies]
# The Results catalog is generated by build.rs from the neutral product
# contract in `contracts/result-data-contract.json`. `preserve_order` retains
# the canonical manifest order for object-backed creation-family records.
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# eframe 0.35 does not bridge AccessKit into the browser DOM. Its
# web_screen_reader feature still announces egui interaction events through
# the Web Speech API, which is the supported fallback for this backend.
# Browser startup deliberately requires WebGPU (see `WEB_STARTUP_REQUIREMENT`
# in main.rs). Eframe's convenience `wgpu` feature also enables egui-wgpu's
# defaults, including the WebGL fallback and every native wgpu backend. Select
# its backend-neutral integration instead and activate only wgpu's WebGPU path
# below, so unreachable renderers cannot enter either browser image.
eframe = { version = "0.35.0", default-features = false, features = ["wgpu_no_default_features", "persistence", "web_screen_reader"] }
wgpu = { version = "29.0", default-features = false, features = ["webgpu"] }

# Dalek's `fast` feature changes only verification throughput: it selects a
# precomputed basepoint table, not a different Ed25519 algorithm or policy.
# Browser license checks are rare, so retain exact verification semantics and
# zeroization without carrying that table in either browser image.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }

# No rayon/simd on wasm; the "wasm" feature wires up wasm-bindgen. The
# interactive image retains portable Verilog-A artifacts and validation, while
# secondary-module emission and verification are owned exclusively by the
# `browser-worker` feature above. Keeping that ownership explicit prevents the
# secondary-module emitter and verifier from being duplicated in both images.
rspice-core = { path = "../rspice-core", version = "0.1.0", default-features = false, features = ["veriloga", "wasm"] }
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
# uuid needs an explicit browser entropy source on wasm32-unknown-unknown
uuid = { version = "1", features = ["v4", "v5", "v7", "js", "serde"] }
wasm-bindgen-futures = "0.4"
# The Request/Response/AbortController/ReadableStream group backs the browser
# identity Fetch in `services::cloud_account::oidc`, WebSocket/CloseEvent the
# live-session relay, and Crypto the PKCE verifier's entropy.
web-sys = { version = "0.3", features = ["Window", "Location", "History", "PopStateEvent", "Document", "Element", "Event", "EventTarget", "BeforeUnloadEvent", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "File", "FileList", "CanvasRenderingContext2d", "Node", "Blob", "BlobPropertyBag", "Url", "Performance", "Storage", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "console", "AbortController", "AbortSignal", "BinaryType", "CloseEvent", "Crypto", "Headers", "ReadableStream", "ReferrerPolicy", "Request", "RequestCache", "RequestCredentials", "RequestInit", "RequestMode", "RequestRedirect", "Response", "WebSocket"] }
js-sys = "0.3"

# Cloud account boundary, browser half. The typed client, `url` for callback
# and relay routes, RFC 3339 stamps for session freshness, and the three
# browser-only primitives the Fetch and socket pumps drive: timeouts, the
# `select!`/`StreamExt` adapters, and the response-body stream.
#
# rspice-cloud-client brings reqwest with it, which the identity flow does
# not use on this target (see `oidc::IdentityHttpClient`) but the client's
# own transport does. On wasm32 reqwest compiles down to a wrapper over the
# same Fetch API rather than the native hyper/TLS stack, so the browser image
# carries the binding layer, not a second HTTP implementation.
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
gloo-timers = { workspace = true, features = ["futures"] }
rspice-cloud-client = { workspace = true }
# The pack trust crate is portable and reaches the same verdict in the browser.
rspice-pack = { workspace = true }
time = { workspace = true }
url = { workspace = true }
wasm-streams = { workspace = true }

[lints]
workspace = true
