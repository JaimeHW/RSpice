[package]
name = "rspice-ui"
version.workspace = true
edition.workspace = true
description = "Modern circuit simulator GUI for RSpice - Commercial-grade egui application"
authors.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

# Library crate
[lib]
crate-type = ["rlib"]
test = false
doctest = false

# Desktop binary
[[bin]]
name = "rspice-ui"
path = "src/main.rs"
test = false

[features]
default = []
desktop = []
veriloga = []

[dependencies]
# RSpice core simulation engine lives in the target sections below: native
# builds keep the default fast paths (parallel + simd), wasm opts out.

# Verilog-A compiler (pure Rust, works on all platforms)
rspice-veriloga = { path = "../rspice-veriloga" }

# Async runtime — multi-thread runtime is a native-only luxury; the wasm
# build keeps the sync primitives + current-thread rt (see target sections)

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode = "1"

# Logging
log = "0.4"

# FFT for frequency analysis
rustfft = "6.2"

# Complex number support
num-complex = "0.4"

# GPU rendering
wgpu = "23"
bytemuck = { version = "1.14", features = ["derive"] }

# Image encoding for GPU output
png = "0.17"
base64 = "0.22"

# Lazy initialization
once_cell = "1.19"

# UUID for document identification
uuid = { version = "1", features = ["v4"] }

# Blocking executor
pollster = "0.4"

# Window handle support
raw-window-handle = "0.6.2"
winit = "0.30"

# egui - Commercial-grade immediate mode GUI with native wgpu rendering
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["wgpu", "persistence"] }
egui-wgpu = "0.29"

# SVG parsing for component symbols (lightweight, pure Rust)
usvg = { version = "0.44", default-features = false }
svgtypes = "0.15"

# Native file dialogs
rfd = "0.15"

# Cross-platform config directories
dirs = "5.0"

# License-key signature verification (docs/license-key-spec.md) — pure
# Rust, works on wasm32; key generation lives in the license_tool example
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "rand_core"] }

[dev-dependencies]
# Keypair generation for the license_tool example only
rand = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Default features on: faer-parallel/parallel/simd so the desktop app gets
# the same fast solver paths as the CLI.
rspice-core = { path = "../rspice-core", features = ["veriloga"] }
env_logger = "0.11"
tokio = { version = "1", features = ["sync", "macros", "time", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# No rayon/simd on wasm; the "wasm" feature wires up wasm-bindgen and the
# browser entropy source (getrandom/js) that faer needs on this target.
rspice-core = { path = "../rspice-core", default-features = false, features = ["veriloga", "wasm"] }
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
wasm-bindgen = "0.2"
# uuid needs an explicit browser entropy source on wasm32-unknown-unknown
uuid = { version = "1", features = ["v4", "js"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Performance"] }
js-sys = "0.3"
