[package]
name = "rspice-ui"
version.workspace = true
edition.workspace = true
description = "Modern circuit simulator GUI for RSpice - Commercial-grade egui application"
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

# Library crate
[lib]
crate-type = ["rlib"]
doctest = false

# Desktop binary
[[bin]]
name = "rspice-ui"
path = "src/main.rs"
test = false

[features]
default = []
desktop = []
veriloga = []

[dependencies]
# RSpice core simulation engine lives in the target sections below: native
# builds keep the default fast paths (parallel + simd), wasm opts out.

# Verilog-A compiler (pure Rust, works on all platforms)
rspice-veriloga = { path = "../rspice-veriloga", version = "0.1.0" }

# Async runtime — multi-thread runtime is a native-only luxury; the wasm
# build keeps the sync primitives + current-thread rt (see target sections)

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
semver.workspace = true
rspice-publication-contract.workspace = true
csv = "1.3"
rust_xlsxwriter = { version = "0.92", default-features = false }
# arrow-rs 59 is the first release whose parquet drops the `thrift` crate
# (GHSA-2f9f-gq7v-9h6m); every parquet <= 58 pins the unpatched `thrift ^0.17`.
arrow-array = "59"
arrow-schema = "59"
parquet = { version = "59", default-features = false, features = ["arrow"] }
thiserror.workspace = true
sha2 = "0.10"
regex = "1.12"
similar = "2.7"
# Signed PDK callbacks run in a deterministic, fuel-metered interpreter on
# every supported target. No WASI integration is linked, so callbacks receive
# only the explicit RSpice host capabilities declared by their signed contract.
wasmi = { version = "1.1.0", default-features = false, features = ["std", "extra-checks", "prefer-btree-collections"] }

# Logging
log = "0.4"

# FFT for frequency analysis
rustfft = "6.2"

# Complex number support
num-complex = "0.4"

# Image encoding for GPU output
png = "0.18"
base64 = "0.22"

# Lazy initialization
once_cell = "1.19"

# UUID for document identification
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
unicode-normalization.workspace = true
unicode-segmentation = "1.12"
krilla = { version = "0.8.2", default-features = false, features = ["raster-images", "simple-text"] }

# Blocking executor
pollster = "0.4"

# Window handle support
raw-window-handle = "0.6.2"
winit = "0.30"

# egui - Commercial-grade immediate mode GUI with native wgpu rendering
egui = "0.35.0"
egui_extras = "0.35.0"

# SVG parsing and deterministic software rendering. System font discovery stays
# disabled: hardcopy rendering loads only RSpice's pinned IBM Plex assets.
usvg = { version = "0.47", default-features = false, features = ["text"] }
resvg = { version = "0.47", default-features = false, features = ["text"] }
svgtypes = "0.16"
tiff = { version = "0.11.3", default-features = false, features = ["deflate"] }
ttf-parser = "0.25.1"

# Native file dialogs
rfd = { version = "0.17", features = ["file-handle-inner"] }

# Cross-platform config directories
dirs = "5.0"

# License-key signature verification (internal license-key spec) - pure
# Rust, works on wasm32. Signing lives in the `services::license` test module,
# so `rand_core` is requested by the dev-dependency below rather than here:
# a release or wasm build links the verifier only.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }

[dev-dependencies]
# Keypair generation for license issuance in the `services::license` tests.
# The matching `rand_core` feature on ed25519-dalek is dev-only for the same
# reason: `cargo test` unions it in, `cargo build` never sees it.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
lopdf = { version = "0.44", default-features = false }
wat = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native builds expose egui's semantic tree to platform assistive technology
# through AccessKit. Keep this target-specific: eframe's browser backend does
# not currently publish its AccessKit tree to the DOM.
eframe = { version = "0.35.0", default-features = false, features = ["wgpu", "persistence", "accesskit"] }

env_logger = "0.11"
tokio = { version = "1", features = ["sync", "macros", "time", "rt-multi-thread"] }

# Cloud account boundary: the typed RSpice Cloud client, the OIDC token
# transport the client crate deliberately does not own, and RFC 3339 stamps
# for session freshness. Native-only until the hosted deployment carries the
# browser sign-in callback page.
getrandom = { workspace = true }
reqwest = { workspace = true }
rspice-cloud-client = { workspace = true }
time = { workspace = true }
url = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), target_arch = "x86_64"))'.dependencies]
# Default features keep the desktop solver's parallel/SIMD paths. The native
# Verilog-A JIT is selected only on the architecture its encoder targets.
rspice-core = { path = "../rspice-core", version = "0.1.0", features = ["veriloga-native"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_arch = "x86_64")))'.dependencies]
# Apple Silicon and ARM mobile/tablet builds keep Verilog-A functional through
# the bytecode engine until an AArch64 native backend is qualified.
rspice-core = { path = "../rspice-core", version = "0.1.0", features = ["veriloga"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_IO",
] }

[target.'cfg(windows)'.build-dependencies]
# Embeds assets/brand/rspice.ico as the Windows .exe icon resource so
# Explorer / the file shell shows the brand mark. Windows-only; build.rs
# degrades to a cargo:warning if the resource compiler is unavailable.
winresource = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# eframe 0.34 does not bridge AccessKit into the browser DOM. Its
# web_screen_reader feature still announces egui interaction events through
# the Web Speech API, which is the supported fallback for this backend.
eframe = { version = "0.35.0", default-features = false, features = ["wgpu", "persistence", "web_screen_reader"] }

# No rayon/simd on wasm; the "wasm" feature wires up wasm-bindgen and the
# browser entropy source (getrandom/js) that faer needs on this target.
rspice-core = { path = "../rspice-core", version = "0.1.0", default-features = false, features = ["veriloga", "wasm"] }
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
# uuid needs an explicit browser entropy source on wasm32-unknown-unknown
uuid = { version = "1", features = ["v4", "v5", "v7", "js", "serde"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "History", "PopStateEvent", "Document", "Element", "EventTarget", "BeforeUnloadEvent", "HtmlCanvasElement", "HtmlElement", "CanvasRenderingContext2d", "Node", "Blob", "BlobPropertyBag", "Url", "Performance", "Storage", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "console"] }
js-sys = "0.3"

[lints]
workspace = true
