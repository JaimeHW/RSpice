[package]
name = "rspice-ui"
version = "0.1.0"
edition = "2021"
description = "Modern circuit simulator GUI for RSpice"
authors = ["RSpice Contributors"]

# Library crate (required for web/WASM builds)
[lib]
crate-type = ["cdylib", "rlib"]

# Desktop binary (uses cfg guards in main.rs for wasm32 compatibility)
[[bin]]
name = "rspice-ui"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "rfd", "tokio/rt-multi-thread"]
native = ["dioxus/native", "rfd"]
web = ["dioxus/web", "rspice-core/wasm", "getrandom/js"]
egui = ["dep:egui", "dep:eframe", "dep:egui-wgpu"]

[dependencies]
# Dioxus framework (0.7 with cross-platform support)
dioxus = { version = "0.7", features = ["router"] }

# RSpice core simulation engine
rspice-core = { path = "../rspice-core", default-features = false }

# Verilog-A compiler (pure Rust, works on all platforms including WASM)
rspice-veriloga = { path = "../rspice-veriloga" }

# Async runtime
tokio = { version = "1", features = ["sync", "macros", "time"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"

# FFT for frequency analysis
rustfft = "6.2"

# R-tree spatial indexing for O(log n) visibility queries
rstar = "0.12"

# Complex number support
num-complex = "0.4"

# GPU rendering (works on web via WebGPU)
wgpu = "23"
bytemuck = { version = "1.14", features = ["derive"] }

# Image encoding for GPU output
png = "0.17"
base64 = "0.22"

# Lazy initialization for GPU
once_cell = "1.19"

# UUID for document identification
uuid = { version = "1", features = ["v4"] }

# getrandom for wasm support
getrandom = { version = "0.2", optional = true }

# === Desktop-only dependencies ===
# Native file dialogs (desktop only)
rfd = { version = "0.15", optional = true }

# Blocking executor (desktop only - web uses async)
pollster = { version = "0.4", optional = false }

# Desktop logging
env_logger = { version = "0.11", optional = true }
raw-window-handle = "0.6.2"
winit = "0.30"

# egui - Commercial-grade immediate mode GUI with native wgpu rendering
egui = { version = "0.29", optional = true }
eframe = { version = "0.29", optional = true, default-features = false, features = ["wgpu", "persistence"] }
egui-wgpu = { version = "0.29", optional = true }

# === Web-specific dependencies ===
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", 
    "Document", 
    "Element",
    "HtmlElement",
    "Blob",
    "Url",
    "HtmlAnchorElement",
    "Performance",
] }
console_error_panic_hook = "0.1"
console_log = "1"
async-channel = "2"
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[dev-dependencies]
