[package]
name = "rspice-ui"
version = "0.1.0"
edition = "2021"
description = "Modern circuit simulator GUI for RSpice"
authors = ["RSpice Contributors"]

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
native = ["dioxus/native"]
web = ["dioxus/web"]

[dependencies]
# Dioxus framework (0.7 with native wgpu support)
dioxus = { version = "0.7", features = ["router"] }

# RSpice core simulation engine
rspice-core = { path = "../rspice-core" }

# Async runtime
tokio = { version = "1", features = ["rt", "sync", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# FFT for frequency analysis
rustfft = "6.2"

# GPU rendering
wgpu = "23"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.4"

# Image encoding for GPU output
png = "0.17"
base64 = "0.22"

# Lazy initialization for GPU
once_cell = "1.19"

# Native file dialogs (desktop only)
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }

[dev-dependencies]
