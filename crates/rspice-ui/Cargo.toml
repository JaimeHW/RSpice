[package]
name = "rspice-ui"
version = "0.1.0"
edition = "2021"
description = "Modern circuit simulator GUI for RSpice"
authors = ["RSpice Contributors"]

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

[dependencies]
# Dioxus framework
dioxus = { version = "0.6", features = ["router"] }

# RSpice core simulation engine
rspice-core = { path = "../rspice-core" }

# Async runtime
tokio = { version = "1", features = ["rt", "sync", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# FFT for frequency analysis
rustfft = "6.2"

# Native file dialogs (desktop only)
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }

[dev-dependencies]
