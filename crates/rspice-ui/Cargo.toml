[package]
name = "rspice-ui"
version = "0.1.0"
edition = "2021"
description = "Modern circuit simulator GUI for RSpice - Commercial-grade egui application"
authors = ["RSpice Contributors"]

# Library crate
[lib]
crate-type = ["rlib"]

# Desktop binary
[[bin]]
name = "rspice-ui"
path = "src/main.rs"

[features]
default = []
desktop = []
veriloga = []

[dependencies]
# RSpice core simulation engine
rspice-core = { path = "../rspice-core", default-features = false, features = ["veriloga"] }

# Verilog-A compiler (pure Rust, works on all platforms)
rspice-veriloga = { path = "../rspice-veriloga" }

# Async runtime
tokio = { version = "1", features = ["sync", "macros", "time", "rt-multi-thread"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Logging
log = "0.4"

# FFT for frequency analysis
rustfft = "6.2"

# R-tree spatial indexing for O(log n) visibility queries
rstar = "0.12"

# Complex number support
num-complex = "0.4"

# GPU rendering
wgpu = "23"
bytemuck = { version = "1.14", features = ["derive"] }

# Image encoding for GPU output
png = "0.17"
base64 = "0.22"

# Lazy initialization
once_cell = "1.19"

# UUID for document identification
uuid = { version = "1", features = ["v4"] }

# Blocking executor
pollster = "0.4"

# Window handle support
raw-window-handle = "0.6.2"
winit = "0.30"

# egui - Commercial-grade immediate mode GUI with native wgpu rendering
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["wgpu", "persistence"] }
egui-wgpu = "0.29"

# SVG parsing for component symbols (lightweight, pure Rust)
usvg = { version = "0.44", default-features = false }
svgtypes = "0.15"

# Native file dialogs
rfd = "0.15"

# Cross-platform config directories
dirs = "5.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
