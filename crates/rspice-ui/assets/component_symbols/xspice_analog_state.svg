  <path d="M 11,13.5 C 13.5,6 16.5,6 19,11" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 17.9,11 a 1.1,1.1 0 1 0 2.2,0 a 1.1,1.1 0 1 0 -2.2,0 Z" fill="#000000" stroke="none"/>
  <path d="M 21,11 H 23.5 M 25.5,11 H 28" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
