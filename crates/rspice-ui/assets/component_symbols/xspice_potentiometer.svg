<?xml version="1.0" encoding="UTF-8"?>
<!-- Potentiometer (potentiometer): resistor zigzag with a wiper arrow from
     the top pin. Box 40x20, pins r0(0,10), wiper(20,0), r1(40,10). -->
<svg viewBox="0 0 40 20" xmlns="http://www.w3.org/2000/svg">
  <path d="M 0,10 H 6.2 L 8.5,6 L 13.1,14 L 17.7,6 L 22.3,14 L 26.9,6 L 31.5,14 L 33.8,10 H 40"
        fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 20,0 V 4.8" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 20,7.8 L 18.9,5 L 21.1,5 Z" fill="#000000" stroke="none"/>
</svg>
