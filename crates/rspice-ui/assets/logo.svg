<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hexGrad" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b3b4f"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hexagon Background -->
  <path d="M256 32 L464 140 V372 L256 480 L48 372 V140 Z" fill="url(#hexGrad)"/>
  
  <!-- Inner Border Highlight -->
  <path d="M256 32 L464 140 V372 L256 480 L48 372 V140 Z" stroke="#FF5F15" stroke-opacity="0.2" stroke-width="8"/>

  <!-- The Signal Pulse -->
  <path d="M100 256 
           L160 256 
           L200 150 
           L256 360 
           L312 150 
           L352 256 
           L412 256" 
        stroke="#FF5F15" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
</svg>