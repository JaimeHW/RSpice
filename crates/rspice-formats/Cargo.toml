[package]
name = "rspice-formats"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
table-schema = ["dep:serde_json"]
# Reuse canonical retained results without enabling the engine in default codecs.
result-csv = ["dep:rspice-app-types", "dep:rspice-core", "dep:rspice-results", "dep:serde_json"]
result-digital = ["dep:rspice-core", "dep:rspice-results"]
result-vcd = ["dep:rspice-core", "dep:rspice-results"]
result-waveform = ["dep:rspice-results"]
native-bundle = ["dep:serde_json", "dep:sha2"]
monte-carlo-checkpoint = ["dep:rspice-results", "dep:serde_json"]
columnar = ["dep:arrow-array", "dep:arrow-ipc", "dep:arrow-schema", "dep:bytes", "dep:parquet"]
fst = ["dep:fst-reader"]
hdf5 = ["dep:rustyhdf5"]
spice-raw = ["dep:rspice-core"]
xlsx = ["dep:rust_xlsxwriter"]

[dependencies]
arrow-array = { version = "59", optional = true }
arrow-ipc = { version = "59", optional = true }
arrow-schema = { version = "59", optional = true }
bytes = { version = "1", optional = true }
csv.workspace = true
fst-reader = { version = "0.17", optional = true }
matfile = "0.5"
num-complex.workspace = true
npyz = { version = "0.9", features = ["complex"] }
# arrow-rs 59 is the first release whose parquet drops the `thrift` crate
# (GHSA-2f9f-gq7v-9h6m); every parquet <= 58 pins the unpatched `thrift ^0.17`.
parquet = { version = "59", default-features = false, features = ["arrow"], optional = true }
rustyhdf5 = { version = "1.93", default-features = false, optional = true }
rust_xlsxwriter = { version = "0.92", default-features = false, optional = true }
rspice-app-types = { workspace = true, optional = true }
rspice-core = { path = "../rspice-core", version = "0.1.0", default-features = false, optional = true }
rspice-results = { workspace = true, optional = true, features = ["engine-evidence"] }
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
time.workspace = true
zip = { version = "7.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
sha2.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fst-writer = "0.3"
