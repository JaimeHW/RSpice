[package]
name = "rspice-conformance"
description = "Regression conformance suites validating RSpice against reference simulators"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

# This crate is a leaf: it depends on rspice-core and nothing depends on it.
# That direction is the point. A conformance suite that can reach into engine
# internals stops testing the simulator a user gets and starts testing the
# implementation against itself, so the suites live outside rspice-core where
# the compiler enforces that they only see the public API.
#
# `tools/ci/test_ci_configuration.py` asserts no shipping crate depends on this.

[features]
# The deck-driven simulator suites remain the normal/default conformance
# surface. Verilog-A tooling depends on this crate with `default-features =
# false` so it can reuse only the generated-model oracle and benchmark harness
# without compiling unrelated ngspice/Xyce runners or their corpora.
default = ["circuit-suites"]
# Keep the authoritative default census honest by linking every generated
# capability required by an admitted deck. Select the canonical VBIC
# three-terminal, external-thermal, and four-terminal artifacts plus their
# shared noise runtime. The remaining compact-model catalog stays outside the
# default build so compile cost remains bounded.
circuit-suites = [
    "veriloga-model-bsimsoi-va",
    "veriloga-builtins-noise",
    "veriloga-model-vbic13",
    "veriloga-model-vbic13-3t-et",
    "veriloga-model-vbic13-4t",
]

# Forwarded, not local. The ngspice suite marks decks that instantiate a
# generated Verilog-A built-in as unsupported when those models are not
# compiled in, and expects them to run when they are. That decision has to
# track how `rspice-core` was actually built: if this crate had no matching
# feature, `cfg!(feature = "veriloga-builtins-base")` would silently read
# false here and the suite would skip decks it should be running. A
# conformance suite that quietly skips cases is worse than one that fails.
veriloga-builtins-base = ["rspice-core/veriloga-builtins-base"]
veriloga-builtins-noise = [
    "veriloga-builtins-base",
    "rspice-core/veriloga-builtins-noise",
]
# Forward the canonical BSIM-SOI 4.6.1 artifact independently so the Xyce
# suite can exercise LEVEL=70 without compiling the complete compact-model
# catalog.
veriloga-model-bsimsoi-va = [
    "veriloga-builtins-base",
    "rspice-core/veriloga-model-bsimsoi-va",
]
veriloga-model-vbic13 = [
    "veriloga-builtins-base",
    "rspice-core/veriloga-model-vbic13",
]
veriloga-model-vbic13-3t-et = [
    "veriloga-builtins-base",
    "rspice-core/veriloga-model-vbic13-3t-et",
]
veriloga-model-vbic13-4t = [
    "veriloga-builtins-base",
    "rspice-core/veriloga-model-vbic13-4t",
]
veriloga-builtins-models = [
    "veriloga-builtins-base",
    "rspice-core/veriloga-builtins-models",
    "veriloga-model-bsimsoi-va",
    "veriloga-model-vbic13",
    "veriloga-model-vbic13-3t-et",
    "veriloga-model-vbic13-4t",
]
# Preserve the compatibility umbrella while exposing the individual VBIC and
# noise capabilities above for feature-shard builds. Production admission asks
# the linked runtime registry for exact mechanism descriptors; these local
# feature names exist so the matrix tests can independently select and verify
# each dependency feature combination.
veriloga-builtins = [
    "rspice-core/veriloga-builtins",
    "veriloga-builtins-models",
    "veriloga-builtins-noise",
    "veriloga-model-vbic13",
    "veriloga-model-vbic13-3t-et",
    "veriloga-model-vbic13-4t",
]

[lib]
doctest = false

[dependencies]
rspice-core = { path = "../rspice-core", version = "0.1.0" }
blake3 = "1.5"
clap.workspace = true
log.workspace = true
num-complex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.20"

[[bin]]
name = "rspice-ngspice-case-runner"
path = "src/bin/ngspice_case_runner.rs"
test = false
required-features = ["circuit-suites"]

[[bin]]
name = "rspice-ngspice-oracle-capture"
path = "src/bin/ngspice_oracle_capture.rs"
test = false
required-features = ["circuit-suites"]

[[bin]]
name = "rspice-xyce-case-runner"
path = "src/bin/xyce_case_runner.rs"
test = false
required-features = ["circuit-suites"]

[[bin]]
name = "rspice-xspice-ifspec-audit"
path = "src/bin/xspice_ifspec_audit.rs"
test = false
required-features = ["circuit-suites"]

[[bin]]
name = "rspice-veriloga-golden"
path = "src/bin/rspice_veriloga_golden.rs"
required-features = ["veriloga-builtins-models"]

[lints]
workspace = true
