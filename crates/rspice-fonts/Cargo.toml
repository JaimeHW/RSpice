[package]
name = "rspice-fonts"
description = "The faces RSpice embeds and the one fallback chain screen and print letter through"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# egui font definitions: every face installed, one family per role.
egui = ["dep:egui"]
# The faces installed on a desktop, for the characters no embedded face has.
# A browser build has no font files to read, so it compiles nothing here.
system = ["dep:fontdb"]
# Right-to-left text in display order: bidi levels, the reordering of each
# line and mirrored brackets, and print's shaping. Only the crates that lay
# text out enable it.
bidi = ["dep:harfrust", "dep:unicode-bidi", "dep:unicode-bidi-mirroring"]

[dependencies]
egui = { version = "0.35.0", default-features = false, optional = true }
skrifa = { version = "0.42.1", default-features = false, features = ["std"] }
unicode-segmentation = "1.12"
# The shaper epaint 0.35 links: it sets print's runs, and tells the screen
# how egui will direct one.
harfrust = { version = "0.7.0", optional = true }
unicode-bidi = { version = "0.3.18", optional = true }
unicode-bidi-mirroring = { version = "0.4.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# No fontconfig: the known font directories are read directly.
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "memmap"], optional = true }
