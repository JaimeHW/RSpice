[package]
name = "rspice-results-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Fixtures and cache observations for viewer and application integration tests.
test-support = []

[dependencies]
egui = { version = "0.36.2", default-features = false }
egui_extras = { version = "0.35.0", default-features = false }
rspice-ui-kit = { workspace = true, features = ["plot"] }
rspice-app-types.workspace = true
rspice-core = { path = "../rspice-core", version = "0.1.0", default-features = false }
rspice-results = { workspace = true, features = ["engine-evidence"] }
num-complex.workspace = true
serde.workspace = true
thiserror.workspace = true
