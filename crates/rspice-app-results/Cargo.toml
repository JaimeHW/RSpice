[package]
name = "rspice-app-results"
version.workspace = true
edition.workspace = true
description = "The RSpice application's results feature: the Results workspace, result documents and their viewers, result import and waveform export"
license-file.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[features]
# Opens the feature's test-only seams to the application's own tests: the
# frame-work counters (whose painting-geometry half the results painting
# crate counts under its own test-support), the persistence tests' marker
# anchor and source dataset, and the fixtures both suites build from (the
# generated FST file needs its writer, and the run receipts and evidence they
# build are the model's test-support).
test-support = [
    "rspice-app-state/test-support",
    "rspice-results-ui/test-support",
    "dep:fst-writer",
]

[dependencies]
rspice-app-state.workspace = true
rspice-app-services.workspace = true
rspice-app-runs.workspace = true
rspice-app-workbench.workspace = true
rspice-vocabulary.workspace = true
rspice-ui-kit = { workspace = true, features = ["plot"] }
rspice-schematic-editor.workspace = true
rspice-results-ui.workspace = true
rspice-design = { workspace = true, features = ["symbol-artwork"] }
rspice-results = { workspace = true, features = ["engine-evidence"] }
rspice-formats = { workspace = true, features = ["columnar", "fst", "hdf5", "monte-carlo-checkpoint", "native-bundle", "project-results", "result-csv", "result-digital", "result-hdf5", "result-vcd", "result-waveform", "spice-raw", "table-schema", "xlsx"] }
rspice-simulation-contract.workspace = true
serde = { version = "1", features = ["derive", "rc"] }
serde_json.workspace = true
thiserror.workspace = true
num-complex = "0.4"
egui = { version = "0.35.0", default-features = false }
fst-writer = { version = "0.3", optional = true }

[dev-dependencies]
rspice-app-state = { workspace = true, features = ["test-support"] }
rspice-app-services = { workspace = true, features = ["test-support"] }
rspice-app-runs = { workspace = true, features = ["test-support"] }
rspice-app-workbench = { workspace = true, features = ["test-support"] }
rspice-results-ui = { workspace = true, features = ["test-support"] }
rspice-ui-kit = { workspace = true, features = ["test-support"] }
rspice-formats = { workspace = true, features = ["result-validation-observation"] }
csv.workspace = true
rspice-hardcopy.workspace = true
rspice-hardcopy-contract.workspace = true
sha2 = "0.10"
fst-writer = "0.3"
matfile = "0.5"
rustyhdf5 = { version = "1.93", default-features = false }
arrow-array = "60"
arrow-ipc = "60"
arrow-schema = "60"
parquet = { version = "60", default-features = false, features = ["arrow"] }
zip.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "0.17", features = ["file-handle-inner"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rspice-core = { path = "../rspice-core", version = "0.1.0", default-features = false, features = ["veriloga", "wasm"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "js", "serde"] }

[target.'cfg(all(not(target_arch = "wasm32"), any(target_arch = "x86_64", target_arch = "aarch64"), any(target_os = "macos", target_os = "linux", windows)))'.dependencies]
rspice-core = { path = "../rspice-core", version = "0.1.0", default-features = false, features = ["veriloga-native"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(all(any(target_arch = "x86_64", target_arch = "aarch64"), any(target_os = "macos", target_os = "linux", windows)))))'.dependencies]
rspice-core = { path = "../rspice-core", version = "0.1.0", default-features = false, features = ["veriloga"] }

[lints]
workspace = true
