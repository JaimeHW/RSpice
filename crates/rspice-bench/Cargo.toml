[package]
name = "rspice-bench"
description = "Macro-benchmark rig comparing RSpice against reference simulators (M0.5)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rspice-bench"
path = "src/main.rs"

[dependencies]
clap.workspace = true
rspice-veriloga = { path = "../rspice-veriloga", version = "0.1.0", features = ["native"] }
serde.workspace = true
serde_json.workspace = true
wait-timeout = "0.2.1"
