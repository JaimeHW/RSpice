[package]
name = "rspice-bench"
description = "Macro-benchmark rig comparing RSpice against reference simulators (M0.5)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rspice-bench"
path = "src/main.rs"

[features]
# Opt-in: pulls the whole generated built-in corpus into this binary, which
# costs minutes of build time. Off by default so the process-level benchmarks
# stay cheap to build.
generated-stamp = ["dep:rspice-core"]

[dependencies]
blake3 = "1.5"
clap.workspace = true
rspice-core = { path = "../rspice-core", version = "0.1.0", optional = true, default-features = false, features = [
    "veriloga-builtins-models",
] }
rspice-veriloga = { path = "../rspice-veriloga", version = "0.1.0", features = ["native"] }
serde.workspace = true
serde_json.workspace = true
wait-timeout = "0.2.1"

[lints]
workspace = true
