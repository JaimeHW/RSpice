[package]
name = "rspice-cli"
description = "Command-line interface for RSpice circuit simulator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rspice"
path = "src/main.rs"

[dependencies]
rspice-formats = { path = "../rspice-formats", version = "0.1.0", default-features = false }
rspice-veriloga = { path = "../rspice-veriloga", version = "0.1.0" }
rspice-veriloga-runtime.workspace = true
clap.workspace = true
clap_complete.workspace = true
log.workspace = true
env_logger.workspace = true
# Validate the same filter grammar env_logger uses without its stderr warnings.
env_filter = "2"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
indicatif = "0.18"
dirs = "6.0"
toml.workspace = true
rustyhdf5 = "1.93"
# v3 reproduced intermittent access violations during Windows sweep preflight.
# Keep v2 until a newer backend passes sweep replay and recovery qualification.
mimalloc = { version = "0.1.52", default-features = false, features = ["v2"] }
ctrlc = "3.4"
rayon.workspace = true
rspice-output.workspace = true

[target.'cfg(all(any(target_arch = "x86_64", target_arch = "aarch64"), any(target_os = "macos", target_os = "linux", windows)))'.dependencies]
# The native Verilog-A backend is qualified on x64 and ARM64 desktop hosts.
rspice-core = { workspace = true, features = ["veriloga-native"] }

[target.'cfg(not(all(any(target_arch = "x86_64", target_arch = "aarch64"), any(target_os = "macos", target_os = "linux", windows))))'.dependencies]
rspice-core = { workspace = true, features = ["veriloga"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[lints]
workspace = true
