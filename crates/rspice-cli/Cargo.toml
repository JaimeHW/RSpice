[package]
name = "rspice-cli"
description = "Command-line interface for RSpice circuit simulator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rspice"
path = "src/main.rs"
test = false

[dependencies]
rspice-core.workspace = true
rspice-veriloga = { path = "../rspice-veriloga" }
clap.workspace = true
log.workspace = true
env_logger.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
indicatif = "0.17"
dirs = "5.0"
toml = "0.8"
rustyhdf5 = "1.93"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
