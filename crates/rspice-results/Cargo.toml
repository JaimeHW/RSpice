[package]
name = "rspice-results"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
# Engine-backed evidence reuses core's canonical types and validation rules.
engine-evidence = ["dep:rspice-core", "dep:rspice-design-model", "dep:rustfft", "dep:once_cell"]

[dependencies]
rspice-app-types.workspace = true
rspice-design-model = { workspace = true, optional = true }
rspice-core = { path = "../rspice-core", version = "0.1.0", default-features = false, optional = true }
rspice-units.workspace = true
base64.workspace = true
num-complex.workspace = true
once_cell = { version = "1.19", optional = true }
rustfft = { workspace = true, optional = true }
png = "0.18"
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v5"] }

[build-dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js", "v5"] }
