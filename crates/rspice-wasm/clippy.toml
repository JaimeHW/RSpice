# Rule 6 of the production-readiness plan: "Abort is an execution dependency.
# Long-running core entrypoints receive an abort source; a frontend may not
# call a non-abort wrapper."
#
# `rspice-core` keeps a non-abort convenience form of many cancellable entry
# points for third-party embedding. This crate is a first-party surface, so it
# must always reach for the `_with_abort` / `_and_abort` form and thread its
# real cancellation source through it. Listing the convenience forms here
# turns that from a review convention into a build failure under
# `cargo clippy -- -D warnings`, which is why this file exists in every
# first-party surface crate rather than being asserted by a test that reads
# production source text.
#
# A test that genuinely has no cancellation to model still uses the
# `_with_abort` form and passes `rspice_core::abort_signal::NoAbort`, so that
# "this call cannot be cancelled" is written down at the call site.
#
# Only entry points that still have a non-abort form appear here; clippy warns
# about a path it cannot resolve, so a wrapper deleted from core must also be
# deleted from this list.

disallowed-methods = [
    # Circuit construction and readiness
    { path = "rspice_core::engine::Engine::build_circuit", reason = "use build_circuit_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::health_check", reason = "use health_check_with_abort (plan rule 6)" },

    # DC
    { path = "rspice_core::engine::Engine::run_dc_op", reason = "use run_dc_op_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_dc_op_with_report", reason = "use run_dc_op_with_report_and_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_dc_sweep", reason = "use run_dc_sweep_with_abort (plan rule 6)" },

    # Transient
    { path = "rspice_core::engine::Engine::run_tran", reason = "use run_tran_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_tran_with_startup_mode", reason = "use run_tran_with_startup_mode_and_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_tran_compressed", reason = "use run_tran_compressed_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_tran_checkpointed", reason = "use run_tran_checkpointed_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_tran_checkpointed_with_startup_mode", reason = "use run_tran_checkpointed_with_startup_mode_and_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_tran_checkpoint_schedule_with_startup_mode", reason = "use the _and_abort form (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_tran_resume", reason = "use run_tran_resume_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_tran_restart_resume", reason = "use run_tran_restart_resume_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::preflight_transient_checkpoint", reason = "use preflight_transient_checkpoint_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::transient_source_event_times", reason = "use transient_source_event_times_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::transient_source_names", reason = "use transient_source_names_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::validate_transient_source_names", reason = "use validate_transient_source_names_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::validate_periodic_source_contract", reason = "use validate_periodic_source_contract_with_abort (plan rule 6)" },

    # Frequency domain
    { path = "rspice_core::engine::Engine::run_ac", reason = "use run_ac_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_ac_data", reason = "use run_ac_data_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_noise", reason = "use run_noise_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_noise_ports", reason = "use run_noise_ports_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_noise_with_input_source", reason = "use run_noise_with_input_source_and_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_noise_named_with_input_source", reason = "use the _and_abort form (plan rule 6)" },
