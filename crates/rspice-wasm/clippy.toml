    { path = "rspice_core::engine::Engine::run_pac", reason = "use run_pac_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_pnoise", reason = "use run_pnoise_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_pnoise_oscillator", reason = "use run_pnoise_oscillator_with_abort (plan rule 6)" },

    # Statistical and parametric
    { path = "rspice_core::engine::Engine::run_monte_carlo_with_options", reason = "use run_monte_carlo_with_options_and_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_sensitivity", reason = "use run_sensitivity_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_sensitivity_ac", reason = "use run_sensitivity_ac_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_sensitivity_ac_complete", reason = "use run_sensitivity_ac_complete_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_sensitivity_dc_complete", reason = "use run_sensitivity_dc_complete_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_sensitivity_linearized", reason = "use run_sensitivity_linearized_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_step", reason = "use run_step_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_step_command", reason = "use run_step_command_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::plan_step_commands", reason = "use plan_step_commands_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::step_netlists_for_command", reason = "use step_netlists_for_command_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::materialize_step_run", reason = "use materialize_step_run_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::prepare_deck_plan_materializer", reason = "use prepare_deck_plan_materializer_with_abort (plan rule 6)" },
    { path = "rspice_core::execution::topology_fingerprint", reason = "use topology_fingerprint_with_abort (plan rule 6)" },

    # Analysis-level entry points a surface can reach without the engine
    { path = "rspice_core::analysis::fourier::FourierAnalysis::analyze", reason = "use analyze_with_abort (plan rule 6)" },
    { path = "rspice_core::analysis::s_param::extract_s_matrix", reason = "use extract_s_matrix_with_abort (plan rule 6)" },
    { path = "rspice_core::execution::DeckPlan::from_netlist", reason = "use from_netlist_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::TransientCheckpoint::load", reason = "use load_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::TransientCheckpoint::save", reason = "use save_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::TransientCheckpoint::to_bytes", reason = "use to_bytes_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::TransientCheckpoint::to_text", reason = "use to_text_with_abort (plan rule 6)" },
]

# Plan rule 2: no authored-input panic. This crate translates requests from a
# host language and serializes results back, so every index, name and shape it
# reads is authored. `src/lib.rs` denies the panic conveniences; these keep the
# denial on production paths rather than on a test's own preconditions.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
