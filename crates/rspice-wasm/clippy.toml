    { path = "rspice_core::engine::Engine::run_transfer_function", reason = "use run_transfer_function_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_stb", reason = "use run_stb_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_pz_ports", reason = "use run_pz_ports_with_abort (plan rule 6)" },

    # Periodic / RF
    { path = "rspice_core::engine::Engine::run_pss", reason = "use run_pss_with_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_pss_with_dc_seed", reason = "use run_pss_with_dc_seed_and_abort (plan rule 6)" },
    { path = "rspice_core::engine::Engine::run_pss_operating_point_with_dc_seed", reason = "use the _and_abort form (plan rule 6)" },
