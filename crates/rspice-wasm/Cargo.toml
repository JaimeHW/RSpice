[package]
name = "rspice-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for RSpice circuit simulator"
authors = ["RSpice Contributors"]
license-file.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
# WASM bindings
wasm-bindgen = "0.2.108"

# Better error messages in browser console
console_error_panic_hook = { version = "0.1", optional = true }

# Logging for WASM
log = "0.4"
wasm-bindgen-console-logger = "0.1"

# Serialization for JS interop
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# RSpice core - no default features for WASM compatibility
rspice-core = { path = "../rspice-core", default-features = false, features = ["wasm"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
