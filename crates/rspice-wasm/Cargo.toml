[package]
name = "rspice-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WebAssembly bindings for the RSpice simulation engine"

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
rspice-core = { path = "../rspice-core", version = "0.1.0", default-features = false, features = ["wasm"] }
serde.workspace = true
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
