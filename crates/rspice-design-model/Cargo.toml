[package]
name = "rspice-design-model"
description = "Design-management data model and drawing-sheet package contract for RSpice"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Counts the work an edit does, for tests that hold a gesture to it.
# Enabled by `rspice-app`'s dev-dependency; never in a shipping build.
work-observation = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
# A title cell cuts its value only between grapheme clusters, counts an East
# Asian wide character as two cells, and aligns a value to the direction its
# paragraph is read in.
unicode-bidi = "0.3.18"
unicode-normalization.workspace = true
unicode-segmentation = "1.12"
unicode-width = "0.2.2"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser builds need a `getrandom` backend for identity minting.
uuid = { version = "1", features = ["js", "serde", "v4"] }

[lints]
workspace = true
