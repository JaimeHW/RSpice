[package]
name = "rspice-worker"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "rspice-worker"
path = "src/main.rs"
test = false

# The import worker's entry image: loaded only when an import starts.
[[bin]]
name = "rspice-import-worker"
path = "src/import_main.rs"
test = false

[features]
default = []
generated-veriloga-catalog = ["rspice-simulation/generated-veriloga-catalog"]

[dependencies]
rspice-simulation = { workspace = true, features = ["browser-worker"] }
rspice-hardcopy.workspace = true
rspice-design.workspace = true
rspice-core = { path = "../rspice-core", version = "0.1.0", default-features = false, features = ["veriloga-wasm-jit"] }
rspice-veriloga = { path = "../rspice-veriloga", version = "0.1.0", features = ["wasm-jit"] }
serde.workspace = true
serde_json.workspace = true
web-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
serde-wasm-bindgen = "0.6"
# The import worker names a picked file's format as every import does, then reads a rawfile.
rspice-formats = { workspace = true, features = ["fst", "result-waveform", "spice-raw"] }
rspice-results.workspace = true
rspice-results-store.workspace = true
rspice-simulation-contract.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "FileSystemDirectoryHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemSyncAccessHandle",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
rspice-vocabulary.workspace = true
wasm-bindgen-test.workspace = true
