<?xml version="1.0" encoding="UTF-8"?>
<!-- Ideal op-amp: IEEE triangle. Box 40x40,
     pins in+(0,10), in-(0,30), out(40,20). + marks the top input. -->
<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <path d="M 0,10 H 8" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 0,30 H 8" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 32,20 H 40" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 8,4 L 32,20 L 8,36 Z" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 11,10 H 15.4 M 13.2,7.8 V 12.2" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 11,30 H 15.4" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
</svg>
