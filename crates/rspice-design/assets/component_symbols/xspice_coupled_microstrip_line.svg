<?xml version="1.0" encoding="UTF-8"?>
<!-- Coupled microstrip lines (cpmlin): two parallel strips with field
     coupling arcs between them. Line 1 runs p1-&gt;p2 on top, line 2 runs
     p4-&gt;p3 on the bottom; the model's sense inputs share these nodes.
     Box 60x40, pins p1(0,10), p4(0,30), p2(60,10), p3(60,30). -->
<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
  <path d="M 0,10 H 17" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 43,10 H 60" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 0,30 H 17" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 43,30 H 60" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 17,8 H 43 V 12 H 17 Z" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 17,28 H 43 V 32 H 17 Z" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 27.5,14.5 C 26,17 26,23 27.5,25.5" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 32.5,14.5 C 34,17 34,23 32.5,25.5" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
</svg>
