<?xml version="1.0" encoding="UTF-8"?>
<!-- Real-to-voltage bridge (real_to_v / r_to_v): sampled real staircase
     becomes an analog output that ramps between values over the
     transition time. Box 40x20, pins in(0,10), out(40,10). -->
<svg viewBox="0 0 40 20" xmlns="http://www.w3.org/2000/svg">
  <path d="M 0,10 H 8" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 8,2 H 32 V 18 H 8 Z" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 11,13.5 H 13.5 V 7 H 16" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 12.5,7 a 1,1 0 1 0 2,0 a 1,1 0 1 0 -2,0 Z" fill="#000000" stroke="none"/>
  <path d="M 20,13.5 H 22.2 L 24.4,7 H 26.6 L 28.8,10.5" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 32,10 H 40" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
</svg>
