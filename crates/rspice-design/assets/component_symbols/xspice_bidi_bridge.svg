  <path d="M 20,0 V 2" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <path d="M 8,2 H 32 V 18 H 8 Z" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
