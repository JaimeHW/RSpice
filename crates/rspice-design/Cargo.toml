[package]
name = "rspice-design"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
generated-veriloga-catalog = ["rspice-core/veriloga-builtins"]
# Enabled by the app dev-dependency to retain parser/cache regression coverage.
symbol-test-observation = []
# Enabled only by dependent integration tests that construct external/invalid edits.
schematic-test-fixtures = []

[dependencies]
log.workspace = true
regex.workspace = true
rspice-app-types.workspace = true
# Authored source contracts reuse the engine's canonical lexer, AST and dialect rules.
rspice-core = { path = "../rspice-core", version = "0.1.0", default-features = false }
rspice-design-model.workspace = true
rspice-model-library.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
web-time.workspace = true
uuid = { workspace = true, features = ["v5"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js", "v5"] }

[dev-dependencies]
ron = { version = "0.12.2", features = ["integer128"] }
