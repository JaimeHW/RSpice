[package]
name = "rspice-design"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
symbol-artwork = ["dep:usvg"]
generated-veriloga-catalog = [
    "rspice-core-devices/veriloga-builtins",
    "rspice-core-xspice/veriloga-builtins",
]
# Enabled by the app dev-dependency to retain parser/cache regression coverage.
symbol-test-observation = []
# Enabled only by dependent integration tests that construct external/invalid edits.
schematic-test-fixtures = []
# Enabled by the app dev-dependency to count the work an edit does.
work-observation = ["rspice-design-model/work-observation"]

[dependencies]
log.workspace = true
regex.workspace = true
rspice-vocabulary.workspace = true
# Authored source contracts reuse the engine's canonical lexer, AST and dialect
# rules, and its code-model and generated Verilog-A catalogs. Each is named for
# the family crate that holds it. The XSPICE code models are rspice-core under
# the name of the crate that will hold them once rspice-core no longer does.
rspice-core-base.workspace = true
rspice-core-netlist.workspace = true
rspice-core-devices.workspace = true
rspice-core-xspice = { package = "rspice-core", path = "../rspice-core", version = "0.1.0", default-features = false }
rspice-design-model.workspace = true
rspice-model-library.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
usvg = { workspace = true, optional = true }
web-time.workspace = true
uuid = { workspace = true, features = ["v5"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js", "v5"] }

[dev-dependencies]
ron = { version = "0.12.2", features = ["integer128"] }
