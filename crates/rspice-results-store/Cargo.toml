[package]
name = "rspice-results-store"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# The block codec and the frame checksum. Both versions are pinned to the ones
# already in Cargo.lock: the store's bytes are part of its identity, and LZ4's
# output is only deterministic for one encoder version.
lz4_flex = { version = "=0.13.1", default-features = false, features = ["std", "checked-decode"] }
crc32fast = "=1.5.0"
# The logical digest. sha2 0.11 (in Cargo.lock already, through lopdf) runs the
# ARMv8 SHA-2 instructions when the CPU has them; 0.10 runs them only with its
# `asm` feature, whose sha2-asm package the lock does not have, and its software
# rounds cost the writer about 20 ns a sample on Apple silicon.
sha2 = { version = "=0.11.0", default-features = false }
# The engine's result sink trait, which `StoreSink` implements. A layer-0 leaf
# of the engine's base crate; the engine itself is above the store.
rspice-core-base.workspace = true

# The free space of the store's volume, for the disk watch.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# A small transient run through the sink, read back against the in-memory one.
rspice-core.workspace = true
