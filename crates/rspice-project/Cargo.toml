[package]
name = "rspice-project"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Existing application fixtures may model invalid external catalog edits.
library-test-fixtures = ["rspice-project-contract/library-test-fixtures"]
document-fingerprint-observation = []

[dependencies]
rspice-formats = { workspace = true, features = ["project-results"] }
rspice-results = { workspace = true, features = ["engine-evidence"] }
ron = { version = "0.12.2", features = ["integer128"] }
rspice-app-types.workspace = true
rspice-project-contract.workspace = true
rspice-design.workspace = true
rspice-hardcopy-contract.workspace = true
rspice-design-model.workspace = true
rspice-model-library.workspace = true
rspice-simulation-contract.workspace = true
# Source-edge syntax retains the canonical netlist path grammar.
rspice-core = { path = "../rspice-core", version = "0.1.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v5"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
