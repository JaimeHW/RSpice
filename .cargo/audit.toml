[advisories]
# Every accepted advisory is documented with an owner, mitigation, exit
# criterion, and expiring review date in security/advisory-exceptions.toml.
# tools/security/check_advisory_exceptions.py keeps this list synchronized
# with cargo-deny's policy and fails CI when a review expires.
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0206",
]

# cargo audit cannot scope a yanked exception to one release, so while the
# registry accepts one, yanked releases are gated by cargo-deny alone
# (`yanked = "deny"` in deny.toml), which runs in the same jobs and ignores
# only the exact releases recorded there. The checker fails if this stays off
# after the last yanked-release exception is removed.
[yanked]
enabled = false
