schema_version = 1

# Accepted advisories are temporary risk decisions, not permanent allowlists.
# The checker fails on the day after `review_after` and requires this inventory
# to exactly match both deny.toml and .cargo/audit.toml.

[[exceptions]]
id = "RUSTSEC-2024-0436"
dependency = "faer 0.24.4 -> {gemm 0.19.0, gemm-common 0.19.0, pulp 0.22.3} -> paste 1.0.15"
owner = "@JaimeHW"
review_after = "2027-01-17"
reason = "paste is archived and unmaintained, and the advisory lists no patched release. Reviewed 2026-10-18: faer 0.24.4, gemm 0.19.0, gemm-common 0.19.0 and pulp 0.22.3 are each the newest release on crates.io and all still require paste ^1. faer is rspice-core's sparse and dense solver, so no compatible graph drops paste."
mitigations = "paste is a procedural macro: it runs only inside rustc while gemm and pulp compile and links no code of its own into any RSpice binary, native or WebAssembly. No RSpice crate depends on it directly, and no netlist, project, result file or other runtime input reaches it. It comes from the checksum-locked crates.io graph, and locked builds, cargo-deny's source policy and release provenance constrain substitution."
exit_criteria = "Remove this exception when gemm and pulp release on a maintained replacement such as pastey (or drop the macro) and faer adopts those releases, or when a compatible maintained solver release becomes available."

[[exceptions]]
id = "RUSTSEC-2026-0192"
dependency = "winit -> sctk-adwaita -> ab_glyph -> ttf-parser"
owner = "@JaimeHW"
review_after = "2026-10-17"
reason = "The current winit Wayland decoration stack has no compatible maintained replacement for this transitive parser."
mitigations = "This path is confined to the desktop UI font stack; backend CLI and library deployments do not link it. Release builds remain checksum-locked and are exercised on Linux, macOS, and Windows."
exit_criteria = "Upgrade the winit/sctk-adwaita font stack as soon as an upstream release removes the unmaintained ttf-parser version."

[[exceptions]]
id = "RUSTSEC-2026-0206"
dependency = "krilla -> rustybuzz"
owner = "@JaimeHW"
review_after = "2026-10-17"
reason = "rustybuzz became unmaintained and krilla 0.8.2 has no maintained release or compatible shaping-backend migration yet."
mitigations = "RSpice's two krilla exporters shape only three repository-embedded IBM Plex font files. They expose no user-supplied font loading path, and PDF source text, cells, raster pixels, and output bytes are independently bounded."
exit_criteria = "Move to a krilla release backed by harfrust, or replace the simple-text path, as soon as a compatible maintained implementation is available."

[[exceptions]]
crate = "zip@8.6.0"
dependency = "rspice-formats and rust_xlsxwriter 0.99.1 -> zip 8.6.0"
owner = "@JaimeHW"
review_after = "2026-11-16"
reason = "zip yanked every 8.x release when 9.0 fixed three extraction advisories (GHSA-4v9h-p7m9-rh26, GHSA-vv5m-jxxh-4627, GHSA-4684-h2q9-2vcp), and the newest rust_xlsxwriter, 0.99.1, still requires zip ^8.3, so no unyanked release satisfies the graph."
mitigations = "All three advisories are in ZipArchive::extract and ZipStreamReader::extract, which write archive members to the filesystem. RSpice calls neither: its readers take members into memory through by_index, by_name and file_names, and rust_xlsxwriter only writes archives."
exit_criteria = "Move every zip consumer to 9.0.3 or later once rust_xlsxwriter publishes a release on zip 9, then delete this exception and re-enable cargo audit's yanked check."
