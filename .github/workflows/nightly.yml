# Nightly depth: the full release-mode test suite, the ngspice conformance
# run, which fails on any failing deck (the pass-rate log is the artifact),
# and a release build of the shipped binaries on Windows to catch
# LTO/release-only breakage.
name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.94.0"

jobs:
  conformance:
    name: Conformance (Linux, release)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: "2"
    # Every gate after the first carries `if: ${{ !cancelled() }}`: the gates
    # are independent, and a red one must not leave the rest unrun.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      # Each Rust cache is keyed on what decides its dependency build: the
      # external crates Cargo.lock pins, the build profiles, the target
      # rustflags and the toolchain. Workspace manifests stay out of the key,
      # since rust-cache never stores workspace crates, so the key changes only
      # when the stored dependencies would. Caches are saved from main alone;
      # other refs restore main's.
      - name: Fingerprint the dependency build
        id: deps
        shell: bash
        run: >-
          echo "digest=$({ grep -E '^(source|checksum) = ' Cargo.lock;
          awk '/^\[/ { p = /^\[profile\./ } p' Cargo.toml;
          cat .cargo/config.toml rust-toolchain.toml; } | git hash-object --stdin)"
          >> "$GITHUB_OUTPUT"
      # Reads the per-push test-linux cache, which holds the release and
      # debug rspice-conformance dependency builds these gates share; only
      # the release rspice-core suites' dependencies build here.
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: test-linux-${{ steps.deps.outputs.digest }}
          add-rust-environment-hash-key: false
          save-if: false
      - name: Install independent Verilog reference simulators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iverilog verilator
          iverilog -V
          verilator --version
      - name: Core library units (release)
        # The workspace's tests run on every push, in debug (ci.yml). What
        # only a release build shows is a result that changes under
        # optimization, and the core library's units are where that has
        # happened: a deadline test that passed in debug failed in release.
        run: cargo test --locked --release -p rspice-core --lib
      - name: Qualification baseline (release)
        # The baseline gates counts, never wall-clock, so a release build must
        # produce the numbers the debug run in ci.yml does.
        if: ${{ !cancelled() }}
        run: >-
          cargo test --locked --release -p rspice-core
          --test contracts --test no_panic_corpus -- --nocapture
      - name: Xyce conformance suite (release)
        # The Xyce corpus runs in no per-push job; this step is its gate.
        if: ${{ !cancelled() }}
        run: >-
          cargo test --locked -p rspice-conformance --release
          --test xyce_regression --test y_device_policy --no-fail-fast
      - name: Conformance suite unit tests (release)
        # Missing reference tools must fail, rather than silently skipping
        # the independent comparison as the routine tier intentionally does.
        if: ${{ !cancelled() }}
        env:
          RSPICE_VERILOG_ORACLES_REQUIRED: "1"
        run: >-
          cargo test --locked -p rspice-conformance --lib
          --test ngspice_oracle_audit --test verilog_oracles --release --no-fail-fast
          -- --nocapture
      - name: RNM against analog wall clock (release)
        # The performance leg of the dual-representation suite: what a
        # real-number model of a reference block costs against simulating the
        # block. Here rather than in CI for two reasons. It is a wall-clock
        # measurement, which flaps on a loaded per-push runner; and it is only
        # meaningful in release, because the two sides are dominated by
        # different work — matrix solves on one, a Verilog front end on the
        # other — that `opt-level = 0` slows by different factors, so a debug
        # measurement is a different ratio rather than a slower one.
        #
        # --nocapture because the table is the deliverable. The assertion is
        # only that the RNM is the cheaper of the two; P3's 100x exit gate is
        # printed against the measurement rather than asserted, since a
        # wall-clock ratio asserted in CI is a test that fails when the runner
        # is busy.
        if: ${{ !cancelled() }}
        run: >-
          cargo test --locked -p rspice-conformance --release
          --test verilog_rnm_performance -- --nocapture
      - name: Mixed against all-analog wall clock (release)
        # P4's runtime measurement: what executing a circuit's digital half on
        # the Verilog-AMS event wheel costs against simulating the same circuit
        # entirely in the analog domain. Here rather than in CI for exactly the
        # reasons the step above is, and in release for the same one: the two
        # sides are dominated by different work and `opt-level = 0` slows them
        # by different factors.
        #
        # Nothing about the ratio is asserted, and that is deliberate. There is
        # no honest a-priori claim that the interleave is faster on an arbitrary
        # circuit — it is faster exactly when the digital half would otherwise
        # cost the matrix more than the interleave costs in trial machinery.
        # What the step asserts is that both representations still agree, since
        # a ratio between two answers that differ measures nothing; the table
        # says which circuits win and by how much.
        if: ${{ !cancelled() }}
        run: >-
          cargo test --locked -p rspice-conformance --release
          --test verilog_mixed_performance -- --nocapture
      - name: GF180MCU device corpus (release)
        # A released Apache-2.0 foundry PDK: BSIM4 through the vendor's own
        # subcircuit wrappers and corner libraries, across four temperatures.
        # Nightly rather than CI because every case re-parses the 1.3 MB model
        # library, which dominates the runtime.
        if: ${{ !cancelled() }}
        run: >-
          cargo test --locked -p rspice-conformance --release
          --test gf180mcu_devices -- --nocapture
      - name: Oracle-free corpora (release, full depth)
        # ISCAS85 and the ngspice example decks carry no reference data, so
        # this gates execution rather than conformance: every deck must load,
        # build, and either complete or refuse cleanly against its
        # execution-manifest.tsv.
        #
        # EXTENDED=1 is what makes this a nightly step rather than a CI one.
        # The whole ISCAS85 corpus is marked extended — its smallest circuit
        # is 160 gates over a 45nm BSIM4 card and its largest is ~89k netlist
        # lines — so without the flag the simulations are skipped entirely and
        # only discovery and manifest integrity are checked. The deck budget
        # is raised to match; the 120 s default is sized for paranoia.
        if: ${{ !cancelled() }}
        env:
          RSPICE_EXECUTION_EXTENDED: "1"
          RSPICE_EXECUTION_DECK_TIMEOUT_MS: "900000"
        run: >-
          cargo test --locked -p rspice-conformance --release
          --test execution_corpora -- --nocapture --test-threads 1
      - name: Corpus panic gate (release, full depth)
        # Rule 2 of the engineering contract — authored input never panics —
        # over every vendored deck rather than only the ones a reference suite
        # has data for. Ingestion, planning, coordinate materialization and
        # authored-output resolution run in process under `catch_unwind`; the
        # solve stays with the subprocess-isolated regression runners, which is
        # where a solver crash is already attributable.
        #
        # It is a nightly step for the same reason the corpora above are: the
        # sweep is thousands of decks and elaborates most of them, which is
        # minutes rather than seconds. The per-push tier gets the same claim
        # over a deterministic slice, through `rspice-core`'s `no_panic_corpus`
        # target. `--nocapture` so the deck and per-corpus counts reach the
        # log; a gate that silently swept nothing must not look like a pass.
        if: ${{ !cancelled() }}
        run: >-
          cargo test --locked -p rspice-conformance --release
          --test panic_gate -- --nocapture
      - name: ngspice conformance report
        id: ngspice
        # Serial test threads: each deck spawns a case-runner subprocess with
        # a hard per-case timeout; parallel threads oversubscribe the runner
        # and trip the caps. Explicit bash enables pipefail so tee cannot hide
        # a crashed test process behind a successful aggregate row.
        if: ${{ !cancelled() }}
        shell: bash
        run: >-
          cargo test --locked -p rspice-conformance --release --test ngspice_regression
          -- --nocapture --test-threads 1 | tee conformance.log
      - name: Upload conformance log
        if: ${{ !cancelled() && steps.ngspice.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-log
          path: conformance.log
          if-no-files-found: error

  veriloga-corpus:
    name: Verilog-A corpus gates (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Every gate after the first carries `if: ${{ !cancelled() }}`: the gates
    # are independent, and a red one must not leave the rest unrun.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - name: Fingerprint the dependency build
        id: deps
        shell: bash
        run: >-
          echo "digest=$({ grep -E '^(source|checksum) = ' Cargo.lock;
          awk '/^\[/ { p = /^\[profile\./ } p' Cargo.toml;
          cat .cargo/config.toml rust-toolchain.toml; } | git hash-object --stdin)"
          >> "$GITHUB_OUTPUT"
      # Reads the per-push test-linux cache: the release rspice-conformance
      # dependency set, which veriloga-builtins leaves unchanged.
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: test-linux-${{ steps.deps.outputs.digest }}
          add-rust-environment-hash-key: false
          save-if: false
      - name: Corpus golden gates on every generated model
        # The four correctness gates: finite evaluation at every probe point,
        # gmin reaching the devices that read it, stamped Jacobians against a
        # numerical derivative of the stamped currents, and stamped reactive
        # blocks against a numerical derivative of the recovered charge.
        #
        # Nightly rather than per-commit because the feature compiles every
        # generated model in the catalog. Serial threads and a raised stack
        # because the generated bodies are large enough to overflow the 2 MB
        # the test harness gives a spawned thread.
        #
        # The suite lives in rspice-conformance, not rspice-core: it moved there
        # with the rest of the validation code. Pointed at the old package this
        # step fails with "no test target named veriloga_golden", which reads
        # like a missing file rather than a stale path.
        env:
          RUST_MIN_STACK: "67108864"
        run: >-
          cargo test --locked --release -p rspice-conformance --features veriloga-builtins
          --test veriloga_golden -- --test-threads=1
      - name: Generated model routing selectors
        # Which `.model` type and LEVEL selects which generated device, and
        # which selectors must stay on a native evaluator. It rides this job
        # rather than CI because its assertions name models only the complete
        # catalog supplies: against the corpus the gates above already build,
        # it costs one test-binary link. The stack is raised for the same
        # reason as those gates -- instantiating a generated device touches
        # bodies larger than a spawned test thread's default stack.
        if: ${{ !cancelled() }}
        env:
          RUST_MIN_STACK: "67108864"
        run: >-
          cargo test --locked --release -p rspice-conformance --features veriloga-builtins
          --test generated_veriloga_model_routing
      - name: Replay every generated model's captured Verilog-A fingerprints
        # Snapshot replay is deliberately separate from the independent
        # derivative gates above: replay detects behavioral drift, while the
        # oracle determines whether the captured derivative is mathematically
        # defensible. Both must pass.
        if: ${{ !cancelled() }}
        env:
          RUST_MIN_STACK: "67108864"
        run: >-
          cargo run --locked --release -p rspice-conformance
          --features veriloga-builtins --bin rspice-veriloga-golden -- verify
      - name: Measure every generated model's stamp performance
        id: stamp
        # Keep model timings and the same-run BSIM4 reference as evidence.
        # Different model equations and sizes do not have a universal runtime
        # ratio. Initialization, finite output and real contributions still
        # have to qualify before a timing can be reported.
        if: ${{ !cancelled() }}
        run: >-
          cargo run --locked --release -p rspice-bench
          --features generated-stamp -- generated-stamp
          --iterations 2000
          --samples 7
          --out target/veriloga-stamp-qualification.json
      - name: Every model's Jacobian against complex step
        # Phase 7's property gate. `#[ignore]` by default because it compiles
        # the whole model tree through the front end; this is the run that makes
        # it mean something.
        if: ${{ !cancelled() }}
        run: >-
          cargo test --locked --release -p rspice-veriloga --test cfg_derivatives
          the_whole_corpus_matches_complex_step -- --ignored --nocapture
      - name: Shipped models execute through the native x64 device route
        # These probes parse and compile every shipped CMC Verilog-A source,
        # construct the production VerilogADevice, and reject any interpreter
        # fallback. They are release-only and ignored by ordinary cargo test.
        if: ${{ !cancelled() }}
        env:
          RUST_MIN_STACK: "67108864"
        run: >-
          cargo test --locked --release -p rspice-veriloga --features native --lib
          native_x64_shipped_model_devices_run_without_interpreter_fallback
          -- --ignored --nocapture --test-threads=1
      - name: Shipped native x64 finite entries match bytecode
        # Independent backend agreement over every finite current, charge, and
        # Jacobian entry catches native lowering errors that merely-finite
        # smoke tests cannot detect.
        if: ${{ !cancelled() }}
        env:
          RUST_MIN_STACK: "67108864"
        run: >-
          cargo test --locked --release -p rspice-veriloga --features native --lib
          native_x64_shipped_model_finite_entries_match_bytecode_reference
          -- --ignored --nocapture --test-threads=1
      - name: Shipped machine code is the code that was last measured
        # The strongest identity gate the Verilog-A backend has, and until now
        # the only one nothing ran: `#[ignore]`d so no lane pays for it, and
        # named by no workflow, so it stood red against a stale baseline for a
        # day without anyone seeing it. A default `cargo test` prints it as
        # `ignored` inside a green summary, which is why the marking alone was
        # never going to be enough. It belongs here, beside its three siblings,
        # on the run nobody waits for.
        if: ${{ !cancelled() }}
        env:
          RUST_MIN_STACK: "67108864"
        run: >-
          cargo test --locked --release -p rspice-veriloga --features native --lib
          shipped_model_machine_code_census_digest
          -- --ignored --nocapture --test-threads=1
      - name: Core library units against the generated catalog
        # Debug, as `cargo test` builds these units everywhere else, so none of
        # the release tree above is shared. The device library's units hold
        # every generated model to the adapter's contracts in one build.
        # rspice-core's model-gated units take three: DIODE_CMC, R2_CMC,
        # VBIC13 and VBIC13_4T with the noise runtime; EKV with it, for the
        # EKV 2.6 oracle deck; and EKV without it, where the catalog carries
        # no noise.
        if: ${{ !cancelled() }}
        env:
          RUST_MIN_STACK: "67108864"
        run: |
          cargo test --locked -p rspice-core-devices --lib --features veriloga-builtins
          cargo test --locked -p rspice-core --lib --features veriloga-model-diode-cmc,veriloga-model-r2-cmc,veriloga-model-vbic13,veriloga-model-vbic13-4t,veriloga-builtins-noise
          cargo test --locked -p rspice-core --lib --features veriloga-model-ekv-va,veriloga-builtins-noise
          cargo test --locked -p rspice-core --lib --features veriloga-model-ekv-va
      - name: Upload Verilog-A stamp qualification
        if: ${{ !cancelled() && steps.stamp.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veriloga-stamp-qualification
          path: target/veriloga-stamp-qualification.json
          if-no-files-found: error

  generated-hb-models:
    name: Every shipped model through harmonic balance (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Every shipped model, walked by name: one harmonic balance admits must
    # reach its fixture's settled transient, one it refuses must give its
    # named reason, and an admitted model with no fixture fails, so a model
    # the generator newly admits cannot go unchecked. It needs every model
    # feature, so ordinary cargo test ignores it. Measured locally at four
    # build jobs: the release build about 25 minutes cold, the walk under
    # six. The build runs as its own command, and the job runs
    # beside the corpus gates so they keep their time.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - name: Fingerprint the dependency build
        id: deps
        shell: bash
        run: >-
          echo "digest=$({ grep -E '^(source|checksum) = ' Cargo.lock;
          awk '/^\[/ { p = /^\[profile\./ } p' Cargo.toml;
          cat .cargo/config.toml rust-toolchain.toml; } | git hash-object --stdin)"
          >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: generated-hb-models-${{ steps.deps.outputs.digest }}
          add-rust-environment-hash-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Build the walk over every shipped model
        id: build
        run: >-
          cargo test --locked --release -p rspice-core --features veriloga,veriloga-builtins
          --test generated --no-run
      - name: Every shipped model through harmonic balance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          RUST_MIN_STACK: "67108864"
        run: >-
          cargo test --locked --release -p rspice-core --features veriloga,veriloga-builtins
          --test generated every_shipped_model_reaches_its_fixture_or_names_its_refusal -- --ignored

  browser-jit-shipped-sources:
    name: Every shipped model through the browser JIT (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Every shipped Verilog-A model brought into a project as its own
    # Verilog-A: compiled by the worker's compile request, emitted by the
    # browser JIT, then compiled and instantiated by Node's WebAssembly
    # engine, against the outcome the test pins for each source.
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      WASM_BINDGEN_TEST_TIMEOUT: "3000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --target wasm32-unknown-unknown
      - name: Fingerprint the dependency build
        id: deps
        shell: bash
        run: >-
          echo "digest=$({ grep -E '^(source|checksum) = ' Cargo.lock;
          awk '/^\[/ { p = /^\[profile\./ } p' Cargo.toml;
          cat .cargo/config.toml rust-toolchain.toml; } | git hash-object --stdin)"
          >> "$GITHUB_OUTPUT"
      # Reads the per-push wasm-tests cache for its pinned wasm-bindgen-cli
      # install; no per-push job builds the release wasm32 suite.
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: wasm-tests-${{ steps.deps.outputs.digest }}
          add-rust-environment-hash-key: false
          save-if: false
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Build the walk over every shipped source
        id: build
        run: >-
          cargo test --locked --release -p rspice-worker
          --target wasm32-unknown-unknown --test shipped_source_jit --no-run
      - name: Every shipped source through the browser JIT
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          node --version &&
          cargo test --locked --release -p rspice-worker
          --target wasm32-unknown-unknown --test shipped_source_jit

  mixed-determinism:
    name: Mixed-deck determinism (serial vs parallel)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      # Every pinned quantity prints and none is asserted, so what the two runs
      # below produce is the complete emitted set for their build rather than a
      # pass/fail against constants the per-push tier already checks.
      RSPICE_TRI_FAMILY_EMIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - name: Fingerprint the dependency build
        id: deps
        shell: bash
        run: >-
          echo "digest=$({ grep -E '^(source|checksum) = ' Cargo.lock;
          awk '/^\[/ { p = /^\[profile\./ } p' Cargo.toml;
          cat .cargo/config.toml rust-toolchain.toml; } | git hash-object --stdin)"
          >> "$GITHUB_OUTPUT"
      # Reads the per-push test-linux-native cache, which holds the
      # Verilog-A engine dependency set these suites build.
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: test-linux-native-${{ steps.deps.outputs.digest }}
          add-rust-environment-hash-key: false
          save-if: false
      # Serial test threads and --nocapture for both runs: the comparison is
      # over printed lines, and a key printed by two threads at once is a
      # difference in the log rather than in the engine. The `tri_family`
      # folder also holds four suites this comparison has never covered; the
      # skips keep both runs to its transient and event suites and hardening.
      - name: Mixed suites, default features (parallel reductions)
        shell: bash
        run: >-
          cargo test --locked -p rspice-core
          --features veriloga,veriloga-model-diode-cmc --no-fail-fast
          --test tri_family
          --test veriloga_mixed_signal_hardening
          -- --nocapture --test-threads 1
          --skip tri_family_small_signal:: --skip generated_route_parity::
          --skip veriloga_master_shadowing:: --skip veriloga_terminal_currents::
          | tee parallel.log
      # The same suites with rayon and faer/rayon compiled out. faer's
      # serial reductions may sum a row in a
      # different order than its parallel ones, and a summation order that
      # reaches the accepted grid is exactly what a per-fixture hash is shaped
      # to catch: nothing else in the tree runs these decks serially.
      - name: Mixed suites, --no-default-features (serial reductions)
        shell: bash
        run: >-
          cargo test --locked -p rspice-core --no-default-features
          --features veriloga,veriloga-model-diode-cmc --no-fail-fast
          --test tri_family
          --test veriloga_mixed_signal_hardening
          -- --nocapture --test-threads 1
          --skip tri_family_small_signal:: --skip generated_route_parity::
          --skip veriloga_master_shadowing:: --skip veriloga_terminal_currents::
          | tee serial.log
      # One required key per suite, so a suite that linked to nothing fails
      # here instead of quietly shrinking the comparison; --min-keys is the
      # loose floor underneath that.
      #
      # Measured on 8bb2742 (2026-09-13): the two builds agree on all fifty
      # gated records, and on all fifty-seven under --gate-all, so faer's
      # serial reductions land on the same accepted grid and the same solved
      # levels as its parallel ones for every deck here. No key is
      # allow-listed; the first one that needs to be is a finding, and it is
      # recorded with both values rather than by loosening a pin.
      - name: Diff the two emitted fingerprint sets
        run: >-
          python3 tools/ci/compare_trifamily_fingerprints.py
          --label-a parallel --label-b serial
          --min-keys 40
          --require-key deck_a_grid_hash
          --require-key deck_e_grid_hash
          --require-key hardening_clock_divider_grid_hash
          parallel.log serial.log
      - name: Upload emitted fingerprint logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mixed-determinism-logs
          path: |
            parallel.log
            serial.log
          if-no-files-found: error

  # The mixed-signal reference corpus: every design x variant x analysis cell
  # against tests/mixed-corpus/*/outcomes.tsv, once per route. Each route is
  # built once and its designs run in two shards that share that build
  # (`rspice-mixed-corpus run --shard K/2`, disjoint sets balanced by the
  # designs' declared budgets). A whole route is about twenty minutes of the
  # runner's four cores (the worker route on a typical night, the native
  # route on a slow one), and the slowest runners take twice as long.
  mixed-corpus-build:
    name: Mixed-signal reference corpus build (${{ matrix.route }}${{ matrix.os == 'ubuntu-24.04-arm' && ', Linux ARM64' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        route: [interp, native, worker]
        os: [ubuntu-latest]
        # The interpreter and the AArch64 JIT again on Linux ARM64, held to
        # the same outcomes.tsv rows as x64: each cell must reach the outcome
        # x64 records, within the cell's own tolerance. The worker's wasm does
        # not depend on the host, so its leg stays on x64.
        include:
          - route: interp
            os: ubuntu-24.04-arm
          - route: native
            os: ubuntu-24.04-arm
    # No CARGO_BUILD_JOBS: the build takes every core of the runner. rustc's
    # codegen units draw on cargo's job tokens, so one job compiled
    # rspice-core's sixteen units one after another. Four jobs peak at 4.6 GB
    # of rustc together (rspice-veriloga 2.2 GB, rspice-core 2.1 GB), well
    # inside the runner's 16 GB.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: >-
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          ${{ matrix.route == 'worker' && '--target wasm32-unknown-unknown' || '' }}
      - name: Fingerprint the dependency build
        id: deps
        shell: bash
        run: >-
          echo "digest=$({ grep -E '^(source|checksum) = ' Cargo.lock;
          awk '/^\[/ { p = /^\[profile\./ } p' Cargo.toml;
          cat .cargo/config.toml rust-toolchain.toml; } | git hash-object --stdin)"
          >> "$GITHUB_OUTPUT"
      # x64 reads the per-push test-linux cache: the corpus runner's release
      # dependency set is the one test-linux builds for rspice-conformance's
      # release suites (cargo tree: the same crates and features with or
      # without veriloga-native); only the worker's wasm image builds its own.
      # The two ARM64 routes build that set too and share one cache. This job
      # only builds, so it saves on success alone: a failed build would store
      # a partial set that the next runs restore without replacing.
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: ${{ matrix.os == 'ubuntu-24.04-arm' && 'mixed-corpus' || 'test-linux' }}-${{ steps.deps.outputs.digest }}
          add-rust-environment-hash-key: false
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-24.04-arm' }}
      # The shipped browser worker image and its bindings, where the
      # application's simulation-worker.js loads them. Built as ci.yml builds
      # the production image, with the generated compact-model catalog: C5's
      # JUNCAP200 runs in the worker as it does on the desktop.
      - name: Build browser worker image
        if: matrix.route == 'worker'
        run: >-
          cargo build --locked --profile web-release -p rspice-worker
          --bin rspice-worker --features generated-veriloga-catalog
          --target wasm32-unknown-unknown
      - name: Install pinned wasm-bindgen CLI
        if: matrix.route == 'worker'
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Generate browser worker bindings
        if: matrix.route == 'worker'
        run: >-
          wasm-bindgen --target web --out-name rspice-ui-worker
          --out-dir crates/rspice-app/web/pkg
          target/wasm32-unknown-unknown/web-release/rspice-worker.wasm
      # The route is the build: the native route is the veriloga-native
      # build, and the run refuses a binary built as the other. The worker
      # route runs the interp build's cells in the browser worker under Node.
      - name: Build the corpus runner (${{ matrix.route }})
        run: >-
          cargo build --locked --release -p rspice-conformance
          ${{ matrix.route == 'native' && '--features veriloga-native' || '' }}
          --bin rspice-mixed-corpus
      - name: Upload the corpus runner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mixed-corpus-${{ matrix.route }}${{ matrix.os == 'ubuntu-24.04-arm' && '-arm64' || '' }}
          path: target/release/rspice-mixed-corpus
          if-no-files-found: error
          retention-days: 1
      - name: Upload the browser worker image
        if: matrix.route == 'worker'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mixed-corpus-worker-image
          path: crates/rspice-app/web/pkg
          if-no-files-found: error
          retention-days: 1

  mixed-corpus:
    name: Mixed-signal reference corpus (${{ matrix.route }} ${{ matrix.shard }}/2${{ matrix.os == 'ubuntu-24.04-arm' && ', Linux ARM64' || '' }})
    needs: mixed-corpus-build
    # A route whose build failed fails its own shards at the download; the
    # other routes still run.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        route: [interp, native, worker]
        os: [ubuntu-latest]
        shard: [1, 2]
        include:
          - { route: interp, os: ubuntu-24.04-arm, shard: 1 }
          - { route: interp, os: ubuntu-24.04-arm, shard: 2 }
          - { route: native, os: ubuntu-24.04-arm, shard: 1 }
          - { route: native, os: ubuntu-24.04-arm, shard: 2 }
    steps:
      # The runner reads the decks from the checkout it was built in, which
      # is this job's checkout path too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the corpus runner
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mixed-corpus-${{ matrix.route }}${{ matrix.os == 'ubuntu-24.04-arm' && '-arm64' || '' }}
          path: target/release
      - name: Download the browser worker image
        if: matrix.route == 'worker'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mixed-corpus-worker-image
          path: crates/rspice-app/web/pkg
      - name: Restore the runner's execute permission
        run: chmod +x target/release/rspice-mixed-corpus
      # O3 replays RSpice's boundary inputs through Icarus live; the checked-in
      # O1/O2/O4/O5 references need no simulator here.
      - name: Install Icarus Verilog for O3 replay
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iverilog
          iverilog -V
      - name: Mixed corpus (${{ matrix.route }}, shard ${{ matrix.shard }} of 2)
        shell: bash
        run: >-
          node --version &&
          target/release/rspice-mixed-corpus run --extended
          --expect-route ${{ matrix.route }}
          ${{ matrix.route == 'worker' && '--worker crates/rspice-app/web' || '' }}
          --shard ${{ matrix.shard }}/2
      # One design's cells again through the same worker in headless Chrome
      # (tools/ci/browser_worker_host.py), ratcheted against the worker rows
      # the Node runs match. C12 takes Verilog-A JIT models, HDL processes and
      # a transient checkpoint through the browser.
      - name: Mixed corpus worker in Chrome (C12)
        if: matrix.route == 'worker' && matrix.shard == 1
        env:
          RSPICE_WORKER_HOST: python3 tools/ci/browser_worker_host.py
        run: >-
          target/release/rspice-mixed-corpus run --design C12
          --worker crates/rspice-app/web --expect-route worker --jobs 1

  ivtest:
    name: Icarus ivtest selection
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      # A missing checkout or simulator fails the job instead of skipping.
      RSPICE_VERILOG_ORACLES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - name: Fingerprint the dependency build
        id: deps
        shell: bash
        run: >-
          echo "digest=$({ grep -E '^(source|checksum) = ' Cargo.lock;
          awk '/^\[/ { p = /^\[profile\./ } p' Cargo.toml;
          cat .cargo/config.toml rust-toolchain.toml; } | git hash-object --stdin)"
          >> "$GITHUB_OUTPUT"
      # Reads the per-push test-linux cache: the release rspice-conformance
      # dependency set the ivtest runner and suite build.
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: test-linux-${{ steps.deps.outputs.digest }}
          add-rust-environment-hash-key: false
          save-if: false
      # Icarus Verilog and its ivtest suite are GPL. The job builds the v13_0
      # source tag outside the repository for this run only; nothing of it is
      # redistributed, and the repository keeps only test names and RSpice's
      # outcomes (tests/verilog/ivtest-manifest.tsv). The suite's gold files
      # are pinned to that release, so the simulator is built from the same
      # tag rather than taken from the distribution.
      - name: Build Icarus Verilog v13_0 from its source tag
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y autoconf gperf flex bison make g++ libbz2-dev zlib1g-dev
          git clone --depth 1 --branch v13_0 https://github.com/steveicarus/iverilog.git "$RUNNER_TEMP/iverilog"
          cd "$RUNNER_TEMP/iverilog"
          sh autoconf.sh
          ./configure --prefix="$RUNNER_TEMP/iverilog-install"
          make -j"$(nproc)"
          make install
          "$RUNNER_TEMP/iverilog-install/bin/iverilog" -V
          echo "$RUNNER_TEMP/iverilog-install/bin" >> "$GITHUB_PATH"
          echo "RSPICE_IVTEST_DIR=$RUNNER_TEMP/iverilog/ivtest" >> "$GITHUB_ENV"
      # The harness checks itself first: every selected test must pass on the
      # simulator its gold files came from, judged by the harness's own rules.
      - name: ivtest selection through Icarus (harness check, release)
        run: >-
          cargo run --locked -p rspice-conformance --release
          --bin rspice-ivtest -- oracle
      # Every selected test through RSpice against the manifest; a regressed
      # outcome, or an improved one not re-recorded, fails the step.
      - name: ivtest selection through RSpice (release)
        # A red self-check must not hide RSpice's outcomes.
        if: ${{ !cancelled() }}
        run: >-
          cargo test --locked -p rspice-conformance --release
          --test verilog_ivtest -- --nocapture

  release-build:
    name: Release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - name: Build shipped binaries
        run: cargo build --locked --release -p rspice-app -p rspice-cli --features rspice-app/generated-veriloga-catalog
      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/rspice.exe release-artifacts/
            cp target/release/rspice-app.exe release-artifacts/
          else
            cp target/release/rspice release-artifacts/
            cp target/release/rspice-app release-artifacts/
          fi
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: release-artifacts
          if-no-files-found: error
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/*
