# Nightly depth: the full release-mode test suite, the ngspice conformance
# run gated at its recorded watermark (the pass-rate log is the artifact),
# and a release build of the shipped binaries on Windows to catch
# LTO/release-only breakage.
name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.94.0"

jobs:
  conformance:
    name: Conformance & full suite (Linux, release)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: nightly
      - name: Full test suite (release)
        # rspice-conformance is excluded by crate, not by test name: the
        # dedicated ngspice step below runs that suite properly (serial
        # threads, logged, ratcheted) and running it twice would double the
        # nightly. This previously read `-- --skip test_ngspice_ --skip
        # test_full_ngspice`, which depended on test names never changing.
        run: >-
          cargo test --locked --workspace --exclude rspice-python --exclude rspice-wasm
          --exclude rspice-conformance --release
      - name: Core library unit tests (release)
        run: cargo test --locked -p rspice-core --lib --release
      - name: Xyce conformance suite (release)
        # The workspace run above excludes rspice-conformance wholesale, so
        # the Xyce corpus needs its own step or it would silently vanish from
        # nightly.
        run: >-
          cargo test --locked -p rspice-conformance --release
          --test xyce_regression --test y_device_policy
      - name: Conformance suite unit tests (release)
        run: >-
          cargo test --locked -p rspice-conformance --lib
          --test ngspice_oracle_audit --release
      - name: ngspice conformance report
        # Serial test threads: each deck spawns a case-runner subprocess with
        # a hard per-case timeout; parallel threads oversubscribe the runner
        # and trip the caps. The command's own exit status is advisory; the
        # ratchet step below is the gate.
        continue-on-error: true
        run: >-
          cargo test --locked -p rspice-conformance --release --test ngspice_regression
          -- --nocapture --test-threads 1 | tee conformance.log
      - name: Conformance ratchet
        # Accuracy can only move forward: fail the nightly when the full
        # suite reports more failing decks than the recorded watermark.
        # Never lower the floor. Watermark 2 as measured 2026-06-12: the
        # two fourbitadder decks (general + transient), a regression
        # bisected to 5f4f9e41 with a fix in flight; ratchet to 0 when it
        # lands. The grep anchors on the aggregate row of
        # test_full_ngspice_suite_summary and pins the deck count, so a
        # shrinking test universe fails the gate instead of faking
        # progress; bump the count deliberately when decks are added.
        env:
          MAX_FAILING: "2"
        run: |
          failed=$(grep -E '^TOTAL +113 tests' conformance.log | grep -Eo '[0-9]+ failed' | grep -Eo '[0-9]+' | tail -1)
          if [ -z "$failed" ]; then
            echo "full-suite aggregate row (TOTAL ... 113 tests) missing from conformance.log" >&2
            exit 1
          fi
          echo "failing decks: $failed (watermark allows <= $MAX_FAILING)"
          [ "$failed" -le "$MAX_FAILING" ]
      - name: Upload conformance log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-log
          path: conformance.log
          if-no-files-found: error

  veriloga-corpus:
    name: Verilog-A corpus gates (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: veriloga-corpus
      - name: Generated built-ins are current
        # The manifest's generator digest covers the generator's own source and
        # the workspace lockfile, so this catches a corpus that was not
        # regenerated after either changed -- which is silent otherwise until a
        # numeric gate fails for a reason that has nothing to do with numerics.
        run: >-
          cargo run --locked --profile generator -p rspice-veriloga
          --bin rspice-veriloga-gen -- check-builtins
      - name: Corpus golden gates (42 models)
        # The four correctness gates: finite evaluation away from known defects,
        # gmin reaching the devices that read it, stamped Jacobians against a
        # numerical derivative of the stamped currents, and stamped reactive
        # blocks against a numerical derivative of the recovered charge.
        #
        # Nightly rather than per-commit because the feature compiles all 42
        # CMC models. Serial threads and a raised stack because the generated
        # bodies are large enough to overflow the 2 MB the test harness gives a
        # spawned thread.
        env:
          RUST_MIN_STACK: "67108864"
        run: >-
          cargo test --locked -p rspice-core --features veriloga-builtins
          --test veriloga_golden -- --test-threads=1
      - name: Every model's Jacobian against complex step
        # Phase 7's property gate. `#[ignore]` by default because it compiles
        # the whole model tree through the front end; this is the run that makes
        # it mean something.
        run: >-
          cargo test --locked --release -p rspice-veriloga --test cfg_derivatives
          the_whole_corpus_matches_complex_step -- --ignored --nocapture

  release-build:
    name: Release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: nightly-release-${{ matrix.os }}
      - name: Build shipped binaries
        run: cargo build --locked --release -p rspice-ui -p rspice-cli
      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/rspice.exe release-artifacts/
            cp target/release/rspice-ui.exe release-artifacts/
          else
            cp target/release/rspice release-artifacts/
            cp target/release/rspice-ui release-artifacts/
          fi
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}
          path: release-artifacts
          if-no-files-found: error
      - name: Generate artifact attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: release-artifacts/*
