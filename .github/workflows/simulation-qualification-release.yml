name: Simulation qualification release

# Publishes the simulator-qualification policy and corpus as signed OCI
# artifacts. The corpus pins engine series identity at the ULP level, so
# the authoritative generation happens here — linux/amd64, in the same
# pinned builder image as the adapter lane, at the source revision being
# qualified — never on a developer machine.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-qualification-release
  cancel-in-progress: false

env:
  BUILDER_IMAGE: rust:1.94.0-bookworm@sha256:365468470075493dc4583f47387001854321c5a8583ea9604b297e67f01c5a4f
  COSIGN_VERSION: v3.1.2
  ARTIFACT_TYPE: application/vnd.rspice.evidence.v1
  POLICY_MEDIA_TYPE: application/vnd.rspice.simulator-qualification-policy.v1+json
  CORPUS_MEDIA_TYPE: application/vnd.rspice.simulator-qualification-corpus.v1+json
  POLICY_FILE_NAME: simulator-qualification-policy.json
  CORPUS_FILE_NAME: simulator-qualification-corpus.json

jobs:
  publish:
    name: Generate, publish, and sign the qualification policy and corpus
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Reject a mutable or drifted qualification source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --short)" = ""
      - name: Authenticate to the immutable artifact registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install OCI artifact client
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          version: 1.3.2
      - name: Install keyless signing client
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Realize every case and generate the canonical documents
        run: |
          set -euo pipefail
          # The full red/green gate first — every case realized against the
          # live engine — then the generator emits the authoritative bytes.
          docker run --rm \
            --volume "$PWD:/source" \
            --workdir /source \
            --env CARGO_INCREMENTAL=0 \
            --env CARGO_TERM_COLOR=always \
            "$BUILDER_IMAGE" \
            bash -euo pipefail -c '
              cargo test --locked --release -p rspice-qualification-corpus
              cargo run --locked --release -p rspice-qualification-corpus -- qualification-out
            '
      - name: Resolve exact artifact identity and reject tag replacement
        id: package
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          version=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as source:
              print(tomllib.load(source)["workspace"]["package"]["version"])
          PY
          )
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$ ]]
          policy_tag="ghcr.io/${repository}/rspice-simulation-qualification-policy:${version}-${GITHUB_SHA}"
          corpus_tag="ghcr.io/${repository}/rspice-simulation-qualification-corpus:${version}-${GITHUB_SHA}"
          for tag in "$policy_tag" "$corpus_tag"; do
            if oras manifest fetch "$tag" >/dev/null 2>&1; then
              echo "immutable artifact tag already exists: $tag" >&2
              exit 1
            fi
          done
          policy_sha256=$(sha256sum "qualification-out/$POLICY_FILE_NAME" | cut -d ' ' -f 1)
          policy_size_bytes=$(stat -c '%s' "qualification-out/$POLICY_FILE_NAME")
          corpus_sha256=$(sha256sum "qualification-out/$CORPUS_FILE_NAME" | cut -d ' ' -f 1)
          corpus_size_bytes=$(stat -c '%s' "qualification-out/$CORPUS_FILE_NAME")
          {
            echo "policy_tag=$policy_tag"
            echo "corpus_tag=$corpus_tag"
            echo "policy_sha256=$policy_sha256"
            echo "policy_size_bytes=$policy_size_bytes"
            echo "corpus_sha256=$corpus_sha256"
            echo "corpus_size_bytes=$corpus_size_bytes"
          } >>"$GITHUB_OUTPUT"
      - name: Publish both artifacts in the admission fetch shape
        id: publish
        env:
          POLICY_TAG: ${{ steps.package.outputs.policy_tag }}
          CORPUS_TAG: ${{ steps.package.outputs.corpus_tag }}
        run: |
          set -euo pipefail
          # One layer per artifact, bare file name as the title annotation:
          # exactly what the cloud's verified fetch requires.
          (cd qualification-out && oras push "$POLICY_TAG" \
            --artifact-type "$ARTIFACT_TYPE" \
            "$POLICY_FILE_NAME:$POLICY_MEDIA_TYPE")
          (cd qualification-out && oras push "$CORPUS_TAG" \
            --artifact-type "$ARTIFACT_TYPE" \
            "$CORPUS_FILE_NAME:$CORPUS_MEDIA_TYPE")
          policy_digest=$(oras manifest fetch --descriptor "$POLICY_TAG" | jq -r .digest)
          corpus_digest=$(oras manifest fetch --descriptor "$CORPUS_TAG" | jq -r .digest)
          [[ "$policy_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$corpus_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          {
            echo "policy_image=${POLICY_TAG}@${policy_digest}"
            echo "corpus_image=${CORPUS_TAG}@${corpus_digest}"
          } >>"$GITHUB_OUTPUT"
      - name: Sign both immutable artifact digests
        env:
          POLICY_IMAGE: ${{ steps.publish.outputs.policy_image }}
          CORPUS_IMAGE: ${{ steps.publish.outputs.corpus_image }}
        run: |
          set -euo pipefail
          cosign sign --yes "$POLICY_IMAGE"
          cosign sign --yes "$CORPUS_IMAGE"
      - name: Verify both artifacts exactly as release admission fetches them
        env:
          POLICY_IMAGE: ${{ steps.publish.outputs.policy_image }}
          CORPUS_IMAGE: ${{ steps.publish.outputs.corpus_image }}
          POLICY_SHA256: ${{ steps.package.outputs.policy_sha256 }}
          POLICY_SIZE_BYTES: ${{ steps.package.outputs.policy_size_bytes }}
          CORPUS_SHA256: ${{ steps.package.outputs.corpus_sha256 }}
          CORPUS_SIZE_BYTES: ${{ steps.package.outputs.corpus_size_bytes }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/simulation-qualification-release.yml@refs/heads/main"
          fetch_and_compare() {
            local image="$1" sha256="$2" size="$3" media_type="$4" file_name="$5"
            cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$image" >/dev/null
            # The same manifest assertions the cloud's verified fetch makes.
            oras manifest fetch "$image" | jq -e \
              --arg artifact_type "$ARTIFACT_TYPE" \
              --arg digest "sha256:${sha256}" \
              --argjson size "$size" \
              --arg media_type "$media_type" \
              --arg file_name "$file_name" '
              .schemaVersion == 2 and
              .mediaType == "application/vnd.oci.image.manifest.v1+json" and
              .artifactType == $artifact_type and
              (.layers | length) == 1 and
              .layers[0].digest == $digest and
              .layers[0].size == $size and
              .layers[0].mediaType == $media_type and
              .layers[0].annotations["org.opencontainers.image.title"] == $file_name
            ' >/dev/null
            local repository="${image%@sha256:*}"
            repository="${repository%:*}"
            oras blob fetch --output "fetched-$file_name" "${repository}@sha256:${sha256}"
            cmp "fetched-$file_name" "qualification-out/$file_name"
          }
          fetch_and_compare "$POLICY_IMAGE" "$POLICY_SHA256" "$POLICY_SIZE_BYTES" \
            "$POLICY_MEDIA_TYPE" "$POLICY_FILE_NAME"
          fetch_and_compare "$CORPUS_IMAGE" "$CORPUS_SHA256" "$CORPUS_SIZE_BYTES" \
            "$CORPUS_MEDIA_TYPE" "$CORPUS_FILE_NAME"
          {
            echo '### Simulation qualification dispatcher inputs'
            echo "- \`simulation_qualification_policy_image\`: \`$POLICY_IMAGE\`"
            echo "- \`simulation_qualification_policy_sha256\`: \`$POLICY_SHA256\`"
            echo "- \`simulation_qualification_policy_size_bytes\`: \`$POLICY_SIZE_BYTES\`"
            echo "- \`simulation_qualification_corpus_image\`: \`$CORPUS_IMAGE\`"
            echo "- \`simulation_qualification_corpus_manifest_sha256\`: \`$CORPUS_SHA256\`"
            echo "- \`simulation_qualification_corpus_manifest_size_bytes\`: \`$CORPUS_SIZE_BYTES\`"
            echo "- certificate identity: \`$identity\`"
          } >>"$GITHUB_STEP_SUMMARY"
