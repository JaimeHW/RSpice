name: Engine adapter component release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-component-release
  cancel-in-progress: false

env:
  BUILDER_IMAGE: rust:1.94.0-bookworm@sha256:365468470075493dc4583f47387001854321c5a8583ea9604b297e67f01c5a4f
  COSIGN_VERSION: v3.1.2
  PREDICATE_TYPE: https://rspice.app/attestations/simulator-component/v1
  ENGINE_NAME: rspice

jobs:
  conformance:
    name: Release conformance gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Reject a mutable or drifted conformance source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --short)" = ""
      - name: Prove the engine source with release conformance
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/source" \
            --workdir /source \
            --env CARGO_INCREMENTAL=0 \
            --env CARGO_TERM_COLOR=always \
            --env RSPICE_EXECUTION_EXTENDED=1 \
            --env RSPICE_EXECUTION_DECK_TIMEOUT_MS=900000 \
            "$BUILDER_IMAGE" \
            bash -euo pipefail -c '
              cargo test --locked --release -p rspice-core --lib --tests
              cargo test --locked --release -p rspice-engine-adapter
              cargo test --locked --release -p rspice-conformance --lib \
                --test ngspice_oracle_audit --test y_device_policy
              cargo test --locked --release -p rspice-conformance \
                --test xyce_regression --test gf180mcu_devices -- --nocapture
              cargo test --locked --release -p rspice-conformance \
                --test execution_corpora -- --nocapture --test-threads 1
              set +e
              cargo test --locked --release -p rspice-conformance \
                --test ngspice_regression -- --nocapture --test-threads 1 \
                | tee engine-release-conformance.log
              status=${PIPESTATUS[0]}
              set -e
              failed=$(grep -E "^TOTAL +113 tests" engine-release-conformance.log \
                | grep -Eo "[0-9]+ failed" | grep -Eo "[0-9]+" | tail -1)
              test -n "$failed"
              test "$failed" -eq 0
              test "$status" -eq 0
            '

  publish:
    name: Build, publish, sign, and attest /rspice-engine-adapter
    needs: conformance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Reject a mutable or drifted component source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --short)" = ""
      - name: Authenticate to the immutable component registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install BuildKit driver
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install keyless signing client
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Test and build the adapter in the runtime-matched toolchain
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/source" \
            --workdir /source \
            --env CARGO_INCREMENTAL=0 \
            --env CARGO_TERM_COLOR=always \
            --env RSPICE_BUILD_SHA="$GITHUB_SHA" \
            "$BUILDER_IMAGE" \
            bash -euo pipefail -c '
              cargo test --locked --release -p rspice-engine-adapter
              cargo build --locked --release -p rspice-engine-adapter
            '
      - name: Smoke the packaged executor exactly as the worker launches it
        run: |
          set -euo pipefail
          binary="$PWD/target/release/rspice-engine-adapter"
          test -f "$binary"
          test -x "$binary"

          "$binary" component-info | tee component-info.json
          version=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as source:
              print(tomllib.load(source)["workspace"]["package"]["version"])
          PY
          )
          test "$(jq -r .engine_name component-info.json)" = "rspice"
          test "$(jq -r .engine_build component-info.json)" = "${version}+${GITHUB_SHA}"
          test "$(jq -r .runtime_mode component-info.json)" = "self_contained"
          test "$(jq -c .protocol_versions component-info.json)" = "[3]"

          # The exact deterministic protocol-3 request the RSpice-Cloud
          # release probe replays, launched under the same contract: cleared
          # environment, protocol flags only, pre-created artifacts/ and
          # results/, one request on stdin. Its digests are pinned upstream.
          job_directory="$(mktemp -d)"
          mkdir -m 0700 "$job_directory/artifacts" "$job_directory/results"
          cat >"$job_directory/request.json" <<'REQUEST'
          {"protocol_version":3,"simulation_run_id":"019f76ae-0000-7000-8000-000000000703","circuit_id":"019f76ae-0000-7000-8000-000000000701","attempt":1,"request_digest_version":1,"request_sha256":"62ed89a0528762860da1f9897b6ecd35e0fa5c6e7eb7568f575034f92c6d7d1c","analysis":{"kind":"operating_point"},"revision":{"id":"019f76ae-0000-7000-8000-000000000702","schema_version":1,"content_digest_version":2,"content_sha256":"88767794c6fcedd647712673b43e3f4c409697cd4e4a133377ba45af4dd25bcc","document":{"components":[],"schema":"rspice-circuit-v1"},"artifacts":[]}}
          REQUEST
          run_smoke() {
            (cd "$job_directory" && env -i \
              RSPICE_ENGINE_PROTOCOL_VERSION=3 \
              RSPICE_ENGINE_INPUT=stdin-json \
              RSPICE_ENGINE_OUTPUT=stdout-json \
              "$binary" <request.json)
          }
          run_smoke >first-response.json
          test "$(jq -r .status first-response.json)" = "succeeded"
          test "$(jq -r .result_manifest.format first-response.json)" = "rspice-result-v1"
          test "$(jq -r .result_manifest.analysis_kind first-response.json)" = "operating_point"
          test "$(jq 'has("result_artifacts")' first-response.json)" = "false"
          test -z "$(ls -A "$job_directory/results")"
          # Deterministic replay compares responses bit for bit; the lane
          # gates on the same determinism before any image is published.
          run_smoke >second-response.json
          cmp first-response.json second-response.json

          # The launch contract fails closed: a delegated-solver deployment
          # shape must be refused without emitting a response.
          if (cd "$job_directory" && env -i \
              RSPICE_ENGINE_PROTOCOL_VERSION=3 \
              RSPICE_ENGINE_INPUT=stdin-json \
              RSPICE_ENGINE_OUTPUT=stdout-json \
              RSPICE_ENGINE_SOLVER_PATH=/nonexistent \
              "$binary" <request.json >misdeployed-response.json); then
            echo "the adapter accepted a delegating deployment shape" >&2
            exit 1
          fi
          test ! -s misdeployed-response.json
      - name: Resolve exact component identity and reject tag replacement
        id: package
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          version=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as source:
              print(tomllib.load(source)["workspace"]["package"]["version"])
          PY
          )
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$ ]]
          image="ghcr.io/${repository}/rspice-engine-adapter:${version}-${GITHUB_SHA}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "immutable component tag already exists: $image" >&2
            exit 1
          fi
          engine_build="${version}+${GITHUB_SHA}"
          [[ "$engine_build" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,119}$ ]]
          exported_file_sha256=$(sha256sum target/release/rspice-engine-adapter | cut -d ' ' -f 1)
          build_recipe_sha256=$(sha256sum .github/workflows/engine-component-release.yml | cut -d ' ' -f 1)
          capabilities_manifest_sha256=$(sha256sum tools/release/engine-adapter-capabilities.json | cut -d ' ' -f 1)
          {
            echo "image=$image"
            echo "engine_build=$engine_build"
            echo "exported_file_sha256=$exported_file_sha256"
            echo "build_recipe_sha256=$build_recipe_sha256"
            echo "capabilities_manifest_sha256=$capabilities_manifest_sha256"
          } >>"$GITHUB_OUTPUT"
      - name: Stage exactly the exported executor for the carrier image
        run: |
          set -euo pipefail
          install -d component-context
          install -m 0555 target/release/rspice-engine-adapter component-context/rspice-engine-adapter
      - name: Build and publish the immutable component image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: component-context
          file: tools/release/engine-component.Dockerfile
          platforms: linux/amd64
          build-args: |
            RSPICE_BUILD_SHA=${{ github.sha }}
          tags: ${{ steps.package.outputs.image }}
          push: true
          provenance: mode=max
          sbom: true
      - name: Sign the immutable component digest
        env:
          IMAGE: ${{ steps.package.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest the simulator component contract
        env:
          IMAGE: ${{ steps.package.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          ENGINE_BUILD: ${{ steps.package.outputs.engine_build }}
          EXPORTED_FILE_SHA256: ${{ steps.package.outputs.exported_file_sha256 }}
          BUILD_RECIPE_SHA256: ${{ steps.package.outputs.build_recipe_sha256 }}
          CAPABILITIES_MANIFEST_SHA256: ${{ steps.package.outputs.capabilities_manifest_sha256 }}
        run: |
          set -euo pipefail
          jq -n \
            --arg exported_file_sha256 "$EXPORTED_FILE_SHA256" \
            --arg engine_name "$ENGINE_NAME" \
            --arg engine_build "$ENGINE_BUILD" \
            --arg source_repository "${GITHUB_REPOSITORY,,}" \
            --arg source_sha "$GITHUB_SHA" \
            --arg build_recipe_sha256 "$BUILD_RECIPE_SHA256" \
            --arg capabilities_manifest_sha256 "$CAPABILITIES_MANIFEST_SHA256" \
            '{format_version: 1, role: "adapter",
              exported_path: "/rspice-engine-adapter",
              exported_file_sha256: $exported_file_sha256,
              engine_name: $engine_name,
              engine_build: $engine_build,
              protocol_versions: [3],
              source_repository: $source_repository,
              source_sha: $source_sha,
              build_recipe_sha256: $build_recipe_sha256,
              capabilities_manifest_sha256: $capabilities_manifest_sha256}' \
            >simulator-component-predicate.json
          cosign attest --yes \
            --predicate simulator-component-predicate.json \
            --type "$PREDICATE_TYPE" \
            "$IMAGE@$DIGEST"
      - name: Verify the published component end to end
        env:
          IMAGE: ${{ steps.package.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          ENGINE_BUILD: ${{ steps.package.outputs.engine_build }}
          EXPORTED_FILE_SHA256: ${{ steps.package.outputs.exported_file_sha256 }}
          CAPABILITIES_MANIFEST_SHA256: ${{ steps.package.outputs.capabilities_manifest_sha256 }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/engine-component-release.yml@refs/heads/main"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST" >/dev/null
          cosign verify-attestation \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --type "$PREDICATE_TYPE" \
            "$IMAGE@$DIGEST" >/dev/null
          container_id=$(docker create "$IMAGE@$DIGEST" /rspice-engine-adapter)
          docker cp "$container_id:/rspice-engine-adapter" exported-rspice-engine-adapter
          docker rm "$container_id" >/dev/null
          test "$(sha256sum exported-rspice-engine-adapter | cut -d ' ' -f 1)" = "$EXPORTED_FILE_SHA256"
          {
            echo '### Simulator component dispatcher inputs'
            echo "- \`worker_runtime_mode\`: \`self_contained\`"
            echo "- \`worker_engine_name\`: \`$ENGINE_NAME\`"
            echo "- \`worker_engine_build\`: \`$ENGINE_BUILD\`"
            echo "- \`worker_adapter_image\`: \`$IMAGE@$DIGEST\`"
            echo "- \`worker_adapter_sha256\`: \`$EXPORTED_FILE_SHA256\`"
            echo "- \`worker_solver_image\` / \`worker_solver_sha256\`: empty (self-contained)"
            echo "- certificate identity: \`$identity\`"
            echo "- capabilities manifest sha256: \`$CAPABILITIES_MANIFEST_SHA256\`"
            echo "- component identity: \`$(jq -c . component-info.json)\`"
          } >>"$GITHUB_STEP_SUMMARY"
