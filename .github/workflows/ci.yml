# Per-commit gate: build the workspace warning-clean and run the fast test
# tier on Linux/Windows, plus a macOS desktop compile check. The ngspice conformance suites are excluded
# here for runtime; they gate in nightly.yml against the conformance
# watermark. The live-oracle audit is `#[ignore]` and never runs in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.94.0"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  test-linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # rspice-veriloga-models and its models/* members are emitted by
      # `rspice-veriloga-gen`, and the build validates them against a content
      # digest of the generated bytes. Reformatting them would fail that
      # validation, so the generator owns their layout and they stay out of
      # this gate. `cargo fmt` has no --exclude, and the hand-maintained
      # package list this step used to carry had silently fallen ten members
      # behind the workspace: rspice-output, rspice-engine-adapter,
      # rspice-design-model, the two automation crates, rspice-pack, the three
      # cloud crates and rspice-sheet-publisher were all unformatted by CI.
      #
      # Enumerate the members from the manifest instead, so a crate added
      # tomorrow is covered the day it lands rather than the day someone
      # remembers this list. One package per invocation keeps the command line
      # short on every runner, and names the offending crate on failure.
      #
      # The vendored cloud trees (rspice-pack, rspice-cloud-*) are in the gate:
      # they are rustfmt-clean today, and a vendor sync that stops emitting
      # rustfmt-clean bytes is something to see rather than to absorb. Fix such
      # a drop upstream — reformatting in place would break the byte digests in
      # tools/cloud/vendor-manifest.json.
      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          members=$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print("\n".join(sorted(p["name"] for p in json.load(sys.stdin)["packages"])))')
          checked=0
          for member in $members; do
            case "$member" in
              rspice-veriloga-models|rspice-veriloga-model-*) continue ;;
            esac
            cargo fmt -p "$member" -- --check
            checked=$((checked + 1))
          done
          echo "rustfmt checked $checked workspace member(s)"
          test "$checked" -ge 25
      - name: Lint GitHub workflows
        run: |
          export GOBIN="$RUNNER_TEMP/actionlint-bin"
          go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          "$GOBIN/actionlint" .github/workflows/*.yml
      - name: CI configuration tests
        run: python3 tools/ci/test_ci_configuration.py
      - name: Vendored cloud client integrity
        run: python3 tools/ci/test_cloud_client_vendor.py
      - name: WASM playground worker tests
        run: python3 tools/ci/test_wasm_playground.py
      - name: WASM IDE worker tests
        run: python3 tools/ci/test_ide_worker.py
      - name: Native release packager tests
        run: python3 tools/release/test_package_native.py
      - name: Managed Python runtime staging tests
        run: python3 tools/release/test_stage_managed_python.py
      - name: Browser automation runtime asset integrity
        run: python3 tools/ci/test_automation_runtime_assets.py
      - name: Source-distribution lockfile repair tests
        run: python3 tools/release/test_repair_sdist_lock.py
      - name: No restricted model files are vendored
        run: python3 tools/models/license_audit.py --check
      - name: Model pack manifest and catalog are current
        run: python3 tools/models/build_manifest.py --check
      - name: Check (warnings denied)
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked --workspace --exclude rspice-python --exclude rspice-wasm
      - name: Check granular generated Verilog-A features
        # The model-less base shard is checked with `--all-targets`
        # because the defect it guards lives in `#[cfg(test)]` code.
        # With no `veriloga-model-*` feature the generated
        # `GeneratedBuiltinKind` has no variants, so every type holding
        # one is uninhabited and a test helper that builds one becomes
        # unreachable code. A bare `cargo check` never compiles that
        # target, and no other lint lane reaches this shard: the
        # workspace Clippy below runs default features, which exclude
        # the catalog outright, and `python.yml` lints `--all-features`,
        # which selects every model and leaves the enum inhabited.
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check --locked -p rspice-core --no-default-features --features veriloga-model-diode-cmc,veriloga-builtins-noise
          cargo check --locked -p rspice-core --features veriloga-builtins-base --all-targets
          cargo test --locked -p rspice-core --features veriloga-model-diode-cmc --test generated_veriloga_feature_shards
          cargo test --locked -p rspice-core --features veriloga-model-diode-cmc,veriloga-builtins-noise --test generated_veriloga_feature_shards
          cargo check --locked -p rspice-core --features veriloga-model-hisimhv-va,veriloga-builtins-noise
      - name: Audit complete generated Verilog-A catalog
        run: cargo run --locked -p rspice-veriloga-catalog-dump -- --validate-only
      # The XSPICE registry is assembled in code, not generated from a
      # checked-in catalog, so no build artifact proves it coherent. Its dump
      # tool was a workspace member this file only ever formatted; running its
      # audit is the only thing that reads what a release actually registers.
      - name: Audit built-in XSPICE registry
        run: cargo run --locked -p rspice-xspice-catalog-dump -- --validate-only
      - name: Test generated Verilog-A GUI contracts
        run: >-
          cargo test --locked -p rspice-ui
          --features generated-veriloga-catalog
          --lib generated_veriloga
      - name: Clippy (warnings denied)
        run: cargo clippy --locked --workspace --exclude rspice-python --exclude rspice-wasm --all-targets --message-format short -- -D warnings
      - name: Clear check artifacts before tests
        run: cargo clean
      - name: Core architecture ratchets
        # Layer order, source reachability, and public-surface size. These
        # also run inside the fast tier below, but they take under a second
        # and an architectural regression should be legible on its own line
        # rather than buried in a multi-minute suite.
        run: >-
          cargo test --locked -p rspice-core
          --test module_layering
          --test module_reachability
          --test public_surface
      - name: GUI architecture ratchet
        # The same argument as the step above, for the application crate: two
        # layer orders, plus ceilings on file size, `&mut RSpiceApp` breadth,
        # public modules, and lint suppressions — and the hierarchy program's
        # four ratchets beside them.
        #
        # It needs its own line because no other rspice-ui step reaches it.
        # Every other invocation in this file is `--lib`, `--bin`, or a
        # `--lib` name filter, and none of those build an integration test.
        # For a fortnight the only job that ran this target was Coverage,
        # which was red for unrelated reasons, so five of its eleven subtests
        # went red without failing a build. A ratchet nothing runs is a
        # comment.
        run: >-
          cargo test --locked -p rspice-ui
          --test module_layering
          --test hierarchy_guards
      - name: Test core integration tests (fast tier)
        # No feature flag and no name filter. Both conformance suites live in
        # rspice-conformance now, so this target contains none of them. It
        # previously read `-- --skip test_ngspice_ --skip test_full_ngspice`,
        # which silently depended on 53 tests never being renamed — a rename
        # would have either turned a multi-minute suite loose in the fast tier
        # or disabled one meant to run. The crate boundary replaced it.
        run: cargo test --locked -p rspice-core --tests
      - name: Core library unit tests
        run: cargo test --locked -p rspice-core --lib
      - name: Conformance suite unit tests
        # The ngspice runner's own unit tests — tolerance model, directive
        # classification, reference-table decoding — used to run as part of
        # `-p rspice-core --lib`, and the oracle-audit helper tests as part of
        # `-p rspice-core --tests`. Both moved with the suite, so run them
        # here; without this the move would silently drop 37 tests.
        #
        # Targets are named explicitly rather than using `--tests`: that would
        # also pull in `ngspice_regression` and `xyce_regression`, the vendored
        # deck corpora, which belong to nightly.
        #
        # `verilog_oracles` belongs in the fast tier because it is cheap here
        # for a specific reason: neither Icarus Verilog nor Verilator is on this
        # image, so the oracle arm reports its absence and returns, leaving the
        # corpus-integrity and testbench-generation checks. Installing the two
        # binaries is what makes it a real conformance step, and the step to
        # pair with that is setting RSPICE_VERILOG_ORACLES_REQUIRED=1 so a
        # later disappearance fails instead of silently going back to skipping.
        #
        # `verilog_scale` runs in the same tier and for the same reason. It is
        # the gate-level scale suite: twelve generated circuits from 208 to
        # 3140 gates, driven through RSpice against reference models. The whole
        # of it is about twenty seconds in a debug build with the array
        # multiplier — the deepest circuit, and half the total on its own —
        # dominating. That is measured rather than assumed, and if it grows
        # past a minute the multiplier is the case to move to nightly, not the
        # suite.
        #
        # `verilog_ams` is the Verilog-AMS real-net corpus, and it belongs here
        # unconditionally rather than for the reason the other two do: it has
        # no oracle arm to be absent. Neither Icarus nor Verilator implements
        # `wreal` in a form this harness could hold to an answer, so the whole
        # suite is RSpice against reference models written from the clause, and
        # installing a simulator would not change what it runs. Two cases and
        # twelve vectors — it is milliseconds.
        #
        # `verilog_rnm_agreement` is the same corpus's second answer to having
        # no oracle: five reference blocks, each authored twice — once as a
        # SPICE deck simulated by the transient engine, once as a `wreal` design
        # run on the digital host — held to a bound derived from the block's own
        # physics. Those five are small decks, a few hundred accepted transient
        # points each, and under a second in this debug build.
        #
        # It also carries one production-scale block, a 7-bit flash converter:
        # 257 nodes, 127 nonlinear devices, five thousand accepted points, about
        # nine seconds of this debug build. That is a tenth of what
        # `verilog_scale` costs in the same step and it is here for the reason
        # the small ones are — it is a correctness gate, and it is specifically
        # the precondition of the wall-clock measurement below, since a ratio
        # between two representations that disagree is not a speedup. If it
        # grows past a minute it is the case to move to nightly, not the suite.
        #
        # Its sibling target `verilog_rnm_performance` is deliberately *not*
        # named here — it is a wall-clock measurement, which belongs in nightly
        # and in release.
        #
        # `verilog_ams_semantics` is the LRM-clause-tagged semantics suite:
        # eleven cases over nine clauses, each deriving its expected answer from
        # the clause it cites rather than from a recorded run. Half of them are
        # discrete-domain designs and half are mixed decks; none simulates for
        # longer than a microsecond, so the whole target is a fifth of a second.
        #
        # `verilog_mixed_benchmarks` is P4's exit gate: three mixed-signal
        # circuits — a successive-approximation converter, a phase-locked loop
        # and a sigma-delta modulator — each simulated once with its digital
        # half on the event wheel and once with every part of it analog, held to
        # bounds derived from each circuit's own physics. About eight seconds in
        # this debug build, dominated by the modulator's two thousand clock
        # periods. It belongs here rather than in nightly for the reason
        # `verilog_rnm_agreement`'s flash converter does: it is a correctness
        # gate, and it is specifically the precondition of the wall-clock
        # measurement below, since a ratio between two representations that
        # disagree is not a speedup. If it grows past a minute the modulator is
        # the case to move, not the suite.
        #
        # Its own sibling `verilog_mixed_performance` is likewise *not* named
        # here, for the reason `verilog_rnm_performance` is not.
        run: >-
          cargo test --locked -p rspice-conformance --lib
          --test ngspice_oracle_audit --test y_device_policy
          --test verilog_oracles --test verilog_scale --test verilog_ams
          --test verilog_ams_semantics
          --test verilog_rnm_agreement --test verilog_mixed_benchmarks
      - name: Oracle-free corpora (routine tier)
        # The execution corpora are cheap here only because the expensive
        # decks opt out: every ISCAS85 deck is marked `!extended` and is
        # skipped without RSPICE_EXECUTION_EXTENDED=1, so this step runs the
        # ~200 ngspice example decks and, for ISCAS85, checks discovery and
        # manifest integrity without simulating. Nightly runs the full depth.
        #
        # Worth keeping in CI despite the weaker claim: these decks are the
        # ones that catch ingestion regressions, because unlike the reference
        # corpora they were not written by someone who could already simulate
        # them.
        run: >-
          cargo test --locked -p rspice-conformance --release
          --test execution_corpora -- --test-threads 1
      - name: Verilog-A suite unit tests
        # The Verilog-A suite sits behind `veriloga-builtins-base`, so the
        # featureless run above compiles the whole module — oracle included —
        # out, and none of its tests would execute in CI. The feature enables
        # no models on its own, so this costs a compile of the suite and
        # nothing of the corpus. It moved from rspice-core's lib target to
        # rspice-conformance with the rest of the validation code.
        run: >-
          cargo test --locked -p rspice-conformance --lib
          --features veriloga-builtins-base
      - name: Clear core test artifacts
        run: cargo clean
      - name: Test non-UI crates (fast tier)
        run: >-
          cargo test --locked -p rspice-matrix -p rspice-cli -p rspice-veriloga -p rspice-bench
          -p rspice-publication-contract -p rspice-publish -p rspice-viewer
      - name: Gate KLU correctness, fill, and kernel latency
        id: klu-qualification
        # Absolute per-factor-nonzero budgets are deliberately loose enough
        # for shared hosted runners, but tight enough to catch an accidental
        # return to allocating/refactoring symbolically on every Newton step.
        # The benchmark validates componentwise backward error outside the
        # timed region, so a faster but numerically rejected solve cannot pass.
        run: >-
          cargo run --locked --release -p rspice-bench -- klu
          --samples 7
          --refactors 300
          --expander-size 500
          --expander-refactors 10
          --max-refactor-ns-per-lu-nnz 4.0
          --max-solve-ns-per-lu-nnz 2.5
          --max-fill-ratio 1.60
          --out target/klu-ci-qualification.json
      - name: Upload KLU qualification
        # The gate writes its report before it rules on the budgets, so a
        # budget failure must still publish its measurements. Condition on the
        # gate having run rather than on the job being healthy: `always()` also
        # fires for the forty steps ahead of it, and `if-no-files-found: error`
        # then reports a missing KLU artifact on top of whatever actually broke.
        if: ${{ !cancelled() && steps.klu-qualification.conclusion != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: klu-ci-qualification
          path: target/klu-ci-qualification.json
          if-no-files-found: error
      - name: Gate generated Verilog-A Rust resources
        # Ratchets, not targets. Every budget here is the measured tree plus
        # roughly 11% — enough headroom to add a model, not enough for a
        # regression to hide in. Measured 2026-07-28: 50,086,163 bytes total,
        # 15,218,952 noise, 4,189,431 for the largest model (hisimhv_va), 339
        # files. The file count includes independent package files that let
        # Cargo cache and compile the 43 model shards in parallel.
        #
        # These were 113 MB / 59 MB / 8.8 MB / 650 until now, sized against the
        # old backend's 104 MB tree and never re-derived when the rebuild cut it
        # to 50 MB. A budget sitting 2-4x above reality does not fail when
        # something regresses; it fails once the tree has doubled.
        #
        # The pooled workspace budget is 0 because the measured value is 0 for
        # every model: the canonical emitter does not allocate one. Zero is
        # enforced as a bound rather than read as "unset", so this now says "no
        # model may reintroduce a pooled workspace" instead of allowing 650 kB
        # of one to appear unnoticed.
        run: >-
          cargo run --locked -p rspice-bench -- generated-rust
          --max-source-bytes 56000000
          --max-noise-source-bytes 17000000
          --max-model-source-bytes 4700000
          --max-file-count 380
          --max-pooled-workspace-payload-bytes 0
          --max-stamp-state-payload-bytes 6200
          --top 10
      - name: Gate representative generated Verilog-A stamp performance
        # Same-run ratios survive hosted-runner speed differences. This subset
        # spans cheap through relatively expensive models and keeps the
        # per-commit build bounded; nightly measures all 43.
        run: >-
          cargo run --locked -p rspice-bench --release
          --features generated-stamp-subset -- generated-stamp
          --iterations 2000
          --samples 7
          --max-corpus-median-reference-ratio 1.25
          --max-model-reference-ratio 4.25
      - name: Compile Verilog-A native JIT tests (Linux x64)
        run: |
          cargo test --locked -p rspice-veriloga --features native native:: --no-run
          cargo test --locked -p rspice-veriloga --release --features native native:: --no-run
      - name: Test Verilog-A native JIT units (Linux x64)
        run: |
          cargo test --locked -p rspice-veriloga --features native native:: -- --test-threads=1
          cargo test --locked -p rspice-veriloga --release --features native native:: -- --test-threads=1
      - name: Test Verilog-A core transient suite through the native JIT (Linux x64)
        # No name filter. This step used to read `veriloga_transient
        # veriloga_native_builder_`, which is one target and one filter, so it
        # ran two of the target's nineteen tests. No other job builds this
        # target with a veriloga feature at all -- the two unfiltered
        # `-p rspice-core` runs use default features, under which the file's
        # `#![cfg(feature = "veriloga")]` compiles it to zero tests -- so the
        # other seventeen ran nowhere. One of them, the Zi checkpoint/resume
        # pin, was red on main for three days without failing a build. The
        # whole target costs a fraction of a second once this step has built
        # it.
        run: cargo test --locked -p rspice-core --features veriloga-native --test veriloga_transient -- --test-threads=1
      - name: Test Verilog-A native JIT contracts (Linux x64)
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test native_contract -- --test-threads=1
      - name: Test Verilog-A native multiplicity contracts (Linux x64)
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test mfactor -- --test-threads=1
      - name: Test Verilog-A native contract (Linux x64 release)
        run: cargo test --locked -p rspice-veriloga --release --features native-bytecode-contract-tests --test native_contract -- --test-threads=1
      # The x64 and AArch64 backends encode, allocate, and verify independently,
      # so the census has to run on both or it qualifies only one of them.
      - name: Qualify full shipped device census through the x64 JIT (Linux x64)
        env:
          RUST_MIN_STACK: "67108864"
        run: >-
          cargo test --locked --release -p rspice-veriloga --features native
          --test native_shipped_models -- --ignored --nocapture --test-threads=1
      - name: Smoke Verilog-A native JIT benchmark gate (Linux x64)
        # The dense sweep intentionally calls 53 tiny entrypoints and is most
        # sensitive to hosted-runner microarchitecture. Twelve consecutive Windows
        # runs measured medians of 1.891-3.189x (median 2.036) while each run's own
        # samples held to 0.8-6.2% relative stddev: the spread is between runners,
        # not inside one, and a 2.00 floor failed 3 of the 12 on that alone
        # (measured 2026-08-22). Native device evaluation and full stamping retain
        # their stronger 3x and 2x production floors.
        run: >-
          cargo run --locked -p rspice-bench --release -- native-jit
          --iterations 100000
          --samples 9
          --min-dense-speedup 1.75
          --min-speedup 3.00
          --min-full-stamp-speedup 2.00
          --max-native-setup-ms 10
          --max-native-p95-ns-per-sweep 5000
          --max-relative-stddev 0.25
          --max-native-code-bytes 16384
      - name: Clear non-UI test artifacts
        run: cargo clean
      - name: Test UI library (Linux)
        run: cargo test --locked -p rspice-ui --lib

  test-windows:
    name: Build & unit test (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Check
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked --workspace --exclude rspice-python --exclude rspice-wasm
      - name: Qualify portable generated Verilog-A shard
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-core --no-default-features --features veriloga-model-diode-cmc,veriloga-builtins-noise
      - name: Unit tests
        run: cargo test --locked -p rspice-core --lib
      - name: CLI integration tests
        run: cargo test --locked -p rspice-cli --tests
      - name: UI library tests
        run: cargo test --locked -p rspice-ui --lib
      - name: Compile Verilog-A native JIT tests
        run: |
          cargo test --locked -p rspice-veriloga --features native native:: --no-run
          cargo test --locked -p rspice-veriloga --release --features native native:: --no-run
      - name: Verilog-A native JIT unit tests
        run: |
          cargo test --locked -p rspice-veriloga --features native native:: -- --test-threads=1
          cargo test --locked -p rspice-veriloga --release --features native native:: -- --test-threads=1
      - name: Verilog-A native JIT contract tests
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test native_contract -- --test-threads=1
      - name: Verilog-A native multiplicity tests
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test mfactor -- --test-threads=1
      - name: Smoke Verilog-A native JIT benchmark gate
        # The dense sweep intentionally calls 53 tiny entrypoints and is most
        # sensitive to hosted-runner microarchitecture. Twelve consecutive Windows
        # runs measured medians of 1.891-3.189x (median 2.036) while each run's own
        # samples held to 0.8-6.2% relative stddev: the spread is between runners,
        # not inside one, and a 2.00 floor failed 3 of the 12 on that alone
        # (measured 2026-08-22). Native device evaluation and full stamping retain
        # their stronger 3x and 2x production floors.
        run: >-
          cargo run --locked -p rspice-bench --release -- native-jit
          --iterations 100000
          --samples 9
          --min-dense-speedup 1.75
          --min-speedup 3.00
          --min-full-stamp-speedup 2.00
          --max-native-setup-ms 10
          --max-native-p95-ns-per-sweep 5000
          --max-relative-stddev 0.25
          --max-native-code-bytes 16384

  test-macos-x64-native:
    name: Test Verilog-A native JIT (macOS Intel x64)
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Intel x64 runner
        run: test "$(uname -m)" = "x86_64"
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Compile Verilog-A native JIT tests
        run: |
          cargo test --locked -p rspice-veriloga --features native native:: --no-run
          cargo test --locked -p rspice-veriloga --release --features native native:: --no-run
      - name: Test Verilog-A native JIT units
        run: |
          cargo test --locked -p rspice-veriloga --features native native:: -- --test-threads=1
          cargo test --locked -p rspice-veriloga --release --features native native:: -- --test-threads=1
      - name: Test Intel macOS hardened-runtime JIT entitlements
        shell: bash
        run: |
          set -euo pipefail
          source_binary=$(find target/debug/deps -maxdepth 1 -type f -perm -111 -name 'rspice_veriloga-*' -print -quit)
          test -n "$source_binary"
          signed_binary="$RUNNER_TEMP/rspice-veriloga-x64-hardened-jit"
          cp "$source_binary" "$signed_binary"
          codesign --force --sign - --options runtime \
            --entitlements crates/rspice-ui/macos/RSpice.entitlements \
            "$signed_binary"
          codesign --verify --strict --verbose=2 "$signed_binary"
          codesign --display --entitlements - "$signed_binary" > "$RUNNER_TEMP/x64-jit-entitlements.txt"
          grep -Fqx $'\t[Key] com.apple.security.cs.allow-jit' "$RUNNER_TEMP/x64-jit-entitlements.txt"
          grep -Fqx $'\t[Key] com.apple.security.cs.jit-write-allowlist' "$RUNNER_TEMP/x64-jit-entitlements.txt"
          test "$(grep -Fxc $'\t\t[Bool] true' "$RUNNER_TEMP/x64-jit-entitlements.txt")" -eq 2
          "$signed_binary" native::x64::tests::compile_model_with_canonical_ir_executes_mir_stamp_value --exact --test-threads=1
      - name: Test Verilog-A core transient suite through the native JIT
        # No name filter. This step used to read `veriloga_transient
        # veriloga_native_builder_`, which is one target and one filter, so it
        # ran two of the target's nineteen tests. No other job builds this
        # target with a veriloga feature at all -- the two unfiltered
        # `-p rspice-core` runs use default features, under which the file's
        # `#![cfg(feature = "veriloga")]` compiles it to zero tests -- so the
        # other seventeen ran nowhere. One of them, the Zi checkpoint/resume
        # pin, was red on main for three days without failing a build. The
        # whole target costs a fraction of a second once this step has built
        # it.
        run: cargo test --locked -p rspice-core --features veriloga-native --test veriloga_transient -- --test-threads=1
      - name: Test Verilog-A native JIT contracts
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test native_contract -- --test-threads=1
      - name: Gate Verilog-A native JIT performance
        # The dense sweep intentionally calls 53 tiny entrypoints and is most
        # sensitive to hosted-runner microarchitecture. Twelve consecutive Windows
        # runs measured medians of 1.891-3.189x (median 2.036) while each run's own
        # samples held to 0.8-6.2% relative stddev: the spread is between runners,
        # not inside one, and a 2.00 floor failed 3 of the 12 on that alone
        # (measured 2026-08-22). Native device evaluation and full stamping retain
        # their stronger 3x and 2x production floors.
        run: >-
          cargo run --locked -p rspice-bench --release -- native-jit
          --iterations 100000
          --samples 9
          --min-dense-speedup 1.75
          --min-speedup 3.00
          --min-full-stamp-speedup 2.00
          --max-native-setup-ms 10
          --max-native-p95-ns-per-sweep 5000
          --max-relative-stddev 0.25
          --max-native-code-bytes 16384

  test-aarch64-native:
    name: Test Verilog-A native JIT (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux ARM64
            os: ubuntu-24.04-arm
          - label: macOS ARM64
            os: macos-15
          - label: Windows ARM64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: veriloga-native-aarch64-${{ matrix.os }}
      - name: Verify native ARM64 toolchain
        run: rustc -vV
      - name: Test AArch64 encoder, runtime, unwind, and model JIT
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo test --locked -p rspice-veriloga --features native --lib native:: -- --test-threads=1
          cargo test --locked -p rspice-veriloga --release --features native --lib native:: -- --test-threads=1
      - name: Test macOS hardened-runtime JIT entitlements
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          source_binary=$(find target/debug/deps -maxdepth 1 -type f -perm -111 -name 'rspice_veriloga-*' -print -quit)
          test -n "$source_binary"
          signed_binary="$RUNNER_TEMP/rspice-veriloga-hardened-jit"
          cp "$source_binary" "$signed_binary"
          codesign --force --sign - --options runtime \
            --entitlements crates/rspice-ui/macos/RSpice.entitlements \
            "$signed_binary"
          codesign --verify --strict --verbose=2 "$signed_binary"
          codesign --display --entitlements - "$signed_binary" > "$RUNNER_TEMP/jit-entitlements.txt"
          grep -Fqx $'\t[Key] com.apple.security.cs.allow-jit' "$RUNNER_TEMP/jit-entitlements.txt"
          grep -Fqx $'\t[Key] com.apple.security.cs.jit-write-allowlist' "$RUNNER_TEMP/jit-entitlements.txt"
          test "$(grep -Fxc $'\t\t[Bool] true' "$RUNNER_TEMP/jit-entitlements.txt")" -eq 2
          "$signed_binary" native::runtime::aarch64_tests::registered_dwarf_cfi_unwinds_through_generated_helper_frame --exact --test-threads=1
      - name: Test public host-native qualification report
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --locked -p rspice-veriloga --features native --test runtime_compile_report -- --test-threads=1
      - name: Test core transient suite through the native JIT
        # No name filter. This step used to read `veriloga_transient
        # veriloga_native_builder_`, which is one target and one filter, so it
        # ran two of the target's nineteen tests. No other job builds this
        # target with a veriloga feature at all -- the two unfiltered
        # `-p rspice-core` runs use default features, under which the file's
        # `#![cfg(feature = "veriloga")]` compiles it to zero tests -- so the
        # other seventeen ran nowhere. One of them, the Zi checkpoint/resume
        # pin, was red on main for three days without failing a build. The
        # whole target costs a fraction of a second once this step has built
        # it.
        run: cargo test --locked -p rspice-core --features veriloga-native --test veriloga_transient -- --test-threads=1
      - name: Qualify full shipped device census through the AArch64 JIT
        env:
          RUSTFLAGS: -D warnings
          RUST_MIN_STACK: "67108864"
        run: >-
          cargo test --locked --release -p rspice-veriloga --features native
          --test native_shipped_models -- --ignored --nocapture --test-threads=1
      - name: Gate AArch64 native JIT performance
        # The dense sweep intentionally calls 53 tiny entrypoints and is most
        # sensitive to hosted-runner microarchitecture. Native device evaluation
        # and full stamping retain their stronger 3x and 2x production floors.
        run: >-
          cargo run --locked -p rspice-bench --release -- native-jit
          --iterations 100000
          --samples 9
          --min-dense-speedup 1.50
          --min-speedup 3.00
          --min-full-stamp-speedup 2.00
          --max-native-setup-ms 10
          --max-native-p95-ns-per-sweep 5000
          --max-relative-stddev 0.25
          --max-native-code-bytes 16384

  check-macos-desktop:
    name: Check & test desktop UI/CLI (macOS ARM64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Check desktop crates
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-cli -p rspice-ui
      - name: Qualify portable generated Verilog-A shard
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-core --no-default-features --features veriloga-model-diode-cmc,veriloga-builtins-noise
      - name: CLI integration tests
        run: cargo test --locked -p rspice-cli --tests
      - name: UI library tests
        run: cargo test --locked -p rspice-ui --lib

  wasm:
    name: Check (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Check rspice-wasm
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-wasm --target wasm32-unknown-unknown
      - name: Build rspice-wasm release library
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --locked -p rspice-wasm --lib --target wasm32-unknown-unknown --release
      - name: Check rspice-ui
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-ui --features generated-veriloga-catalog --target wasm32-unknown-unknown
      - name: Check rspice-ui browser worker
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-ui --bin rspice-ui-worker --features browser-worker --target wasm32-unknown-unknown
      - name: Check rspice-publication-contract
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-publication-contract --target wasm32-unknown-unknown
      - name: Check rspice-viewer
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-viewer --target wasm32-unknown-unknown
      - name: Qualify generated Verilog-A shard in WebAssembly
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo check --locked -p rspice-core
          --target wasm32-unknown-unknown
          --no-default-features
          --features veriloga-model-diode-cmc,veriloga-builtins-noise

  wasm-ui-size:
    name: Browser WASM image budgets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Build size-qualified browser UI image
        run: cargo build --locked --profile web-release -p rspice-ui --bin rspice-ui --target wasm32-unknown-unknown
      - name: Enforce browser UI image budget
        run: >-
          python3 tools/ci/check_wasm_artifact_size.py
          target/wasm32-unknown-unknown/web-release/rspice-ui.wasm
          --label rspice-ui
          --max-raw 67108864
          --max-gzip 16777216
      - name: Build size-qualified browser worker image
        run: >-
          cargo build --locked --profile web-release -p rspice-ui
          --bin rspice-ui-worker --features browser-worker
          --target wasm32-unknown-unknown
      - name: Enforce browser worker image budget
        run: >-
          python3 tools/ci/check_wasm_artifact_size.py
          target/wasm32-unknown-unknown/web-release/rspice-ui-worker.wasm
          --label rspice-ui-worker
          --max-raw 25165824
          --max-gzip 8388608
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Generate optimized browser worker bindings
        run: >-
          wasm-bindgen --target web
          --out-name rspice-ui-worker
          --out-dir crates/rspice-ui/web/pkg
          target/wasm32-unknown-unknown/web-release/rspice-ui-worker.wasm
      - name: Qualify browser WASM JIT solver bridge in Chromium
        run: python3 tools/ci/check_wasm_jit_browser.py
  veriloga-mobile:
    name: Check generated Verilog-A (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Android ARM64
            os: ubuntu-latest
            target: aarch64-linux-android
          - label: iOS ARM64
            os: macos-latest
            target: aarch64-apple-ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: veriloga-${{ matrix.target }}
      - name: Configure Android NDK C toolchain
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          set -euo pipefail
          ndk_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          compiler="$ndk_bin/aarch64-linux-android21-clang"
          archiver="$ndk_bin/llvm-ar"
          test -x "$compiler"
          test -x "$archiver"
          {
            echo "CC_aarch64_linux_android=$compiler"
            echo "AR_aarch64_linux_android=$archiver"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$compiler"
          } >> "$GITHUB_ENV"
      - name: Qualify complete portable generated Verilog-A catalog
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo check --locked -p rspice-core
          --target ${{ matrix.target }}
          --no-default-features
          --features veriloga-builtins

  python:
    name: Check (Python bindings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Check rspice-python
        run: cargo check --locked -p rspice-python

  # ---------------------------------------------------------------------
  # Surface-crate gates (AR-22). rspice-wasm and rspice-engine-adapter are
  # both excluded from, or unlinted by, the workspace lanes above:
  # `Clippy (warnings denied)` passes `--exclude rspice-wasm`, and no lane
  # ran `cargo test` for either crate on a pull request, so their request
  # translation and serialization code shipped on review alone. Both are
  # first-party surfaces under plan rule 5, which makes them exactly the code
  # that must not drift.
  # ---------------------------------------------------------------------
  surface-gates:
    name: Lint & test surface crates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Clippy rspice-wasm (warnings denied)
        run: >-
          cargo clippy --locked -p rspice-wasm --all-targets --all-features
          --message-format short -- -D warnings
      - name: Clippy rspice-engine-adapter (warnings denied)
        run: >-
          cargo clippy --locked -p rspice-engine-adapter --all-targets --all-features
          --message-format short -- -D warnings
      # The host build of rspice-wasm compiles the same serde translation the
      # browser build ships; only the wasm-bindgen exports are target-gated.
      # `cargo check --target wasm32-unknown-unknown` in the `wasm` job proves
      # it links there and stays where it is. This runs its 41 tests — 31 unit
      # plus the error_contract and periodic_cards targets — which no workflow
      # in the repository executed, on any schedule.
      - name: Test rspice-wasm
        run: cargo test --locked -p rspice-wasm --all-features
      - name: Test rspice-engine-adapter
        # 94 tests, including the adapter integration target. They ran in
        # nightly's workspace sweep and in engine-component-release, so a
        # broken executor contract could merge and stay merged until the next
        # night, or until a release found it.
        run: cargo test --locked -p rspice-engine-adapter

  # ---------------------------------------------------------------------
  # Feature shards the workspace lane cannot reach (AR-22).
  #
  # `Clippy (warnings denied)` above resolves one feature union for the whole
  # workspace, and it cannot be `--all-features`: `rspice-core/wasm` and
  # `veriloga-wasm-jit` describe a browser build, `veriloga-native` a host JIT,
  # and enabling both at once describes no shipped configuration. Feature
  # unification also means the lane always sees `parallel`, `simd` and
  # `faer-parallel` on (rspice-cli pulls them) and always sees `veriloga` on
  # (rspice-conformance pulls it), so every `cfg(not(...))` arm of those flags
  # is code CI has never linted.
  #
  # Each row below is a configuration something actually builds, named with
  # what makes it unreachable from the union. Add a row when a crate gains a
  # feature that a shipped build turns off.
  # ---------------------------------------------------------------------
  feature-matrix:
    name: Clippy feature shard (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          # No rayon, no portable-atomic, no SIMD kernels, no faer threads:
          # the embedded configuration, and the only one that compiles the
          # scalar arms of the solver.
          - label: core, no default features
            package: rspice-core
            features: --no-default-features
            target: ""
            targets: --all-targets
          # The browser shard. `wasm` and `veriloga-wasm-jit` are mutually
          # exclusive with the `veriloga-native` that rspice-cli turns on, so
          # the union can never contain them.
          - label: core, browser bindings
            package: rspice-core
            features: --no-default-features --features wasm,veriloga,veriloga-wasm-jit
            target: wasm32-unknown-unknown
            targets: ""
          # rspice-veriloga's tooling depends on this crate with
          # default-features = false to reuse the generated-model oracle
          # without the ngspice and Xyce runners. Nothing else builds it that
          # way, so nothing else lints it that way.
          - label: conformance, oracle harness only
            package: rspice-conformance
            features: --no-default-features
            target: ""
            # The integration targets name the ngspice, Xyce, gf180mcu and
            # execution suites by path, and those modules are exactly what
            # `--no-default-features` removes; the library is the whole of
            # what this configuration ships.
            targets: --lib
          # The single-threaded factorization path. rspice-core's default
          # `faer-parallel` turns this crate's threads on for every other lane.
          - label: matrix, single-threaded faer
            package: rspice-matrix
            features: --no-default-features
            target: ""
            targets: --all-targets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: >-
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component clippy
          ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: feature-shard-${{ matrix.package }}-${{ matrix.target }}
      # Each row says which cargo targets it can lint: `--all-targets` where
      # the test and bench binaries build in that configuration, nothing for
      # the wasm32 shard (its test targets are host binaries), and `--lib`
      # where the integration targets name modules the shard removes.
      - name: Clippy shard
        run: >-
          cargo clippy --locked -p ${{ matrix.package }} ${{ matrix.features }}
          ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          ${{ matrix.targets }}
          --message-format short -- -D warnings
