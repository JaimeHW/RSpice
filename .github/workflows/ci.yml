# Per-change checks. Coverage ownership and slower qualification: .github/CI.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.94.0"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  quality:
    name: Format, tooling & workspace Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          members=$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print("\n".join(sorted(p["name"] for p in json.load(sys.stdin)["packages"])))')
          checked=0
          for member in $members; do
            case "$member" in
              rspice-veriloga-models|rspice-veriloga-model-*) continue ;;
            esac
            cargo fmt -p "$member" -- --check
            checked=$((checked + 1))
          done
          echo "rustfmt checked $checked workspace member(s)"
          test "$checked" -ge 25
      - name: Lint GitHub workflows
        run: |
          export GOBIN="$RUNNER_TEMP/actionlint-bin"
          go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          "$GOBIN/actionlint" .github/workflows/*.yml
      - name: CI configuration tests
        run: python3 tools/ci/test_ci_configuration.py
      - name: UI incremental build identity regressions
        run: python3 tools/ci/test_ui_build_identity.py
      - name: Browser artifact reporting regression tests
        run: python3 tools/ci/test_wasm_artifact_size.py
      - name: Browser workbench harness regressions
        run: python3 tools/ci/test_browser_workbench.py
      - name: Vendored cloud client integrity
        run: python3 tools/ci/test_cloud_client_vendor.py
      - name: WASM playground worker tests
        run: python3 tools/ci/test_wasm_playground.py
      - name: WASM IDE worker tests
        run: python3 tools/ci/test_ide_worker.py
      - name: Browser module loading tests
        run: node --test tools/ci/test_wasm_loader.mjs tools/ci/test_wasm_playground.mjs
      - name: Native release packager tests
        run: python3 tools/release/test_package_native.py
      - name: Managed Python runtime staging tests
        run: python3 tools/release/test_stage_managed_python.py
      - name: Browser automation runtime asset integrity
        run: python3 tools/ci/test_automation_runtime_assets.py
      - name: Source-distribution lockfile repair tests
        run: python3 tools/release/test_repair_sdist_lock.py
      - name: No restricted model files are vendored
        run: python3 tools/models/license_audit.py --check
      - name: Model pack manifest and catalog are current
        run: python3 tools/models/build_manifest.py --check
      - name: Drawing-sheet qualification harness regressions
        run: python3 tools/ci/test_qualify_drawing_sheet.py
      - name: Clippy (warnings denied)
        run: cargo clippy --locked --workspace --exclude rspice-python --exclude rspice-wasm --all-targets --message-format short -- -D warnings

  test-linux:
    name: Test core & conformance (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Test core units, integration tests, and doctests
        run: cargo test --locked -p rspice-core --no-fail-fast
      - name: Conformance suite unit tests
        run: >-
          cargo test --locked -p rspice-conformance --lib
          --test ngspice_oracle_audit --test y_device_policy
          --test verilog_oracles --test verilog_scale --test verilog_ams
          --test verilog_ams_semantics
          --test verilog_rnm_agreement --test verilog_mixed_benchmarks
          --no-fail-fast
      - name: Oracle-free corpora (routine tier)
        run: >-
          cargo test --locked -p rspice-conformance --release
          --test execution_corpora -- --test-threads 1

  test-linux-veriloga:
    name: Test Verilog-A & mixed-signal suites (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # Every core integration target gated on `veriloga` compiles to an empty
      # binary under the default feature set, so the core lane above links and
      # runs nothing for any of them. They are named here, one cargo
      # invocation, on a runner of their own: the feature changes the core's
      # resolved graph, so sharing the core lane's runner would mean a second
      # full rspice-core build inside that job's budget rather than beside it.
      #
      # `tools/ci/test_ci_configuration.py` scans the test directory and fails
      # if a gated target is missing from this job or from the matching pair of
      # steps in `test-linux-native`. The only permitted omissions are the two
      # optional BSIM4 oracle targets, whose Verilog-A source is not vendored.
      - name: Test Verilog-A-gated core suites through the bytecode interpreter
        run: >-
          cargo test --locked -p rspice-core --features veriloga --no-fail-fast
          --test connect_module_insertion
          --test transient_checkpoint
          --test veriloga_ac
          --test veriloga_connect_source_closure
          --test veriloga_dc_lifecycle
          --test veriloga_hb
          --test veriloga_indirect
          --test veriloga_mfactor
          --test veriloga_mixed_signal_hardening
          --test veriloga_mixed_signal_regressions
          --test veriloga_mixed_signal_route
          --test veriloga_module_timing
          --test veriloga_noise
          --test veriloga_noise_process
          --test veriloga_project_runtime_batch
          --test veriloga_project_virtual_identity
          --test veriloga_timestep
          --test veriloga_transient
      # A second invocation rather than four more names above: these suites
      # need a generated model compiled in, and adding `veriloga-model-diode-cmc`
      # to the list above would reroute cards the eighteen suites there assert
      # about through the generated device instead of the native one.
      - name: Test the tri-family and generated-route suites through the bytecode interpreter
        run: >-
          cargo test --locked -p rspice-core
          --features veriloga,veriloga-model-diode-cmc --no-fail-fast
          --test tri_family_transient
          --test tri_family_events
          --test tri_family_small_signal
          --test generated_route_parity

  test-libraries:
    name: Test workspace libraries & tools (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Test remaining workspace crates
        run: >-
          cargo test --locked --workspace --no-fail-fast
          --exclude rspice-core --exclude rspice-ui --exclude rspice-conformance
          --exclude rspice-python --exclude rspice-wasm
          --exclude 'rspice-veriloga-model*' --exclude 'rspice-*-catalog-dump'

  test-ui:
    name: Test desktop UI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Test UI units, integration tests, and doctests (Linux)
        run: cargo test --locked -p rspice-ui --no-fail-fast
      - name: Test generated Verilog-A GUI contracts
        run: >-
          cargo test --locked -p rspice-ui
          --features generated-veriloga-catalog
          --lib generated_veriloga

  generated-veriloga:
    name: Generated models & numerical qualification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Check granular generated Verilog-A features
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check --locked -p rspice-core --no-default-features --features veriloga-model-diode-cmc,veriloga-builtins-noise
          cargo check --locked -p rspice-core --features veriloga-builtins-base --all-targets
          cargo test --locked -p rspice-core --features veriloga-model-diode-cmc --test generated_veriloga_feature_shards
          cargo test --locked -p rspice-core --features veriloga-model-diode-cmc,veriloga-builtins-noise --test generated_veriloga_feature_shards
          cargo check --locked -p rspice-core --features veriloga-model-hisimhv-va,veriloga-builtins-noise
      - name: Audit complete generated Verilog-A catalog
        run: cargo run --locked -p rspice-veriloga-catalog-dump -- --validate-only
      - name: Audit built-in XSPICE registry
        run: cargo run --locked -p rspice-xspice-catalog-dump -- --validate-only
      - name: Gate KLU correctness, fill, and relative kernel cost
        id: klu-qualification
        # Hosted CPUs differ from the desktop used for absolute qualification.
        # A cached refactor must beat full numeric factorization on this CPU;
        # a solve must remain cheaper still. Numerical and fill gates also apply.
        run: >-
          cargo run --locked --release -p rspice-bench -- klu
          --samples 7
          --refactors 300
          --expander-size 500
          --expander-refactors 10
          --max-refactor-factor-ratio 0.50
          --max-solve-factor-ratio 0.25
          --max-fill-ratio 1.60
          --out target/klu-ci-qualification.json
      - name: Upload KLU qualification
        if: ${{ !cancelled() && steps.klu-qualification.conclusion != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: klu-ci-qualification
          path: target/klu-ci-qualification.json
          if-no-files-found: error
      - name: Gate generated Verilog-A Rust resources
        run: >-
          cargo run --locked -p rspice-bench -- generated-rust
          --max-pooled-workspace-payload-bytes 0
          --top 10
      - name: Measure representative generated Verilog-A stamp performance
        run: >-
          cargo run --locked -p rspice-bench --release
          --features generated-stamp-subset -- generated-stamp
          --iterations 2000
          --samples 7

  test-linux-native:
    name: Test Verilog-A native JIT (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Test Verilog-A native JIT units (Linux x64)
        run: |
          cargo test --locked -p rspice-veriloga --features native --lib native:: -- --test-threads=1
          cargo test --locked -p rspice-veriloga --release --features native --lib native:: -- --test-threads=1
      # The same gated targets as `test-linux-veriloga`, compiled against the
      # x64 JIT instead of the bytecode interpreter: the two routes lower the
      # same modules through different back ends, so a suite that passes on one
      # proves nothing about the other. `--test-threads=1` is the rule the
      # native lane already follows -- the JIT maps executable pages per
      # process -- and it applies to every target in this invocation.
      - name: Test Verilog-A-gated core suites through the native JIT (Linux x64)
        run: >-
          cargo test --locked -p rspice-core --features veriloga-native --no-fail-fast
          --test connect_module_insertion
          --test transient_checkpoint
          --test veriloga_ac
          --test veriloga_connect_source_closure
          --test veriloga_dc_lifecycle
          --test veriloga_hb
          --test veriloga_indirect
          --test veriloga_mfactor
          --test veriloga_mixed_signal_hardening
          --test veriloga_mixed_signal_regressions
          --test veriloga_mixed_signal_route
          --test veriloga_module_timing
          --test veriloga_noise
          --test veriloga_noise_process
          --test veriloga_project_runtime_batch
          --test veriloga_project_virtual_identity
          --test veriloga_timestep
          --test veriloga_transient
          -- --test-threads=1
      # The generated-model half of the interpreter lane's pair, same reason.
      - name: Test the tri-family and generated-route suites through the native JIT (Linux x64)
        run: >-
          cargo test --locked -p rspice-core
          --features veriloga-native,veriloga-model-diode-cmc --no-fail-fast
          --test tri_family_transient
          --test tri_family_events
          --test tri_family_small_signal
          --test generated_route_parity
          -- --test-threads=1
      - name: Test Verilog-A native JIT contracts (Linux x64)
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test native_contract -- --test-threads=1
      - name: Test Verilog-A native route parity (Linux x64)
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test route_parity -- --test-threads=1
      - name: Test Verilog-A native multiplicity contracts (Linux x64)
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test mfactor -- --test-threads=1
      - name: Test Verilog-A native contract (Linux x64 release)
        run: cargo test --locked -p rspice-veriloga --release --features native-bytecode-contract-tests --test native_contract -- --test-threads=1
      - name: Qualify full shipped device census through the x64 JIT (Linux x64)
        env:
          RUST_MIN_STACK: "67108864"
        run: >-
          cargo test --locked --release -p rspice-veriloga --features native
          --test native_shipped_models -- --ignored --nocapture --test-threads=1
      - name: Smoke Verilog-A native JIT benchmark gate (Linux x64)
        run: >-
          cargo run --locked -p rspice-bench --release -- native-jit
          --iterations 100000
          --samples 9
          --min-dense-speedup 1.75
          --min-speedup 3.00
          --min-full-stamp-speedup 2.00

  test-windows:
    name: Build & unit test (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Check
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked --workspace --exclude rspice-python --exclude rspice-wasm
      - name: Qualify portable generated Verilog-A shard
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-core --no-default-features --features veriloga-model-diode-cmc,veriloga-builtins-noise
      - name: Unit tests
        run: cargo test --locked -p rspice-core --lib
      - name: Output and managed-runtime tests
        run: cargo test --locked -p rspice-output -p rspice-automation-runtime
      - name: CLI integration tests
        run: cargo test --locked -p rspice-cli --tests
      - name: UI library tests
        run: cargo test --locked -p rspice-ui --lib
      - name: Verilog-A native JIT unit tests
        run: |
          cargo test --locked -p rspice-veriloga --features native --lib native:: -- --test-threads=1
          cargo test --locked -p rspice-veriloga --release --features native --lib native:: -- --test-threads=1
      - name: Verilog-A native JIT contract tests
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test native_contract -- --test-threads=1
      - name: Verilog-A native route parity tests
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test route_parity -- --test-threads=1
      - name: Verilog-A native multiplicity tests
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test mfactor -- --test-threads=1
      - name: Smoke Verilog-A native JIT benchmark gate
        run: >-
          cargo run --locked -p rspice-bench --release -- native-jit
          --iterations 100000
          --samples 9
          --min-dense-speedup 1.75
          --min-speedup 3.00
          --min-full-stamp-speedup 2.00

  test-macos-x64-native:
    name: Test Verilog-A native JIT (macOS Intel x64)
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Intel x64 runner
        run: test "$(uname -m)" = "x86_64"
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Test Verilog-A native JIT units
        run: |
          cargo test --locked -p rspice-veriloga --features native --lib native:: -- --test-threads=1
          cargo test --locked -p rspice-veriloga --release --features native --lib native:: -- --test-threads=1
      - name: Test Intel macOS hardened-runtime JIT entitlements
        shell: bash
        run: |
          set -euo pipefail
          source_binary=$(find target/debug/deps -maxdepth 1 -type f -perm -111 -name 'rspice_veriloga-*' -print -quit)
          test -n "$source_binary"
          signed_binary="$RUNNER_TEMP/rspice-veriloga-x64-hardened-jit"
          cp "$source_binary" "$signed_binary"
          codesign --force --sign - --options runtime \
            --entitlements crates/rspice-ui/macos/RSpice.entitlements \
            "$signed_binary"
          codesign --verify --strict --verbose=2 "$signed_binary"
          codesign --display --entitlements - "$signed_binary" > "$RUNNER_TEMP/x64-jit-entitlements.txt"
          grep -Fqx $'\t[Key] com.apple.security.cs.allow-jit' "$RUNNER_TEMP/x64-jit-entitlements.txt"
          grep -Fqx $'\t[Key] com.apple.security.cs.jit-write-allowlist' "$RUNNER_TEMP/x64-jit-entitlements.txt"
          test "$(grep -Fxc $'\t\t[Bool] true' "$RUNNER_TEMP/x64-jit-entitlements.txt")" -eq 2
          "$signed_binary" native::x64::tests::compile_model_with_canonical_ir_executes_mir_stamp_value --exact --test-threads=1
      - name: Test Verilog-A core transient suite through the native JIT
        run: cargo test --locked -p rspice-core --features veriloga-native --test veriloga_transient -- --test-threads=1
      - name: Test Verilog-A native JIT contracts
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test native_contract -- --test-threads=1
      - name: Gate Verilog-A native JIT performance
        run: >-
          cargo run --locked -p rspice-bench --release -- native-jit
          --iterations 100000
          --samples 9
          --min-dense-speedup 1.75
          --min-speedup 3.00
          --min-full-stamp-speedup 2.00

  test-aarch64-native:
    name: Test Verilog-A native JIT (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux ARM64
            os: ubuntu-24.04-arm
          - label: macOS ARM64
            os: macos-15
          - label: Windows ARM64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: veriloga-native-aarch64-${{ matrix.os }}
      - name: Verify native ARM64 toolchain
        shell: bash
        run: |
          rustc -vV | grep -E '^host: aarch64-'
      - name: Test AArch64 encoder, runtime, unwind, and model JIT
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo test --locked -p rspice-veriloga --features native --lib native:: -- --test-threads=1
          cargo test --locked -p rspice-veriloga --release --features native --lib native:: -- --test-threads=1
      - name: Test macOS hardened-runtime JIT entitlements
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          source_binary=$(find target/debug/deps -maxdepth 1 -type f -perm -111 -name 'rspice_veriloga-*' -print -quit)
          test -n "$source_binary"
          signed_binary="$RUNNER_TEMP/rspice-veriloga-hardened-jit"
          cp "$source_binary" "$signed_binary"
          codesign --force --sign - --options runtime \
            --entitlements crates/rspice-ui/macos/RSpice.entitlements \
            "$signed_binary"
          codesign --verify --strict --verbose=2 "$signed_binary"
          codesign --display --entitlements - "$signed_binary" > "$RUNNER_TEMP/jit-entitlements.txt"
          grep -Fqx $'\t[Key] com.apple.security.cs.allow-jit' "$RUNNER_TEMP/jit-entitlements.txt"
          grep -Fqx $'\t[Key] com.apple.security.cs.jit-write-allowlist' "$RUNNER_TEMP/jit-entitlements.txt"
          test "$(grep -Fxc $'\t\t[Bool] true' "$RUNNER_TEMP/jit-entitlements.txt")" -eq 2
          "$signed_binary" native::runtime::aarch64_tests::registered_dwarf_cfi_unwinds_through_generated_helper_frame --exact --test-threads=1
      - name: Test public host-native qualification report
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --locked -p rspice-veriloga --features native --test runtime_compile_report -- --test-threads=1
      - name: Test core transient suite through the native JIT
        run: cargo test --locked -p rspice-core --features veriloga-native --test veriloga_transient -- --test-threads=1
      - name: Qualify full shipped device census through the AArch64 JIT
        env:
          RUSTFLAGS: -D warnings
          RUST_MIN_STACK: "67108864"
        run: >-
          cargo test --locked --release -p rspice-veriloga --features native
          --test native_shipped_models -- --ignored --nocapture --test-threads=1
      - name: Gate AArch64 native JIT performance
        run: >-
          cargo run --locked -p rspice-bench --release -- native-jit
          --iterations 100000
          --samples 9
          --min-dense-speedup 1.50
          --min-speedup 3.00
          --min-full-stamp-speedup 2.00

  check-macos-desktop:
    name: Check & test desktop UI/CLI (macOS ARM64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Check desktop crates
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-cli -p rspice-ui
      - name: Qualify portable generated Verilog-A shard
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-core --no-default-features --features veriloga-model-diode-cmc,veriloga-builtins-noise
      - name: Output-layer tests
        run: cargo test --locked -p rspice-output
      - name: CLI integration tests
        run: cargo test --locked -p rspice-cli --tests
      - name: UI library tests
        run: cargo test --locked -p rspice-ui --lib

  wasm:
    name: Check (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Check rspice-wasm
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-wasm --target wasm32-unknown-unknown
      - name: Build rspice-wasm release library
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --locked -p rspice-wasm --lib --target wasm32-unknown-unknown --release
      - name: Check rspice-ui
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-ui --features generated-veriloga-catalog --target wasm32-unknown-unknown
      - name: Check rspice-ui browser worker
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-ui --bin rspice-ui-worker --features browser-worker --target wasm32-unknown-unknown
      - name: Check rspice-publication-contract
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-publication-contract --target wasm32-unknown-unknown
      - name: Check rspice-viewer
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-viewer --target wasm32-unknown-unknown
      - name: Qualify generated Verilog-A shard in WebAssembly
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo check --locked -p rspice-core
          --target wasm32-unknown-unknown
          --no-default-features
          --features veriloga-model-diode-cmc,veriloga-builtins-noise

  wasm-tests:
    name: Rust tests in Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      GECKODRIVER: geckodriver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Test browser binding and cloud transport
        env:
          WASM_BINDGEN_USE_BROWSER: '1'
        run: cargo test --locked -p rspice-wasm -p rspice-cloud-client --lib --target wasm32-unknown-unknown
      - name: Test UI clocks in a browser window
        env:
          WASM_BINDGEN_USE_BROWSER: '1'
        run: cargo test --locked -p rspice-ui --target wasm32-unknown-unknown --test browser_clock
      - name: Test UI clocks in a dedicated worker
        env:
          WASM_BINDGEN_USE_DEDICATED_WORKER: '1'
        run: cargo test --locked -p rspice-ui --target wasm32-unknown-unknown --test browser_clock
      - name: Test UI worker structured-clone transport in Node
        run: |
          node --version
          cargo test --locked -p rspice-ui --target wasm32-unknown-unknown --features browser-worker --test browser_worker_transport

  wasm-ui-size:
    name: Browser build & qualification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Build production browser UI image
        run: cargo build --locked --profile web-release -p rspice-ui --bin rspice-ui --features generated-veriloga-catalog --target wasm32-unknown-unknown
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Generate production browser UI bindings
        run: >-
          wasm-bindgen --target web --out-name rspice-ui
          --out-dir crates/rspice-ui/web/pkg
          target/wasm32-unknown-unknown/web-release/rspice-ui.wasm
      - name: Report browser UI image size
        run: >-
          python3 tools/ci/check_wasm_artifact_size.py
          crates/rspice-ui/web/pkg/rspice-ui_bg.wasm
          --label rspice-ui
      - name: Build production browser worker image
        run: >-
          cargo build --locked --profile web-release -p rspice-ui
          --bin rspice-ui-worker --features browser-worker,generated-veriloga-catalog
          --target wasm32-unknown-unknown
      - name: Generate production browser worker bindings
        run: >-
          wasm-bindgen --target web
          --out-name rspice-ui-worker
          --out-dir crates/rspice-ui/web/pkg
          target/wasm32-unknown-unknown/web-release/rspice-ui-worker.wasm
      - name: Report browser worker image size
        run: >-
          python3 tools/ci/check_wasm_artifact_size.py
          crates/rspice-ui/web/pkg/rspice-ui-worker_bg.wasm
          --label rspice-ui-worker
      - name: Qualify browser WASM JIT solver bridge in Chromium
        run: python3 tools/ci/check_wasm_jit_browser.py
      - name: Build instrumented browser workbench
        run: >-
          cargo build --locked --profile web-release -p rspice-ui
          --bin rspice-ui --features browser-qualification,generated-veriloga-catalog
          --target wasm32-unknown-unknown
      - name: Generate browser workbench bindings
        run: >-
          wasm-bindgen --target web --out-name rspice-ui
          --out-dir crates/rspice-ui/web/pkg
          target/wasm32-unknown-unknown/web-release/rspice-ui.wasm
      - name: Qualify browser review and recovery workflow
        run: >-
          python3 tools/ci/check_browser_workbench.py --software-webgpu
          --output "${{ runner.temp }}/rspice-workbench-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Qualify browser engine failure and retry
        run: >-
          python3 tools/ci/check_browser_engine_recovery.py --software-webgpu
          --web-root crates/rspice-ui/web
          --output "${{ runner.temp }}/rspice-engine-recovery-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Qualify browser cancellation during engine startup
        run: >-
          python3 tools/ci/check_browser_engine_recovery.py --software-webgpu --cancel-startup
          --web-root crates/rspice-ui/web
          --output "${{ runner.temp }}/rspice-engine-cancel-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain browser workbench evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-workbench
          path: |
            ${{ runner.temp }}/rspice-workbench-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/rspice-engine-recovery-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/rspice-engine-cancel-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
  veriloga-mobile:
    name: Check generated Verilog-A (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Android ARM64
            os: ubuntu-latest
            target: aarch64-linux-android
          - label: iOS ARM64
            os: macos-latest
            target: aarch64-apple-ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: veriloga-${{ matrix.target }}
      - name: Configure Android NDK C toolchain
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          set -euo pipefail
          ndk_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          compiler="$ndk_bin/aarch64-linux-android21-clang"
          archiver="$ndk_bin/llvm-ar"
          test -x "$compiler"
          test -x "$archiver"
          {
            echo "CC_aarch64_linux_android=$compiler"
            echo "AR_aarch64_linux_android=$archiver"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$compiler"
          } >> "$GITHUB_ENV"
      - name: Qualify complete portable generated Verilog-A catalog
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo check --locked -p rspice-core
          --target ${{ matrix.target }}
          --no-default-features
          --features veriloga-builtins

  surface-gates:
    name: Lint & test surface crates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Clippy rspice-wasm (warnings denied)
        run: >-
          cargo clippy --locked -p rspice-wasm --all-targets --all-features
          --message-format short -- -D warnings
      - name: Clippy rspice-engine-adapter (warnings denied)
        run: >-
          cargo clippy --locked -p rspice-engine-adapter --all-targets --all-features
          --message-format short -- -D warnings
      - name: Test rspice-wasm
        run: cargo test --locked -p rspice-wasm --all-features

  feature-matrix:
    name: Clippy feature shard (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: core, no default features
            package: rspice-core
            features: --no-default-features
            target: ""
            targets: --all-targets
          - label: core, browser bindings
            package: rspice-core
            features: --no-default-features --features wasm,veriloga,veriloga-wasm-jit
            target: wasm32-unknown-unknown
            targets: ""
          - label: conformance, oracle harness only
            package: rspice-conformance
            features: --no-default-features
            target: ""
            targets: --lib
          - label: matrix, single-threaded faer
            package: rspice-matrix
            features: --no-default-features
            target: ""
            targets: --all-targets
          - label: Verilog-A, WebAssembly JIT on host
            package: rspice-veriloga
            features: --no-default-features --features wasm-jit
            target: ""
            targets: --all-targets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: >-
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component clippy
          ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: feature-shard-${{ matrix.package }}-${{ matrix.target }}
      - name: Clippy shard
        run: >-
          cargo clippy --locked -p ${{ matrix.package }} ${{ matrix.features }}
          ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          ${{ matrix.targets }}
          --message-format short -- -D warnings
      - name: Test host feature shard
        if: matrix.target == ''
        run: >-
          cargo test --locked -p ${{ matrix.package }} ${{ matrix.features }}
          ${{ matrix.package == 'rspice-conformance' && '--lib' || '' }}
