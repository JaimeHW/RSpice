# Per-commit gate: build the workspace warning-clean and run the fast test
# tier on Linux/Windows, plus a macOS desktop compile check. The ngspice conformance suites are excluded
# here for runtime; they gate in nightly.yml against the conformance
# watermark. The live-oracle audit is `#[ignore]` and never runs in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.94.0"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  test-linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint GitHub workflows
        run: |
          export GOBIN="$RUNNER_TEMP/actionlint-bin"
          go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          "$GOBIN/actionlint" .github/workflows/*.yml
      - name: CI configuration tests
        run: python3 tools/ci/test_ci_configuration.py
      - name: WASM playground worker tests
        run: python3 tools/ci/test_wasm_playground.py
      - name: WASM IDE worker tests
        run: python3 tools/ci/test_ide_worker.py
      - name: Native release packager tests
        run: python3 tools/release/test_package_native.py
      - name: Source-distribution lockfile repair tests
        run: python3 tools/release/test_repair_sdist_lock.py
      - name: No restricted model files are vendored
        run: python3 tools/models/license_audit.py --check
      - name: Model pack manifest and catalog are current
        run: python3 tools/models/build_manifest.py --check
      - name: Built-in library matches its selection
        run: python3 tools/models/build_builtin.py --check
      - name: Check (warnings denied)
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked --workspace --exclude rspice-python --exclude rspice-wasm
      - name: Check granular generated Verilog-A features
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check --locked -p rspice-core --features veriloga-builtins-base
          cargo test --locked -p rspice-core --features veriloga-model-diode-cmc --test generated_veriloga_feature_shards
          cargo test --locked -p rspice-core --features veriloga-model-diode-cmc,veriloga-builtins-noise --test generated_veriloga_feature_shards
          cargo check --locked -p rspice-core --features veriloga-model-hisimhv-va,veriloga-builtins-noise
      - name: Clippy (warnings denied)
        run: cargo clippy --locked --workspace --exclude rspice-python --exclude rspice-wasm --all-targets --message-format short -- -D warnings
      - name: Clear check artifacts before tests
        run: cargo clean
      - name: Core architecture ratchets
        # Layer order, source reachability, and public-surface size. These
        # also run inside the fast tier below, but they take under a second
        # and an architectural regression should be legible on its own line
        # rather than buried in a multi-minute suite.
        run: >-
          cargo test --locked -p rspice-core
          --test module_layering
          --test module_reachability
          --test public_surface
      - name: Test core integration tests (fast tier)
        # No feature flag and no name filter. Both conformance suites live in
        # rspice-conformance now, so this target contains none of them. It
        # previously read `-- --skip test_ngspice_ --skip test_full_ngspice`,
        # which silently depended on 53 tests never being renamed — a rename
        # would have either turned a multi-minute suite loose in the fast tier
        # or disabled one meant to run. The crate boundary replaced it.
        run: cargo test --locked -p rspice-core --tests
      - name: Core library unit tests
        run: cargo test --locked -p rspice-core --lib
      - name: Conformance suite unit tests
        # The ngspice runner's own unit tests — tolerance model, directive
        # classification, reference-table decoding — used to run as part of
        # `-p rspice-core --lib`, and the oracle-audit helper tests as part of
        # `-p rspice-core --tests`. Both moved with the suite, so run them
        # here; without this the move would silently drop 37 tests.
        #
        # Targets are named explicitly rather than using `--tests`: that would
        # also pull in `ngspice_regression` and `xyce_regression`, the vendored
        # deck corpora, which belong to nightly.
        run: >-
          cargo test --locked -p rspice-conformance --lib
          --test ngspice_oracle_audit --test y_device_policy
      - name: Verilog-A suite unit tests
        # The Verilog-A suite sits behind `veriloga-builtins-base`, so the
        # featureless run above compiles the whole module — oracle included —
        # out, and none of its tests would execute in CI. The feature enables
        # no models on its own, so this costs a compile of the suite and
        # nothing of the corpus. It moved from rspice-core's lib target to
        # rspice-conformance with the rest of the validation code.
        run: >-
          cargo test --locked -p rspice-conformance --lib
          --features veriloga-builtins-base
      - name: Clear core test artifacts
        run: cargo clean
      - name: Test non-UI crates (fast tier)
        run: cargo test --locked -p rspice-cli -p rspice-veriloga -p rspice-bench
      - name: Gate generated Verilog-A Rust resources
        run: >-
          cargo run --locked -p rspice-bench -- generated-rust
          --max-source-bytes 113000000
          --max-noise-source-bytes 59000000
          --max-model-source-bytes 8800000
          --max-file-count 650
          --max-pooled-workspace-payload-bytes 650000
          --max-stamp-state-payload-bytes 6200
          --top 10
      - name: Test Verilog-A native JIT units (Linux x64)
        run: >-
          cargo test --locked -p rspice-veriloga --features native native::
          -- --test-threads=1
      - name: Test Verilog-A native core builder route (Linux x64)
        run: cargo test --locked -p rspice-core --features veriloga-native --test veriloga_transient veriloga_native_builder_uses_canonical_ir_without_bytecode_fallback -- --test-threads=1
      - name: Test Verilog-A native JIT contracts (Linux x64)
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test native_contract -- --test-threads=1
      - name: Test Verilog-A native multiplicity contracts (Linux x64)
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test mfactor -- --test-threads=1
      - name: Test Verilog-A native contract (Linux x64 release)
        run: cargo test --locked -p rspice-veriloga --release --features native-bytecode-contract-tests --test native_contract -- --test-threads=1
      - name: Smoke Verilog-A native JIT benchmark gate (Linux x64)
        run: cargo run --locked -p rspice-bench --release -- native-jit --iterations 10000 --samples 7 --min-speedup 1.10
      - name: Clear non-UI test artifacts
        run: cargo clean
      - name: Test UI library (Linux)
        run: cargo test --locked -p rspice-ui --lib

  test-windows:
    name: Build & unit test (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked --workspace --exclude rspice-python --exclude rspice-wasm
      - name: Unit tests
        run: cargo test --locked -p rspice-core --lib
      - name: CLI integration tests
        run: cargo test --locked -p rspice-cli --tests
      - name: UI library tests
        run: cargo test --locked -p rspice-ui --lib
      - name: Verilog-A native JIT unit tests
        run: >-
          cargo test --locked -p rspice-veriloga --features native native::
          -- --test-threads=1
      - name: Verilog-A native JIT contract tests
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test native_contract -- --test-threads=1
      - name: Verilog-A native multiplicity tests
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test mfactor -- --test-threads=1
      - name: Smoke Verilog-A native JIT benchmark gate
        run: cargo run --locked -p rspice-bench --release -- native-jit --iterations 10000 --samples 7 --min-speedup 1.10

  check-macos-desktop:
    name: Check & test desktop UI/CLI (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check desktop crates
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-cli -p rspice-ui
      - name: CLI integration tests
        run: cargo test --locked -p rspice-cli --tests
      - name: UI library tests
        run: cargo test --locked -p rspice-ui --lib

  wasm:
    name: Check (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check rspice-wasm
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-wasm --target wasm32-unknown-unknown
      - name: Build rspice-wasm release library
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --locked -p rspice-wasm --lib --target wasm32-unknown-unknown --release
      - name: Check rspice-ui
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-ui --target wasm32-unknown-unknown

  python:
    name: Check (Python bindings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check rspice-python
        run: cargo check --locked -p rspice-python
