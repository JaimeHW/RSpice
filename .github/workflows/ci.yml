# Isolated qualification only; never merge this workflow onto main.
name: Core repair qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Install pinned compiler
        run: rustup toolchain install 1.94.0 --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      - name: Record identity
        run: |
          mkdir -p core-evidence
          git rev-parse HEAD > core-evidence/source.txt
          git diff HEAD^ HEAD > core-evidence/candidate.patch
          rustc +1.94.0 -vV > core-evidence/compiler.txt
          uname -a > core-evidence/platform.txt
          sha256sum tests/xyce/Netlists/LEAD_CURRENTS/lead_min2_trap.cir > core-evidence/deck.sha256
      - name: Transient state and residual units
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          timeout 19m cargo +1.94.0 test --locked -p rspice-core --lib engine::transient:: -- --test-threads=2 2>&1 | tee core-evidence/transient-units.log
      - name: Independent magnetic and inductor physics
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          timeout 19m cargo +1.94.0 test --locked -p rspice-core --test xyce_core_transient --test inductor_transient -- --test-threads=2 --nocapture 2>&1 | tee core-evidence/physics.log
      - name: Complete conformance library including authored lead-current oracles
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          timeout 19m cargo +1.94.0 test --locked -p rspice-conformance --lib -- --test-threads=2 2>&1 | tee core-evidence/conformance.log
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-repair-qualification
          path: core-evidence
          if-no-files-found: error
