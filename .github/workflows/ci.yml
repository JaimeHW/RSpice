# Per-commit gate: build the workspace warning-clean and run the fast test
# tier on Linux and Windows. The ngspice conformance suites are excluded
# here for runtime; they gate in nightly.yml against the conformance
# watermark. The live-oracle audit is `#[ignore]` and never runs in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  test-linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Check (warnings denied)
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --exclude rspice-python --exclude rspice-wasm
      - name: Clear check artifacts before tests
        run: cargo clean
      - name: Test (fast tier)
        # Skip only the vendored conformance suites (their test names start
        # with test_ngspice_ / test_full_ngspice). A bare "ngspice" filter
        # used to swallow seven oracle-pinned tests in unrelated files whose
        # names merely mention ngspice.
        run: >-
          cargo test --workspace --exclude rspice-python --exclude rspice-wasm
          -- --skip test_ngspice_ --skip test_full_ngspice

  test-windows:
    name: Build & unit test (Windows)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Check
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --exclude rspice-python --exclude rspice-wasm
      - name: Unit tests
        run: cargo test -p rspice-core --lib

  wasm:
    name: Check (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check rspice-wasm
        env:
          RUSTFLAGS: -D warnings
        run: cargo check -p rspice-wasm --target wasm32-unknown-unknown
      - name: Check rspice-ui wasm
        env:
          RUSTFLAGS: -D warnings
        run: cargo check -p rspice-ui --target wasm32-unknown-unknown

  python:
    name: Check (Python bindings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Check rspice-python
        run: cargo check -p rspice-python
