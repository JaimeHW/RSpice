name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  release-quality:
    name: Release Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run release tests
        run: cargo test --release --workspace

      - name: Run strict clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings

      - name: Check benchmark builds
        run: cargo bench --workspace --no-run

      - name: Check wasm wrapper build
        run: cargo build -p rspice-wasm --target wasm32-unknown-unknown --release
