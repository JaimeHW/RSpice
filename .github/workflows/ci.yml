# Isolated diagnostic only; do not merge this workflow onto main.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lead-convergence:
    name: Diagnose authored LEAD_CURRENTS on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 6
      - name: Install pinned compiler
        run: rustup toolchain install 1.94.0 --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      - name: Record source and platform
        shell: bash
        run: |
          mkdir -p lead-evidence
          git rev-parse HEAD > lead-evidence/source.txt
          git diff eaefb256c5f029a9d6846cca6fa944f6b2ee5435 HEAD > lead-evidence/diagnostic.patch
          rustc +1.94.0 --version --verbose > lead-evidence/compiler.txt
          uname -a > lead-evidence/platform.txt
          sha256sum tests/xyce/Netlists/LEAD_CURRENTS/lead_min2_trap.cir > lead-evidence/deck.sha256
      - name: Build existing case runner
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          cargo +1.94.0 build --locked -p rspice-conformance --bin rspice-xyce-case-runner 2>&1 | tee lead-evidence/build.log
      - name: Execute authored circuit and retain exact verdict
        timeout-minutes: 2
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,json,subprocess,time
          from pathlib import Path
          root=Path('lead-evidence')
          command=['target/debug/rspice-xyce-case-runner','--test-dir','tests/xyce',
                   '--circuit','tests/xyce/Netlists/LEAD_CURRENTS/lead_min2_trap.cir',
                   '--result',str(root/'result.txt'),'--verbose','true']
          started=time.monotonic()
          record=dict(command=command,started_utc=datetime.datetime.now(datetime.timezone.utc).isoformat())
          with (root/'trace.log').open('wb') as log:
              try:
                  result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=90)
                  record['process_exit_code']=result.returncode
              except subprocess.TimeoutExpired:
                  record['process_exit_code']=124
          record['elapsed_seconds']=time.monotonic()-started
          path=root/'result.txt'
          verdict=path.read_text() if path.exists() else ''
          record['authored_oracle_passed']='passed=true' in verdict.splitlines()
          (root/'run.json').write_text(json.dumps(record,indent=2))
          print(json.dumps(record))
          print(verdict)
          raise SystemExit(0 if record['process_exit_code']==0 and record['authored_oracle_passed'] else 1)
          PY
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-lead-convergence
          path: lead-evidence
          if-no-files-found: error
