# Per-commit gate: build the workspace warning-clean and run the fast test
# tier on Linux/Windows, plus a macOS desktop compile check. The ngspice conformance suites are excluded
# here for runtime; they gate in nightly.yml against the conformance
# watermark. The live-oracle audit is `#[ignore]` and never runs in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  test-linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: CI configuration tests
        run: python3 tools/ci/test_ci_configuration.py
      - name: WASM playground worker tests
        run: python3 tools/ci/test_wasm_playground.py
      - name: WASM IDE worker tests
        run: python3 tools/ci/test_ide_worker.py
      - name: Site deploy gate tests
        run: python3 tools/deploy/test_build_site.py
      - name: Site deploy script tests
        run: python3 tools/deploy/test_deploy.py
      - name: Check (warnings denied)
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --exclude rspice-python --exclude rspice-wasm
      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --exclude rspice-python --exclude rspice-wasm --all-targets --message-format short -- -D warnings
      - name: Clear check artifacts before tests
        run: cargo clean
      - name: Test core integration tests (fast tier)
        # Skip only the vendored conformance suites (their test names start
        # with test_ngspice_ / test_full_ngspice). A bare "ngspice" filter
        # used to swallow seven oracle-pinned tests in unrelated files whose
        # names merely mention ngspice.
        run: >-
          cargo test -p rspice-core --tests
          -- --skip test_ngspice_ --skip test_full_ngspice
      - name: Core library unit tests
        run: cargo test -p rspice-core --lib
      - name: Clear core test artifacts
        run: cargo clean
      - name: Test non-UI crates (fast tier)
        run: cargo test -p rspice-cli -p rspice-veriloga -p rspice-bench
      - name: Clear non-UI test artifacts
        run: cargo clean
      - name: Test UI library (Linux)
        run: cargo test -p rspice-ui --lib

  test-windows:
    name: Build & unit test (Windows)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Check
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --exclude rspice-python --exclude rspice-wasm
      - name: Unit tests
        run: cargo test -p rspice-core --lib

  check-macos-desktop:
    name: Check desktop UI/CLI (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Check desktop crates
        env:
          RUSTFLAGS: -D warnings
        run: cargo check -p rspice-cli -p rspice-ui

  wasm:
    name: Check (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check rspice-wasm
        env:
          RUSTFLAGS: -D warnings
        run: cargo check -p rspice-wasm --target wasm32-unknown-unknown
      - name: Build rspice-wasm release library
        env:
          RUSTFLAGS: -D warnings
        run: cargo build -p rspice-wasm --lib --target wasm32-unknown-unknown --release
      - name: Check rspice-ui
        env:
          RUSTFLAGS: -D warnings
        run: cargo check -p rspice-ui --target wasm32-unknown-unknown

  python:
    name: Check (Python bindings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Check rspice-python
        run: cargo check -p rspice-python
