# Per-commit gate: build the workspace warning-clean and run the fast test
# tier on Linux/Windows, plus a macOS desktop compile check. The ngspice conformance suites are excluded
# here for runtime; they gate in nightly.yml against the conformance
# watermark. The live-oracle audit is `#[ignore]` and never runs in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.94.0"

jobs:
  test-linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: CI configuration tests
        run: python3 tools/ci/test_ci_configuration.py
      - name: WASM playground worker tests
        run: python3 tools/ci/test_wasm_playground.py
      - name: WASM IDE worker tests
        run: python3 tools/ci/test_ide_worker.py
      - name: Site deploy gate tests
        run: python3 tools/deploy/test_build_site.py
      - name: Site deploy script tests
        run: python3 tools/deploy/test_deploy.py
      - name: Check (warnings denied)
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked --workspace --exclude rspice-python --exclude rspice-wasm
      - name: Clippy (warnings denied)
        run: cargo clippy --locked --workspace --exclude rspice-python --exclude rspice-wasm --all-targets --message-format short -- -D warnings
      - name: Clear check artifacts before tests
        run: cargo clean
      - name: Test core integration tests (fast tier)
        # Skip only the vendored conformance suites (their test names start
        # with test_ngspice_ / test_full_ngspice). A bare "ngspice" filter
        # used to swallow seven oracle-pinned tests in unrelated files whose
        # names merely mention ngspice.
        run: >-
          cargo test --locked -p rspice-core --tests
          -- --skip test_ngspice_ --skip test_full_ngspice
      - name: Core library unit tests
        run: cargo test --locked -p rspice-core --lib
      - name: Clear core test artifacts
        run: cargo clean
      - name: Test non-UI crates (fast tier)
        run: cargo test --locked -p rspice-cli -p rspice-veriloga -p rspice-bench
      - name: Test Verilog-A native JIT units (Linux x64)
        run: >-
          cargo test --locked -p rspice-veriloga --features native native::
          -- --test-threads=1
      - name: Test Verilog-A native core builder route (Linux x64)
        run: cargo test --locked -p rspice-core --features veriloga-native --test veriloga_transient veriloga_native_builder_uses_canonical_ir_without_bytecode_fallback -- --test-threads=1
      - name: Test Verilog-A native JIT contracts (Linux x64)
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test native_contract -- --test-threads=1
      - name: Test Verilog-A native multiplicity contracts (Linux x64)
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test mfactor -- --test-threads=1
      - name: Test Verilog-A native contract (Linux x64 release)
        run: cargo test --locked -p rspice-veriloga --release --features native-bytecode-contract-tests --test native_contract -- --test-threads=1
      - name: Smoke Verilog-A native JIT benchmark gate (Linux x64)
        run: cargo run --locked -p rspice-bench --release -- native-jit --iterations 1000 --samples 2 --min-speedup 1.10
      - name: Clear non-UI test artifacts
        run: cargo clean
      - name: Test UI library (Linux)
        run: cargo test --locked -p rspice-ui --lib

  test-windows:
    name: Build & unit test (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Check
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked --workspace --exclude rspice-python --exclude rspice-wasm
      - name: Unit tests
        run: cargo test --locked -p rspice-core --lib
      - name: CLI integration tests
        run: cargo test --locked -p rspice-cli --tests
      - name: UI library tests
        run: cargo test --locked -p rspice-ui --lib
      - name: Verilog-A native JIT unit tests
        run: >-
          cargo test --locked -p rspice-veriloga --features native native::
          -- --test-threads=1
      - name: Verilog-A native JIT contract tests
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test native_contract -- --test-threads=1
      - name: Verilog-A native multiplicity tests
        run: cargo test --locked -p rspice-veriloga --features native-bytecode-contract-tests --test mfactor -- --test-threads=1
      - name: Smoke Verilog-A native JIT benchmark gate
        run: cargo run --locked -p rspice-bench --release -- native-jit --iterations 1000 --samples 2 --min-speedup 1.10

  check-macos-desktop:
    name: Check & test desktop UI/CLI (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Check desktop crates
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-cli -p rspice-ui
      - name: CLI integration tests
        run: cargo test --locked -p rspice-cli --tests
      - name: UI library tests
        run: cargo test --locked -p rspice-ui --lib

  wasm:
    name: Check (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Check rspice-wasm
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-wasm --target wasm32-unknown-unknown
      - name: Build rspice-wasm release library
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --locked -p rspice-wasm --lib --target wasm32-unknown-unknown --release
      - name: Check rspice-ui
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p rspice-ui --target wasm32-unknown-unknown

  site-smoke:
    name: Browser site smoke (wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install wasm-bindgen-cli (pinned to Cargo.lock)
        run: |
          VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)
          echo "Cargo.lock pins wasm-bindgen $VERSION"
          DIST="wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl"
          if curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${VERSION}/${DIST}.tar.gz" | tar -xz; then
            mv "${DIST}/wasm-bindgen" "$HOME/.cargo/bin/"
          else
            echo "prebuilt download failed; building from source"
            cargo install wasm-bindgen-cli --version "$VERSION" --locked
          fi
          wasm-bindgen --version
      - name: Build and verify site bundle
        run: python3 tools/deploy/build_site.py --out _site-ci
      - name: Upload verified site bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-smoke-bundle
          path: _site-ci
          if-no-files-found: error

  python:
    name: Check (Python bindings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Check rspice-python
        run: cargo check --locked -p rspice-python
