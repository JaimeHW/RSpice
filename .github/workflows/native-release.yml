name: Native desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.94.0"
  CARGO_DENY_VERSION: "0.19.9"
  CARGO_CYCLONEDX_VERSION: "0.5.9"

jobs:
  validate:
    name: Validate immutable release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      source_date_epoch: ${{ steps.identity.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Validate tag, version, and main ancestry
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "native releases must run from an immutable tag" >&2
            exit 1
          fi
          tag="$GITHUB_REF_NAME"
          version=$(python - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as source:
              print(tomllib.load(source)["workspace"]["package"]["version"])
          PY
          )
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match workspace version $version" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]; then
            echo "release tags must be annotated" >&2
            exit 1
          fi
          commit=$(git rev-list -n 1 "refs/tags/$tag")
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release tag did not resolve to an exact commit" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$commit" origin/main
          source_date_epoch=$(git show -s --format=%ct "$commit")
          git diff --exit-code
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "source_date_epoch=$source_date_epoch"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Qualify release correctness
    needs: validate
    uses: ./.github/workflows/ci.yml

  conformance:
    name: Qualify release conformance
    needs: validate
    uses: ./.github/workflows/nightly.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  build:
    name: Package ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            architecture: aarch64
          - os: macos-15
            target: aarch64-apple-darwin
            architecture: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x86_64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            architecture: x86_64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            architecture: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --target ${{ matrix.target }}
      - name: Build locked release backend
        env:
          RSPICE_BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
          RUSTFLAGS: -D warnings
        run: cargo build --locked --release -p rspice-cli --features generated-veriloga-catalog --target ${{ matrix.target }}
      - name: Build locked desktop application
        env:
          RSPICE_BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
          RUSTFLAGS: -D warnings -A dead-code
        run: cargo build --locked --release -p rspice-app --features generated-veriloga-catalog --target ${{ matrix.target }}
      - name: Smoke packaged backend identity and readiness
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/${EXPECTED_TARGET}/release/rspice"
          case "$EXPECTED_TARGET" in
            *windows*) binary="${binary}.exe" ;;
          esac
          "$binary" --version
          "$binary" health --json > health.json
          python - <<'PY'
          import json
          import os
          with open("health.json", encoding="utf-8") as source:
              health = json.load(source)
          assert health["ready"] is True, health
          assert health["tool"]["profile"] == "release", health
          assert health["tool"]["target"] == os.environ["EXPECTED_TARGET"], health
          assert health["tool"]["commit"] == os.environ["EXPECTED_COMMIT"], health
          PY
      - name: Create deterministic release archive and checksum
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/${RELEASE_TARGET}/release/rspice"
          ui_binary="target/${RELEASE_TARGET}/release/rspice-app"
          case "$RELEASE_TARGET" in
            *windows*) binary="${binary}.exe"; ui_binary="${ui_binary}.exe" ;;
          esac
          python tools/release/package_native.py \
            --binary "$binary" \
            --ui-binary "$ui_binary" \
            --target "$RELEASE_TARGET" \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --out dist
      - name: Upload native package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - name: Attest native package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*

  supply-chain:
    name: Release advisory gate and SBOM
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      # Each Rust cache is keyed on what decides its dependency build: the
      # external crates Cargo.lock pins, the build profiles, the target
      # rustflags and the toolchain. Workspace manifests stay out of the key,
      # since rust-cache never stores workspace crates, so the key changes only
      # when the stored dependencies would. Caches are saved from main alone;
      # other refs restore main's.
      - name: Fingerprint the dependency build
        id: deps
        shell: bash
        run: >-
          echo "digest=$({ grep -E '^(source|checksum) = ' Cargo.lock;
          awk '/^\[/ { p = /^\[profile\./ } p' Cargo.toml;
          cat .cargo/config.toml rust-toolchain.toml; } | git hash-object --stdin)"
          >> "$GITHUB_OUTPUT"
      # Reads the cache security.yml saves from main: the same pinned
      # cargo-deny and cargo-cyclonedx installs.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: rust-supply-chain-${{ env.CARGO_DENY_VERSION }}-${{ env.CARGO_CYCLONEDX_VERSION }}-${{ steps.deps.outputs.digest }}
          add-rust-environment-hash-key: false
          save-if: false
      - name: Install pinned security tooling
        run: |
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked
      - name: Gate current dependency risk
        run: |
          mkdir -p target
          cargo metadata --locked --all-features --format-version 1 > target/security-metadata.json
          cargo deny check --metadata-path target/security-metadata.json advisories bans licenses sources
      - name: Generate release SBOMs and checksums
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5 --target all \
            --manifest-path crates/rspice-cli/Cargo.toml \
            --override-filename rspice-cli.cdx
          cargo cyclonedx --format json --spec-version 1.5 --target all \
            --manifest-path crates/rspice-app/Cargo.toml \
            --override-filename rspice-app.cdx
          mkdir -p dist
          mv crates/rspice-cli/rspice-cli.cdx.json "dist/rspice-${RELEASE_VERSION}-cli.cdx.json"
          mv crates/rspice-app/rspice-app.cdx.json "dist/rspice-${RELEASE_VERSION}-ui.cdx.json"
          cd dist
          for sbom in *.cdx.json; do
            sha256sum "$sbom" > "${sbom}.sha256"
          done
      - name: Upload release SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: dist/*
          if-no-files-found: error
      - name: Attest release SBOM provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*

  publish:
    name: Publish verified GitHub release
    needs: [validate, test, conformance, build, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete checksum set
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          archive_count=$(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)
          if [ "$archive_count" -ne 6 ]; then
            echo "expected six native archives, found $archive_count" >&2
            exit 1
          fi
          checksum_count=$(find . -maxdepth 1 -type f -name '*.sha256' | wc -l)
          if [ "$checksum_count" -ne 9 ]; then
            echo "expected nine checksum sidecars, found $checksum_count" >&2
            exit 1
          fi
          sha256sum --check --strict ./*.sha256
      - name: Create or repair release from verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p existing-release-assets
            declare -A existing_assets=()
            while IFS= read -r name; do
              existing_assets["$name"]=1
            done < <(
              gh release view "$RELEASE_TAG" \
                --json assets \
                --jq '.assets[].name' \
                --repo "$GITHUB_REPOSITORY"
            )

            for asset in "${assets[@]}"; do
              name=$(basename "$asset")
              if [[ -n "${existing_assets[$name]:-}" ]]; then
                gh release download "$RELEASE_TAG" \
                  --pattern "$name" \
                  --dir existing-release-assets \
                  --repo "$GITHUB_REPOSITORY"
                if ! cmp --silent "$asset" "existing-release-assets/$name"; then
                  echo "refusing to replace immutable release asset: $name" >&2
                  exit 1
                fi
              else
                gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "RSpice ${RELEASE_VERSION}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
