name: Native desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.94.0"
  CARGO_DENY_VERSION: "0.19.9"
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  UV_VERSION: "0.12.1"
  MANAGED_PYTHON_VERSION: "3.14.6"
  MANAGED_PYTHON_ABI: "cp314"
  AUTOMATION_API_VERSION: "1.0.0"
  AUTOMATION_ENVIRONMENT_DIGEST: "d445b1443965be4e6b1b191ee023176dbd35430ac3cd00603458384ea03b8518"
  AUTOMATION_RUNTIME_KEY_ID: "rspice-managed-runtime-2026-01"

jobs:
  validate:
    name: Validate immutable release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      source_date_epoch: ${{ steps.identity.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate tag, version, and main ancestry
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "native releases must run from an immutable tag" >&2
            exit 1
          fi
          tag="$GITHUB_REF_NAME"
          version=$(python - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as source:
              print(tomllib.load(source)["workspace"]["package"]["version"])
          PY
          )
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match workspace version $version" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]; then
            echo "release tags must be annotated" >&2
            exit 1
          fi
          commit=$(git rev-list -n 1 "refs/tags/$tag")
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release tag did not resolve to an exact commit" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$commit" origin/main
          source_date_epoch=$(git show -s --format=%ct "$commit")
          git diff --exit-code
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "source_date_epoch=$source_date_epoch"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Package ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            architecture: aarch64
          - os: macos-15
            target: aarch64-apple-darwin
            architecture: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x86_64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            architecture: x86_64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            architecture: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: native-release-${{ matrix.target }}
      - name: Stage exact app-local managed CPython
        id: stage_python
        shell: bash
        run: |
          set -euo pipefail
          python_install_root="$RUNNER_TEMP/rspice-managed-python-install"
          runtime_root="$RUNNER_TEMP/rspice-release-stage/runtimes/python"
          UV_PYTHON_INSTALL_DIR="$python_install_root" \
            uv python install --managed-python "$MANAGED_PYTHON_VERSION"
          managed_python=$(UV_PYTHON_INSTALL_DIR="$python_install_root" \
            uv python find --managed-python "$MANAGED_PYTHON_VERSION")
          python tools/release/stage_managed_python.py \
            --python-executable "$managed_python" \
            --output-root "$runtime_root" \
            --worker assets/automation_runtime/rspice_worker.py \
            --expected-version "$MANAGED_PYTHON_VERSION" \
            --source-identity "astral-sh/python-build-standalone via uv ${UV_VERSION}" \
            >> "$GITHUB_OUTPUT"
      - name: Build managed-runtime signing authority
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo build --locked --release
          -p rspice-automation-runtime
          --bin rspice-managed-runtime-packager
      - name: Inventory, sign, and self-verify managed CPython
        id: runtime
        shell: bash
        env:
          RSPICE_AUTOMATION_RUNTIME_SIGNING_SEED_HEX: ${{ secrets.RSPICE_AUTOMATION_RUNTIME_SIGNING_SEED_HEX }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
          RUNTIME_ROOT: ${{ steps.stage_python.outputs.runtime_root }}
          PYTHON_EXECUTABLE: ${{ steps.stage_python.outputs.python_executable }}
        run: |
          set -euo pipefail
          if ! [[ "${RSPICE_AUTOMATION_RUNTIME_SIGNING_SEED_HEX:-}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "release signing seed is unavailable or malformed" >&2
            exit 1
          fi
          umask 077
          signing_key="$RUNNER_TEMP/rspice-managed-runtime-signing-seed"
          printf '%s' "$RSPICE_AUTOMATION_RUNTIME_SIGNING_SEED_HEX" > "$signing_key"
          unset RSPICE_AUTOMATION_RUNTIME_SIGNING_SEED_HEX
          trap 'rm -f "$signing_key"' EXIT
          runtime_packager=target/release/rspice-managed-runtime-packager
          if [ "$RUNNER_OS" = "Windows" ]; then
            runtime_packager="${runtime_packager}.exe"
          fi
          "$runtime_packager" \
            --runtime-root "$RUNTIME_ROOT" \
            --runtime-build "rspice-cpython-${MANAGED_PYTHON_VERSION}+${RELEASE_COMMIT}" \
            --target "$RELEASE_TARGET" \
            --architecture "$RELEASE_ARCHITECTURE" \
            --python-version "$MANAGED_PYTHON_VERSION" \
            --python-abi "$MANAGED_PYTHON_ABI" \
            --api-version "$AUTOMATION_API_VERSION" \
            --python-executable "$PYTHON_EXECUTABLE" \
            --worker-bootstrap worker/rspice_worker.py \
            --environment-digest "$AUTOMATION_ENVIRONMENT_DIGEST" \
            --key-id "$AUTOMATION_RUNTIME_KEY_ID" \
            --signing-key-file "$signing_key" \
            >> "$GITHUB_OUTPUT"
      - name: Build managed-runtime release qualifier
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo build --locked --release
          -p rspice-automation-runtime
          --bin rspice-managed-runtime-qualifier
          --target ${{ matrix.target }}
      - name: Qualify signed managed CPython execution and cancellation
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
          RUNTIME_ROOT: ${{ steps.stage_python.outputs.runtime_root }}
          RUNTIME_KEY_ID: ${{ steps.runtime.outputs.signing_key_id }}
          RUNTIME_PUBLIC_KEY_HEX: ${{ steps.runtime.outputs.public_key_hex }}
        run: |
          set -euo pipefail
          qualifier="target/${RELEASE_TARGET}/release/rspice-managed-runtime-qualifier"
          if [ "$RUNNER_OS" = "Windows" ]; then
            qualifier="${qualifier}.exe"
          fi
          "$qualifier" \
            --runtime-root "$RUNTIME_ROOT" \
            --key-id "$RUNTIME_KEY_ID" \
            --public-key-hex "$RUNTIME_PUBLIC_KEY_HEX" \
            --target "$RELEASE_TARGET" \
            --architecture "$RELEASE_ARCHITECTURE" \
            --python-version "$MANAGED_PYTHON_VERSION" \
            --api-version "$AUTOMATION_API_VERSION" \
            --environment-digest "$AUTOMATION_ENVIRONMENT_DIGEST" \
            > managed-runtime-qualification.json
          python - <<'PY'
          import json
          with open("managed-runtime-qualification.json", encoding="utf-8") as source:
              evidence = json.load(source)
          assert evidence["passed"] is True, evidence
          assert evidence["system_python_path_used"] is False, evidence
          PY
      - name: Build locked release backend
        env:
          RSPICE_BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
          RUSTFLAGS: -D warnings
        run: cargo build --locked --release -p rspice-cli --target ${{ matrix.target }}
      - name: Build locked desktop application with the release trust root
        env:
          RSPICE_BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
          RSPICE_AUTOMATION_RUNTIME_KEY_ID: ${{ steps.runtime.outputs.signing_key_id }}
          RSPICE_AUTOMATION_RUNTIME_PUBLIC_KEY_HEX: ${{ steps.runtime.outputs.public_key_hex }}
          RUSTFLAGS: -D warnings -A dead-code
        run: cargo build --locked --release -p rspice-ui --features generated-veriloga-catalog --target ${{ matrix.target }}
      - name: Smoke packaged backend identity and readiness
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/${EXPECTED_TARGET}/release/rspice"
          case "$EXPECTED_TARGET" in
            *windows*) binary="${binary}.exe" ;;
          esac
          "$binary" --version
          "$binary" health --json > health.json
          python - <<'PY'
          import json
          import os
          with open("health.json", encoding="utf-8") as source:
              health = json.load(source)
          assert health["ready"] is True, health
          assert health["tool"]["profile"] == "release", health
          assert health["tool"]["target"] == os.environ["EXPECTED_TARGET"], health
          assert health["tool"]["commit"] == os.environ["EXPECTED_COMMIT"], health
          PY
      - name: Create deterministic release archive and checksum
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/${RELEASE_TARGET}/release/rspice"
          ui_binary="target/${RELEASE_TARGET}/release/rspice-ui"
          case "$RELEASE_TARGET" in
            *windows*) binary="${binary}.exe"; ui_binary="${ui_binary}.exe" ;;
          esac
          python tools/release/package_native.py \
            --binary "$binary" \
            --ui-binary "$ui_binary" \
            --runtime-root "${{ steps.stage_python.outputs.runtime_root }}" \
            --target "$RELEASE_TARGET" \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --out dist
      - name: Upload native package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - name: Attest native package provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/*

  supply-chain:
    name: Release advisory gate and SBOM
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: native-release-supply-chain
      - name: Install pinned security tooling
        run: |
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked
      - name: Gate current dependency risk
        run: |
          python tools/security/check_advisory_exceptions.py
          cargo deny check advisories bans licenses sources
          cargo audit
      - name: Generate release SBOMs and checksums
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5 --target all \
            --manifest-path crates/rspice-cli/Cargo.toml \
            --override-filename rspice-cli.cdx
          cargo cyclonedx --format json --spec-version 1.5 --target all \
            --manifest-path crates/rspice-ui/Cargo.toml \
            --override-filename rspice-ui.cdx
          cargo cyclonedx --format json --spec-version 1.5 --target all \
            --manifest-path crates/rspice-automation-runtime/Cargo.toml \
            --override-filename rspice-automation-runtime.cdx
          mkdir -p dist
          mv crates/rspice-cli/rspice-cli.cdx.json "dist/rspice-${RELEASE_VERSION}-cli.cdx.json"
          mv crates/rspice-ui/rspice-ui.cdx.json "dist/rspice-${RELEASE_VERSION}-ui.cdx.json"
          mv crates/rspice-automation-runtime/rspice-automation-runtime.cdx.json \
            "dist/rspice-${RELEASE_VERSION}-automation-runtime.cdx.json"
          cd dist
          for sbom in *.cdx.json; do
            sha256sum "$sbom" > "${sbom}.sha256"
          done
      - name: Upload release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: dist/*
          if-no-files-found: error
      - name: Attest release SBOM provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/*

  publish:
    name: Publish verified GitHub release
    needs: [validate, build, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete checksum set
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          archive_count=$(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)
          if [ "$archive_count" -ne 6 ]; then
            echo "expected six native archives, found $archive_count" >&2
            exit 1
          fi
          checksum_count=$(find . -maxdepth 1 -type f -name '*.sha256' | wc -l)
          if [ "$checksum_count" -ne 9 ]; then
            echo "expected nine checksum sidecars, found $checksum_count" >&2
            exit 1
          fi
          sha256sum --check --strict ./*.sha256
      - name: Create or repair release from verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p existing-release-assets
            declare -A existing_assets=()
            while IFS= read -r name; do
              existing_assets["$name"]=1
            done < <(
              gh release view "$RELEASE_TAG" \
                --json assets \
                --jq '.assets[].name' \
                --repo "$GITHUB_REPOSITORY"
            )

            for asset in "${assets[@]}"; do
              name=$(basename "$asset")
              if [[ -n "${existing_assets[$name]:-}" ]]; then
                gh release download "$RELEASE_TAG" \
                  --pattern "$name" \
                  --dir existing-release-assets \
                  --repo "$GITHUB_REPOSITORY"
                if ! cmp --silent "$asset" "existing-release-assets/$name"; then
                  echo "refusing to replace immutable release asset: $name" >&2
                  exit 1
                fi
              else
                gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "RSpice ${RELEASE_VERSION}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
