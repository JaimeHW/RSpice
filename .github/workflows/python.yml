name: python

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-${{ matrix.os }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install binding (release) and test deps
        working-directory: crates/rspice-python
        run: |
          pip install maturin numpy pytest
          maturin develop --release
      - name: Run binding test suite
        working-directory: crates/rspice-python
        run: python -m pytest tests/ -v --tb=short
      - name: Run example verification suite
        working-directory: examples/python
        run: python -m pytest -v --tb=short
      - name: Validate type stubs against runtime
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        working-directory: crates/rspice-python
        run: |
          pip install mypy
          python -m mypy.stubtest rspice --ignore-missing-stub --allowlist stubtest-allowlist.txt

  wheels:
    name: abi3 wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wheels-${{ matrix.os }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/rspice-python
          command: build
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/rspice-python/dist/*.whl
