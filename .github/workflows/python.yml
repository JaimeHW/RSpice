name: python

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "crates/rspice-python/examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "crates/**"
      - "crates/rspice-python/examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-${{ matrix.os }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Create and select virtualenv
        shell: bash
        run: |
          # maturin develop requires an active virtualenv; create one at the repo
          # root (a parent of every working-directory below) and put it on PATH so
          # all later steps resolve pip/python/pytest/maturin to it. cygpath emits a
          # native path so the entry also works in the runner's default shell.
          python -m venv .venv
          if [ -d .venv/Scripts ]; then
            echo "VIRTUAL_ENV=$(cygpath -w "$PWD/.venv")" >> "$GITHUB_ENV"
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install binding (release) and test deps
        working-directory: crates/rspice-python
        run: |
          pip install maturin numpy pytest
          maturin develop --release
      - name: Run binding test suite
        working-directory: crates/rspice-python
        run: python -m pytest tests/ -v --tb=short
      - name: Run example verification suite
        working-directory: crates/rspice-python
        run: python -m pytest examples/analog_ci -v --tb=short
      - name: Validate type stubs against runtime
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        working-directory: crates/rspice-python
        run: |
          # Pinned: stubtest's checks change across mypy majors (2.1 began
          # comparing runtime __new__ signatures). Bump deliberately.
          pip install "mypy==2.1.0"
          python -m mypy.stubtest rspice --ignore-missing-stub --allowlist stubtest-allowlist.txt

  wheels:
    name: abi3 wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wheels-${{ matrix.os }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/rspice-python
          command: build
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/rspice-python/dist/*.whl
