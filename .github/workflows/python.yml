name: python

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MATURIN_VERSION: "1.14.1"
  PYTEST_VERSION: "9.1.1"
  RUST_TOOLCHAIN: "1.94.0"

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: python-${{ matrix.os }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Create and select virtualenv
        shell: bash
        run: |
          # maturin develop requires an active virtualenv; create one at the repo
          # root (a parent of every working-directory below) and put it on PATH so
          # all later steps resolve pip/python/pytest/maturin to it. cygpath emits a
          # native path so the entry also works in the runner's default shell.
          python -m venv .venv
          if [ -d .venv/Scripts ]; then
            echo "VIRTUAL_ENV=$(cygpath -w "$PWD/.venv")" >> "$GITHUB_ENV"
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install binding (release) and test deps
        working-directory: crates/rspice-python
        run: |
          pip install -c ci-constraints.txt "maturin==${{ env.MATURIN_VERSION }}" "pytest==${{ env.PYTEST_VERSION }}"
          maturin develop --release --locked
      - name: Run binding test suite
        working-directory: crates/rspice-python
        run: python -m pytest tests/ -v --tb=short
      - name: Validate type stubs against runtime
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        working-directory: crates/rspice-python
        run: |
          # Pinned: stubtest's checks change across mypy majors (2.1 began
          # comparing runtime __new__ signatures). Bump deliberately.
          pip install -c ci-constraints.txt "mypy==2.1.0"
          python -m mypy.stubtest rspice --ignore-missing-stub --allowlist stubtest-allowlist.txt

  wheels:
    name: abi3 wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: wheels-${{ matrix.os }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Build abi3 wheel
        working-directory: crates/rspice-python
        run: |
          pip install -c ci-constraints.txt "maturin==${{ env.MATURIN_VERSION }}" "pytest==${{ env.PYTEST_VERSION }}"
          maturin build --release --locked --out dist
      - name: Install wheel and run smoke test
        shell: bash
        working-directory: crates/rspice-python
        run: |
          python -m pip install --force-reinstall -c ci-constraints.txt dist/*.whl
          python - <<'PY'
          import rspice

          netlist = rspice.Netlist.parse("V1 in 0 1\nR1 in 0 1k\n.op\n.end\n")
          result = rspice.Engine().run_dc_op(netlist)
          assert abs(result.voltage("in") - 1.0) < 1e-9
          print(f"rspice {rspice.__version__} wheel smoke passed")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: crates/rspice-python/dist/*.whl
          if-no-files-found: error
