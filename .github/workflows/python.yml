name: python

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

# This workflow fans out to ~32 jobs (ten of them macOS, whose concurrency
# cap is small), so back-to-back pushes to main were queueing hundreds of
# jobs and starving every other workflow's runners for hours. Serialize per
# ref: on main the running validation finishes and GitHub keeps only the
# newest push pending; on pull requests a superseded run is cancelled.
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MATURIN_VERSION: "1.14.1"
  PYTEST_VERSION: "9.1.1"
  RUST_TOOLCHAIN: "1.94.0"

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: python-${{ matrix.os }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Create and select virtualenv
        shell: bash
        run: |
          # maturin develop requires an active virtualenv; create one at the repo
          # root (a parent of every working-directory below) and put it on PATH so
          # all later steps resolve pip/python/pytest/maturin to it. cygpath emits a
          # native path so the entry also works in the runner's default shell.
          python -m venv .venv
          if [ -d .venv/Scripts ]; then
            echo "VIRTUAL_ENV=$(cygpath -w "$PWD/.venv")" >> "$GITHUB_ENV"
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install binding (release) and test deps
        working-directory: crates/rspice-python
        run: |
          pip install -c ci-constraints.txt "maturin==${{ env.MATURIN_VERSION }}" "pytest==${{ env.PYTEST_VERSION }}"
          maturin develop --release --locked
      - name: Run binding test suite
        working-directory: crates/rspice-python
        run: python -m pytest tests/ -v --tb=short
      - name: Run Rust-side binding invariants
        working-directory: crates/rspice-python
        run: cargo test --locked -p rspice-python --lib
      - name: Validate type stubs against runtime
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        working-directory: crates/rspice-python
        run: |
          # Pinned: stubtest's checks change across mypy majors (2.1 began
          # comparing runtime __new__ signatures). Bump deliberately.
          pip install -c ci-constraints.txt "mypy==2.1.0"
          python -m mypy.stubtest rspice --allowlist stubtest-allowlist.txt

  native-feature-lint:
    name: Lint every native feature combination
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # rspice-core's generated all-feature surface is large enough that
      # concurrent Clippy/rspice-python compilation exhausts the hosted
      # runner. Keep the full lint coverage while bounding peak memory.
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: python-native-feature-lint-linux
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Run warnings-denied Clippy
        run: |
          cargo clippy --locked -p rspice-core --all-targets --all-features -- -D warnings
          cargo clippy --locked -p rspice-python --all-targets --all-features -- -D warnings

  wheels:
    name: abi3 wheel (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: wheels-${{ matrix.platform.name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          working-directory: crates/rspice-python
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --compatibility pypi --out dist
      - name: Install wheel and run smoke test
        shell: bash
        working-directory: crates/rspice-python
        run: |
          python -m pip install --force-reinstall -c ci-constraints.txt "pytest==${{ env.PYTEST_VERSION }}" dist/*.whl
          python - <<'PY'
          import rspice

          netlist = rspice.Netlist.parse("V1 in 0 1\nR1 in 0 1k\n.op\n.end\n")
          result = rspice.Engine().run_dc_op(netlist)
          assert abs(result.voltage("in") - 1.0) < 1e-9
          print(f"rspice {rspice.__version__} wheel smoke passed")
          PY
      - name: Select Python 3.10 for abi3 floor validation
        if: matrix.platform.name == 'linux-x86_64'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install the abi3 wheel at its declared Python floor
        if: matrix.platform.name == 'linux-x86_64'
        shell: bash
        working-directory: crates/rspice-python
        run: |
          python -m pip install --force-reinstall -c ci-constraints.txt dist/*.whl
          python - <<'PY'
          import rspice

          netlist = rspice.Netlist.parse("V1 in 0 1\nR1 in 0 1k\n.op\n.end\n")
          result = rspice.Engine().run_dc_op(netlist)
          assert abs(result.voltage("in") - 1.0) < 1e-9
          print(f"rspice {rspice.__version__} Python 3.10 abi3 smoke passed")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform.name }}
          path: crates/rspice-python/dist/*.whl
          if-no-files-found: error
      - name: Generate wheel provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: crates/rspice-python/dist/*.whl

  free-threaded-wheels:
    name: cp314t wheel (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: wheels-cp314t-${{ matrix.platform.name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14t"
      - name: Build free-threaded CPython 3.14 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          working-directory: crates/rspice-python
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --compatibility pypi -i python3.14t --out dist
      - name: Install cp314t wheel and verify the GIL stays disabled
        shell: bash
        working-directory: crates/rspice-python
        run: |
          python -m pip install --force-reinstall -c ci-constraints.txt dist/*.whl
          python -Xgil=0 - <<'PY'
          import sys
          import rspice

          assert not sys._is_gil_enabled()
          netlist = rspice.Netlist.parse("V1 in 0 1\nR1 in 0 1k\n.op\n.end\n")
          result = rspice.Engine().run_dc_op(netlist)
          assert abs(result.voltage("in") - 1.0) < 1e-9
          print(f"rspice {rspice.__version__} cp314t smoke passed with the GIL disabled")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-cp314t-${{ matrix.platform.name }}
          path: crates/rspice-python/dist/*.whl
          if-no-files-found: error
      - name: Generate free-threaded wheel provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: crates/rspice-python/dist/*.whl

  source-distribution:
    name: locked source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: python-sdist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Populate the locked Cargo cache
        run: cargo fetch --locked --manifest-path crates/rspice-python/Cargo.toml
      - name: Build and repair source distribution
        working-directory: crates/rspice-python
        run: |
          python -m pip install -c ci-constraints.txt "maturin==${{ env.MATURIN_VERSION }}"
          maturin sdist --out dist
          python ../../tools/release/repair_sdist_lock.py dist/rspice-*.tar.gz
      - name: Build and install from source distribution offline
        shell: bash
        working-directory: crates/rspice-python
        run: |
          python -m venv .sdist-venv
          source .sdist-venv/bin/activate
          python -m pip install -c ci-constraints.txt "maturin==${{ env.MATURIN_VERSION }}" "numpy>=2.0,<3"
          CARGO_NET_OFFLINE=true python -m pip install --no-build-isolation --no-deps dist/rspice-*.tar.gz
          python - <<'PY'
          import rspice

          netlist = rspice.Netlist.parse("V1 in 0 1\nR1 in 0 1k\n.op\n.end\n")
          result = rspice.Engine().run_dc_op(netlist)
          assert abs(result.voltage("in") - 1.0) < 1e-12
          print(f"rspice {rspice.__version__} source-distribution smoke passed")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-distribution
          path: crates/rspice-python/dist/*.tar.gz
          if-no-files-found: error
      - name: Generate source-distribution provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: crates/rspice-python/dist/*.tar.gz
