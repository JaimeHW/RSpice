# Deliberate site deploys. RSpice-Site owns static source; this private client
# repository owns browser runtime compilation and production verification.
# Run tools/deploy/deploy.py (git only, no gh), push a site-v* tag, or dispatch
# a client ref plus an explicit site ref. The build compiles both wasm bundles,
# records both source commits, runs bundle-integrity gates,
# a live headless solve of the playground, and a browser-IDE boot smoke;
# nothing publishes unless
# every gate passes. tools/deploy/publish.py force-pushes _site to the cf-pages tree, which
# is the Cloudflare Pages production branch; Cloudflare picks the push
# up and serves it within about a minute. Rollback: re-run on an older
# ref. The branch stays single-commit so the multi-MB wasm
# bundles never accrete history.
name: Deploy site

on:
  workflow_dispatch:
    inputs:
      site_ref:
        description: RSpice-Site branch, tag, or commit to assemble
        required: true
        default: main
  push:
    tags: ["site-v*"]

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.94.0"

jobs:
  deploy:
    name: Build, verify, publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
      url: https://rspice.app
    steps:
      - name: Check out RSpice client source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve immutable site source revision
        id: site-source
        shell: bash
        env:
          REQUESTED_SITE_REF: ${{ inputs.site_ref }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/site-v* ]]; then
            git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
            SITE_REF="$(git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" \
              | sed -n 's/^site-source-sha: \([0-9a-f]\{40\}\)$/\1/p' \
              | head -n 1)"
            if [[ ! "$SITE_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "deployment tag is missing a valid site-source-sha" >&2
              exit 1
            fi
          else
            SITE_REF="${REQUESTED_SITE_REF:-main}"
          fi
          echo "ref=$SITE_REF" >> "$GITHUB_OUTPUT"
      - name: Check out standalone site source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: JaimeHW/RSpice-Site
          ref: ${{ steps.site-source.outputs.ref }}
          path: _site-source
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install wasm-bindgen-cli (pinned to Cargo.lock)
        run: |
          VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)
          echo "Cargo.lock pins wasm-bindgen $VERSION"
          DIST="wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl"
          if curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${VERSION}/${DIST}.tar.gz" | tar -xz; then
            mv "${DIST}/wasm-bindgen" "$HOME/.cargo/bin/"
          else
            echo "prebuilt download failed; building from source"
            cargo install wasm-bindgen-cli --version "$VERSION" --locked
          fi
          wasm-bindgen --version

      - name: Build and verify (_site)
        run: python3 tools/deploy/build_site.py --site-source _site-source/public

      - name: Upload verified site bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-site
          path: _site
          if-no-files-found: error

      - name: Publish to cf-pages (Cloudflare Pages production branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/deploy/publish.py --branch cf-pages --dir _site
