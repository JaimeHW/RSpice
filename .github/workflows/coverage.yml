# Instrumentation reports supplement the per-change correctness gate.
name: Coverage

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.94.0"
  CARGO_LLVM_COV_VERSION: "0.8.7"

jobs:
  rust-coverage:
    name: Rust coverage (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            packages: -p rspice-core
          - group: ui
            packages: -p rspice-ui
          - group: libraries
            packages: >-
              --workspace --exclude rspice-core --exclude rspice-ui
              --exclude rspice-python --exclude rspice-wasm --exclude rspice-conformance
              --exclude 'rspice-veriloga-model*' --exclude 'rspice-*-catalog-dump'
    env:
      CARGO_BUILD_JOBS: "2"
      # Coverage uses its coverage map, not DWARF. Bound link pressure and
      # avoid deeply scoped generated-model debug information.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: coverage-${{ matrix.group }}
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked
      - name: Prepare coverage output directory
        run: mkdir -p target/coverage
      - name: Generate lcov report
        run: >-
          cargo llvm-cov --locked ${{ matrix.packages }}
          --no-fail-fast --lcov --output-path target/coverage/lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-lcov-${{ matrix.group }}
          path: target/coverage/lcov.info
          if-no-files-found: error
