name: Coverage

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/coverage.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/coverage.yml"
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Pushes to main land minutes apart, and every one matching the path filter
# queues another two-hour instrumented build. Serialize per ref: on main the
# running report finishes and GitHub keeps only the newest push pending; on
# pull requests a superseded report is cancelled outright.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.94.0"
  CARGO_LLVM_COV_VERSION: "0.8.7"

jobs:
  rust-coverage:
    name: Rust coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Source-based coverage reads the __llvm_covmap section, not DWARF, so
      # debug info buys nothing here — and emitting it is what crashes the
      # build: rustc 1.94's LLVM overflows its stack in
      # DwarfCompileUnit::createAndAddScopeChildren on the deeply scoped
      # generated Verilog-A model crates once -C instrument-coverage is added.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked
      - name: Prepare coverage output directory
        run: mkdir -p target/coverage
      - name: Generate lcov report
        # rspice-conformance is excluded by crate rather than by test name.
        # Its integration target is the 247-deck ngspice suite, which is far
        # too slow to run under instrumentation, and its own unit tests cover
        # harness code (tolerance model, directive classification) rather than
        # the simulator, so excluding it makes the number more honest as well
        # as faster. The previous `--skip test_ngspice_ --skip
        # test_full_ngspice` did the same job but relied on test names.
        #
        # The five skips below are the open items of the rspice-ui layering
        # burndown. `crates/rspice-ui/tests/module_layering.rs` is an
        # architectural ratchet, not a coverage measurement, and this job is
        # the only one that runs it — every rspice-ui invocation in ci.yml is
        # `--lib`. Holding the whole report hostage to that program meant no
        # lcov artifact was produced at all for months, which is the worse
        # failure: a report nobody gets cannot show a regression. The other
        # six subtests still run here and still gate. Delete a skip as its
        # item is burned down; when the list is empty, delete it entirely and
        # give the ratchet its own fail-fast step in ci.yml, the way the
        # rspice-core ratchets already have one.
        run: >-
          cargo llvm-cov --locked --workspace
          --exclude rspice-python --exclude rspice-wasm
          --exclude rspice-conformance
          --lcov --output-path target/coverage/lcov.info
          --
          --skip source_files_stay_within_the_line_budget
          --skip lint_suppressions_do_not_grow
          --skip whole_application_mutable_access_does_not_grow
          --skip workbench_references_respect_the_layer_order
          --skip module_references_respect_the_layer_order
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-lcov
          path: target/coverage/lcov.info
          if-no-files-found: error
