name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.94.0"
  CARGO_DENY_VERSION: "0.19.9"
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_CYCLONEDX_VERSION: "0.5.9"

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  rust-supply-chain:
    name: Rust advisories, licenses, sources, SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install security tools
        run: |
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked
      - name: Validate expiring advisory exceptions
        run: python3 tools/security/check_advisory_exceptions.py
      - name: Resolve the committed dependency graph
        run: |
          mkdir -p target
          cargo metadata --locked --all-features --format-version 1 > target/security-metadata.json
      - name: Cargo deny policy
        run: cargo deny check --metadata-path target/security-metadata.json advisories bans licenses sources
      - name: RustSec audit
        run: cargo audit --deny warnings --file Cargo.lock
      - name: Generate CycloneDX SBOMs
        run: |
          cargo cyclonedx --format json --target all --override-filename bom
          mkdir -p target/sbom
          find . -name bom.json -not -path './target/*' -print0 | while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            name=$(printf '%s' "$dir" | sed 's#^\./##; s#/#-#g; s#^\.$#workspace#')
            cp "$file" "target/sbom/${name}-bom.json"
          done
          find . -name bom.json -not -path './target/*' -delete
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sboms
          path: target/sbom/*.json
          if-no-files-found: error
