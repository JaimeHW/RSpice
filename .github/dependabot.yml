version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    groups:
      rust-patch-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned by workspace determinism requirements: every Monte Carlo and
      # agauss stream in the corpus is reproduced against this generator, so a
      # proposed major can never merge as-is.
      - dependency-name: "rand"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/crates/rspice-python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    ignore:
      # Pinned by CI gate compatibility: the type-check gate is calibrated to
      # this release, and a proposed bump reopens the whole diagnostic set.
      - dependency-name: "mypy"
