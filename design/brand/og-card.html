/* solved second-order step response (zeta 0.28) as the footer trace — solved, not sketched */
(function () {
  var svg = document.getElementById("trace");
  var NS = "http://www.w3.org/2000/svg";
  var zeta = 0.28, w0 = 2 * Math.PI * 800, tEnd = 6e-3, N = 400;
  var d = "";
  for (var i = 0; i <= N; i++) {
    var t = tEnd * i / N;
    var wd = w0 * Math.sqrt(1 - zeta * zeta);
    var y = 1 - Math.exp(-zeta * w0 * t) *
      (Math.cos(wd * t) + zeta / Math.sqrt(1 - zeta * zeta) * Math.sin(wd * t));
    var px = 1200 * i / N;
    var py = 108 - 68 * y / 1.5;
    d += (i === 0 ? "M" : "L") + px.toFixed(1) + " " + py.toFixed(1);
  }
  var base = document.createElementNS(NS, "line");
  base.setAttribute("x1", 0); base.setAttribute("x2", 1200);
  base.setAttribute("y1", 108 - 68 / 1.5); base.setAttribute("y2", 108 - 68 / 1.5);
  base.setAttribute("stroke", "rgba(215,219,222,0.16)"); base.setAttribute("stroke-width", 1);
  base.setAttribute("stroke-dasharray", "6 6");
  svg.appendChild(base);
  var p = document.createElementNS(NS, "path");
  p.setAttribute("d", d); p.setAttribute("fill", "none");
  p.setAttribute("stroke", "#F2B824"); p.setAttribute("stroke-width", 3);
  p.setAttribute("stroke-linejoin", "round");
  svg.appendChild(p);
  var dot = document.createElementNS(NS, "circle");
  dot.setAttribute("cx", 1188); dot.setAttribute("cy", 108 - 68 / 1.5); dot.setAttribute("r", 5.5);
  dot.setAttribute("fill", "#F8DB8A");
  svg.appendChild(dot);
})();
