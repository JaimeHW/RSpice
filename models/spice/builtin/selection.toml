# Built-in library selection.
#
# The built-in library is not authored: it is *selected* from the vendored packs
# and generated by `python tools/models/build_builtin.py`. Every card in
# models/spice/builtin/lib/ traces back to an entry here, and the generator
# refuses any source file that tools/models/license_audit.py marks restricted.
#
# Two selection granularities:
#
#   [[file]]   copy a whole source file. This is the right unit for curated
#              files and for subcircuits, because it preserves the internal
#              .model and .subckt definitions a macromodel depends on.
#   [[model]]  extract one named .model card, with its continuation lines, from
#              a large flat catalog. `name` may rename the card to the part's
#              canonical designation; parameters are never altered.

schema = 1

