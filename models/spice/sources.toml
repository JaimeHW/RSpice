[[pack]]
id = "microcap-library"
name = "Micro-Cap 12 model library, ngspice port"
category = "community"
originator = "Spectrum Software, ported by the ngspice project"
description = """
The device library from Spectrum Software's Micro-Cap 12, converted for
ngspice. The single broadest public collection of manufacturer part models:
op-amps, comparators, regulators, power MOSFETs and IGBTs, bipolar and RF
transistors, diodes and rectifiers, passives from AVX/EPCOS/Vishay, 74-series
logic families, opto-isolators and vacuum tubes. Models date from 1990 to 2018.
Cards that ngspice could not parse are kept in the upstream `incompatible`
subdirectory."""

[pack.source]
kind = "http"
url = "https://ngspice.sourceforge.io/model-parameters/MicroCap-LIBRARY.7z"
sha256 = "afdd6e9d66a399e20b7c4bda20cc3d82ff2bb09050961e0df0c2526522f7cc15"
archive = "7z"
strip_components = 1
include = ["**"]
exclude = []

[pack.license]
spdx = ""
tier = "ambiguous"
redistributable = false
notice_required = true
note = """
Spectrum Software released Micro-Cap 12 free of charge before winding down, and
the ngspice project redistributes this port openly. The library's own about.txt
states the position exactly: "These models are provided without any warranty.
Most models may be freely used and distributed. Some models are have a
restricted license concerning commercial use. In this case please contact the
model owner if a commercial use is intended."

The restricted subset is not identified upstream, so per-model review is
required before this pack is included in a distributed commercial build.
"""

[pack.contents]
devices = [
    "opamp", "comparator", "regulator", "mosfet", "igbt", "bipolar",
    "diode", "rectifier", "passive", "logic", "optocoupler", "tube",
]
corners = []
entry = ""

