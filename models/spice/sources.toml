[[pack]]
id = "sjtu-bsim-ptm"
name = "SJTU BSIM and PTM model collection"
category = "academic"
originator = "Yongfu Li Research Group, Shanghai Jiao Tong University"
description = """
Curated BSIM and Predictive Technology Model card sets spanning 180 nm down to
7 nm, packaged for ngspice, HSPICE and Spectre. Serves as a maintained mirror
of PTM material now that ptm.asu.edu no longer resolves."""

[pack.source]
kind = "git"
url = "https://github.com/SJTU-YONGFU-RESEARCH-GRP/spice_model_collections"
commit = "fa8f3632907ad92416bd2322a46a8e7b0bdd2465"
sparse = []
include = ["LICENSE", "README.md", "MODELS.md", "bsim/**", "ptm/**"]
exclude = []

[pack.license]
spdx = "CC-BY-4.0"
tier = "ambiguous"
redistributable = true
notice_required = true
note = """
The repository declares Creative Commons Attribution 4.0 International, which
grants redistribution with attribution. It also states that "models are provided
under their respective open source licenses", and the PTM-derived cards it
mirrors were originally published by Arizona State University under terms that
were never restated as CC BY. The aggregate declaration is therefore treated as
ambiguous rather than plainly permissive.
"""

[pack.contents]
process = "Predictive and published BSIM nodes, 180 nm to 7 nm"
devices = ["nmos", "pmos", "finfet"]
corners = ["typical"]
entry = ""

