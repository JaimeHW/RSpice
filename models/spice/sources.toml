# RSpice SPICE model pack registry
#
# Every third-party SPICE model pack vendored under models/spice/ is declared
# here exactly once. This file is the single source of truth for provenance and
# licensing; nothing is copied into the tree by hand.
#
#   python tools/models/sync_packs.py       materialize packs from upstream
#   python tools/models/build_manifest.py   regenerate MANIFEST.toml
#   python tools/models/validate_packs.py   check every pack against this file
#
# license.tier drives what may be shipped in a build:
#
#   permissive  Apache-2.0 / BSD / MIT / CC-BY and equivalents. Redistribution
#               is granted outright; a NOTICE attribution entry satisfies it.
#               Safe to embed in the product and in the browser bundle.
#   copyleft    GPL / LGPL family. Vendored for development and validation, but
#               never embedded into a proprietary binary. Packaging excludes
#               these unless the corresponding source-offer obligations are met.
#   ambiguous   No explicit grant, or terms that neither clearly permit nor
#               clearly forbid redistribution. Vendored so the models are
#               usable, flagged so the packaging decision stays deliberate.
#   own         Authored by the RSpice project from published datasheet values.
#               No third-party rights attach.
#
# Packs whose terms explicitly forbid redistribution are not vendored at all and
# must not be added to this file.

schema = 1

#==============================================================================
# Open foundry PDKs
#==============================================================================

[[pack]]
id = "sky130"
name = "SkyWater SKY130 primitive device models"
category = "foundry"
originator = "SkyWater Technology Foundry / Google"
description = """
Full primitive-device model set for the SkyWater 130 nm open PDK: core and I/O
NFET/PFET (including low-/high-Vt and RF variants), diodes, poly and metal
resistors, MIM/VPP capacitors, vertical NPN/PNP bipolars, inductors and ESD
devices, with tt/ff/ss/sf/fs process corners plus leakage, mismatch, statistical
and correlation decks."""

[pack.source]
kind = "git"
url = "https://github.com/google/skywater-pdk-libs-sky130_fd_pr"
commit = "f62031a1be9aefe902d6d54cddd6f59b57627436"
sparse = ["models", "cells"]
include = [
    "LICENSE",
    "README.rst",
    "models/**",
    "cells/**/*.spice",
    "cells/**/*.csv",
]
exclude = [
    "cells/**/tests/**",
    "models/**/*.data",
]

[pack.license]
spdx = "Apache-2.0"
tier = "permissive"
redistributable = true
notice_required = true
file = "LICENSE"

[pack.contents]
process = "SkyWater 130 nm CMOS"
devices = [
    "nfet", "pfet", "diode", "resistor", "capacitor",
    "bipolar", "inductor", "esd",
]
corners = ["tt", "ff", "ss", "sf", "fs", "leak", "mismatch"]
entry = "upstream/models/sky130.lib.spice"

