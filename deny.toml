[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is a transitive proc-macro dependency of faer's GEMM stack; faer 0.24 still depends on it and no patched upgrade path is currently available." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is pulled through egui 0.29 text rendering; upgrading to the newer egui font stack is a larger UI migration tracked separately from CI hardening." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [
    # Bundled egui default fonts include Ubuntu Font License terms. Keep this
    # exception narrow so future LicenseRef additions fail review.
    { allow = ["LicenseRef-UFL-1.0"], crate = "epaint_default_fonts" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
