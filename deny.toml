[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is a build-time proc-macro reached only through faer 0.24.4's gemm 0.19.0 and pulp 0.22.3, the newest releases of each, which all still require it; no runtime input reaches it." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is used directly by rspice-hardcopy and reached through krilla's rustybuzz and winit's Wayland title bars; every font it reads is an embedded IBM Plex file or a local system font, and rustybuzz and ab_glyph have no release without it." },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is transitive through krilla 0.8.2 simple-text; RSpice PDF exporters shape only repository-embedded IBM Plex fonts, and no maintained krilla release or compatible drop-in exists yet." },
    { crate = "zip@8.6.0", reason = "zip yanked every 8.x release after fixing extraction advisories in 9.0; rust_xlsxwriter 0.99.1 still requires zip ^8.3, and RSpice never calls ZipArchive::extract or ZipStreamReader::extract." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # Mozilla's CA bundle data shipped by webpki-roots (cloud client TLS).
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [
    # Bundled egui default fonts include Ubuntu Font License terms. Keep this
    # exception narrow so future unrelated license additions fail review.
    { allow = ["LicenseRef-UFL-1.0", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
