schema = "rspice-mixed-design/1"
id = "C3"
title = "ngspice d_cosim examples run natively"
dialect = "best-available"
features = []

# The upstream Verilog of ngspice-46 examples/xspice/verilator, unedited: adc
# with its $display line and delay in its upstream spelling.
[[variant]]
name = "555"
families = ["spice", "xspice", "vams-digital"]

[[variant]]
name = "adc"
families = ["spice", "xspice", "vams-digital"]

[[variant]]
name = "delay"
families = ["vams-digital"]

[[variant]]
name = "pwm"
families = ["spice", "vams-digital"]

# The rewrites of adc and delay: adc.v without its $display line, and
# delay.v in 1364-2005 spelling (`out = out << 1;`, `endmodule` without `;`).
[[variant]]
name = "adc_nd"
families = ["spice", "xspice", "vams-digital"]

[[variant]]
name = "delay_v2005"
families = ["vams-digital"]

# Budgets are about five times the slower route's measured case time
# (tran: adc_nd 31 s interp, 16 s native; op: 555 2.5 s).
[[analysis]]
id = "tran"
variants = ["555", "adc", "adc_nd", "delay", "delay_v2005", "pwm"]
oracles = ["O2", "O6"]
timeout_s = 150

# 555 op is an expected refusal, analysis.mixed_signal.astable: the astable
# has no coupled t = 0 fixed point, so it declares no quantity and reads no
# O2 reference (tolerance.toml).
[[analysis]]
id = "op"
variants = ["555", "adc", "adc_nd", "delay", "delay_v2005", "pwm"]
oracles = ["O2", "O6"]
timeout_s = 15
