schema = "rspice-mixed-tolerance/1"
# XSPICE gate delays are 10 ps; lfsr16: `timescale 1ns/1ps; the ISCAS Verilog
# renderings have no timescale (zero delay).
time_precision = 1e-12

# The ISCAS outputs are read as codes on their event nets (xs: the XSPICE nets
# d_<port>; vlog: the built-in converters' endpoints xdut.<port>__event_0),
# MSB first in natural port order, just before each rise of the strobe d_stb.
# O1 is the ISCAS transistor-level deck run by ngspice-46 with A/D probes at
# 0.9 V on the same outputs (oracle/<c>-xs.tran.ngspice.cir); O6 is the
# netlist's Boolean function of the applied inputs (analytic/c10.rs). O3 runs
# the Verilog rendering net/<c>.v in Icarus on the inputs and strobe each
# RSpice vector run converted (oracle/<variant>.o3/tb.v; both variants replay
# into the same netlist), live on every run, and reads its outputs the same way.

# ---- lfsr / cnt_xs --------------------------------------------------------

[[q]]
id = "seq"
analysis = "tran"
variants = ["lfsr"]
kind = "codes"
nets = ["xlfsr.q15__event_0", "xlfsr.q14__event_0", "xlfsr.q13__event_0", "xlfsr.q12__event_0", "xlfsr.q11__event_0", "xlfsr.q10__event_0", "xlfsr.q9__event_0", "xlfsr.q8__event_0", "xlfsr.q7__event_0", "xlfsr.q6__event_0", "xlfsr.q5__event_0", "xlfsr.q4__event_0", "xlfsr.q3__event_0", "xlfsr.q2__event_0", "xlfsr.q1__event_0", "xlfsr.q0__event_0"]
strobe = "xlfsr.clk__event_0"
window = [0.0, 2.0e-5]
oracle = "O6"
expect = "c10::seq"
why = "the register before each of its 200 clock rises: 16'hACE1, then one Fibonacci step (taps 16, 14, 13, 11) per rise; digital, exact"

[[q]]
id = "vdac"
analysis = "tran"
variants = ["lfsr"]
kind = "held_at"
signal = "v(dac)"
times = { start = 1.3e-7, step = 1e-7, count = 199 }
oracle = "O6"
expect = "c10::vdac_lfsr"
abs = 1.5e-3
why = "state/65536 V 80 ns after each clock rise; the built-in D/A's 20 ohm against each 20k arm is at most 0.1 % of full scale"

[[q]]
id = "seq"
analysis = "tran"
variants = ["cnt_xs"]
kind = "codes"
nets = ["d_q15", "d_q14", "d_q13", "d_q12", "d_q11", "d_q10", "d_q9", "d_q8", "d_q7", "d_q6", "d_q5", "d_q4", "d_q3", "d_q2", "d_q1", "d_q0"]
strobe = "d_clk"
window = [0.0, 2.0e-5]
oracle = "O6"
expect = "c10::count"
why = "the ripple counter before each of its 200 clock rises: 0..199 (at most 16 ns of ripple against the 100 ns clock); digital, exact"

[[q]]
id = "vdac"
analysis = "tran"
variants = ["cnt_xs"]
kind = "held_at"
signal = "v(dac)"
times = { start = 1.3e-7, step = 1e-7, count = 199 }
oracle = "O6"
expect = "c10::vdac_count"
abs = 1e-6
why = "count/65536 V 79.5 ns after each clock rise; dac_bridge is an ideal source, so the ladder is exact to Newton's tolerance (one LSB is 15 uV)"

