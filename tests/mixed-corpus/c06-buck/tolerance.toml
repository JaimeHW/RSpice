# --- checkpoint / resume -----------------------------------------------------
# The design's continuation contract: the run resumed from the 400 us
# checkpoint is the uninterrupted run from there on (supporting evidence, O7;
# the waveform itself is gated by vss and env).

[[q]]
id = "resume"
analysis = "ckpt"
variants = ["vdig", "vams"]
kind = "identical"
window = [4e-4, 8e-4]
trials = 1
oracle = "O7"
abs = 1e-9
why = "resumed = uninterrupted over [400 us, 800 us]: every event exact; every analog signal within 1 nV at the accepted times the runs share (design)"

# --- Monte Carlo: L and C at 10 % sigma ------------------------------------

[[q]]
id = "vss"
analysis = "mc-tran"
variants = ["vdig", "vams"]
kind = "per_trial"
of = { kind = "mean", signal = "v(vout)", window = [4e-4, 5e-4] }
trials = 3
oracle = "O6"
expect = "c06::vss"
abs = 6e-3
why = "regulation does not depend on L or C"

[[q]]
id = "ripple"
analysis = "mc-tran"
variants = ["vdig", "vams"]
kind = "per_trial"
of = { kind = "pp", signal = "i(lbuck)", window = [4e-4, 5e-4] }
trials = 3
oracle = "O6"
expect = "c06::ripple"
rel = 0.035
why = "as ripple with the trial's L: 0.11588·(22u/L) A peak-to-peak, rel 3.5 % (derivation at ripple)"

[[q]]
id = "ilmean"
analysis = "mc-tran"
variants = ["vdig", "vams"]
kind = "per_trial"
of = { kind = "mean", signal = "i(lbuck)", window = [4e-4, 5e-4] }
trials = 3
oracle = "O6"
expect = "c06::ilmean"
abs = 3e-3
why = "charge balance does not depend on L or C"
