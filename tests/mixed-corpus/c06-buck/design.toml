schema = "rspice-mixed-design/1"
id = "C6"
title = "Digitally controlled buck converter"
exit_phases = ["P2", "P3", "P8"]
dialect = "best-available"
features = []

# The controller reads V(fb) directly in its digital process.
[[variant]]
name = "vdig"
families = ["spice", "vams-digital", "vams-analog"]
today = "runs"

# The Verilog-AMS sampling ADC: @(timer) and @(absdelta) in the analog block,
# read by the digital process.
[[variant]]
name = "vams"
families = ["spice", "vams-digital", "vams-analog"]
today = "runs"

# A supply-aware gate-drive connect module with a supply port, wired to the
# vdrv net by its connect statement; vdrv sags as in vsup. Runs to 1.6 ms.
[[variant]]
name = "p3"
families = ["spice", "vams-digital", "vams-analog"]
today = "runs"

# Gate drive under a varying supply: the shipped d2a converter with its supply
# on the vdrv net, which sags from 5 V to 3.5 V and recovers, rhi = 10 ohm and
# rlo = 5 ohm into 1 nF gates. Runs to 1.6 ms, through the sag.
[[variant]]
name = "vsup"
families = ["spice", "vams-digital", "vams-analog"]
today = "runs"

# The averaged model (design "O6 averaged") is an ngspice deck, so it is
# captured as an O1 reference (oracle/vdig.tran.ngspice.cir).
# Budgets are about five times the slower route's measured case time (tran
# 13.4 s and ckpt 22.3 s interp, both the vsup variant's 1.6 ms run through
# its nanosecond gate edges; mc-tran 4.4 s native).
[[analysis]]
id = "tran"
variants = ["vdig", "vams", "p3", "vsup"]
oracles = ["O6", "O2", "O1"]
timeout_s = 65
phase = "P2"

[[analysis]]
id = "ckpt"
variants = ["vdig", "vams", "vsup"]
oracles = ["O6", "O2", "O7"]
timeout_s = 110
checkpoint_at = [4e-4]
phase = "P8"

[[analysis]]
id = "mc-tran"
variants = ["vdig", "vams"]
oracles = ["O6", "O2"]
timeout_s = 25
phase = "P8"
