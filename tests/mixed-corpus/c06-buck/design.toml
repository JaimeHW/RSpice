schema = "rspice-mixed-design/1"
id = "C6"
title = "Digitally controlled buck converter"
exit_phases = ["P2", "P3", "P8"]
dialect = "best-available"
features = []

# The controller reads V(fb) directly in its digital process.
[[variant]]
name = "vdig"
families = ["spice", "vams-digital", "vams-analog"]
today = "runs"

# The Verilog-AMS sampling ADC: @(timer) and @(absdelta) in the analog block,
# read by the digital process.
[[variant]]
name = "vams"
families = ["spice", "vams-digital", "vams-analog"]
today = "runs"

# A supply-aware gate-drive connect module with a supply port (P3.2).
[[variant]]
name = "p3"
families = ["spice", "vams-digital", "vams-analog"]
today = "refused:P3.2"

# The averaged model (design "O6 averaged") is an ngspice deck, so it is
# captured as an O1 reference (oracle/vdig.tran.ngspice.cir).
# Budgets are about five times the slower route's measured case time (tran
# 6.1 s native, mc-tran 4.4 s native; ckpt refuses today, sized as a tran
# run plus a resumed half).
[[analysis]]
id = "tran"
variants = ["vdig", "vams", "p3"]
oracles = ["O6", "O2", "O1"]
timeout_s = 35
phase = "P2"

[[analysis]]
id = "ckpt"
variants = ["vdig", "vams"]
oracles = ["O6", "O2"]
timeout_s = 40
checkpoint_at = [4e-4]
phase = "P8"

[[analysis]]
id = "mc-tran"
variants = ["vdig", "vams"]
oracles = ["O6", "O2"]
timeout_s = 25
phase = "P8"
