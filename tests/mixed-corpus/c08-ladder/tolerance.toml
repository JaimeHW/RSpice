schema = "rspice-mixed-tolerance/1"
# tb_c8.vams / quant4.vams / therm2bin.vams / biquad_wr.vams: `timescale 1ns/1ps.
time_precision = 1e-12

# --- step overshoot ----------------------------------------------------------
# The quantity measures min(−v(out)), i.e. −peak.

[[q]]
id = "ovs"
analysis = "tran"
variants = ["va", "wr", "sv"]
kind = "min"
signal = "-v(out)"
window = [2e-5, 1.5e-4]
oracle = "O6"
expect = "c08::ovs"
abs = 2e-3
why = "0.6·(1 + e^−π) = 0.62593 V at ζ = 0.7071 (the biquad's own largest sample for wr and sv); bilinear warping and staircase input"
insensitive_time = "the step response's overshoot depth, a minimum over [20, 150] µs: a stretch moves when the minimum falls (by under 1.5 µs), not how deep it is"

[[q]]
id = "ovs"
analysis = "tran"
variants = ["tr"]
kind = "min"
signal = "-v(out)"
window = [2e-5, 1.5e-4]
oracle = "O6"
expect = "c08::ovs"
abs = 6e-3
why = "as va; the op-amp follower's finite gain and input gate leakage through R1 + R2"
insensitive_time = "the step response's overshoot depth, a minimum over [20, 150] µs: a stretch moves when the minimum falls (by under 1.5 µs), not how deep it is"

# --- codes -------------------------------------------------------------------

[[q]]
id = "codes"
analysis = "tran"
variants = ["tr", "va", "wr", "sv"]
kind = "codes"
nets = ["q3", "q2", "q1", "q0"]
strobe = "clk"
oracle = "O6"
expect = "c08::codes"
abs = 0.0
why = "floor(16·v) of the rung's ideal output at the previous clock rise, exact; within 1/32 LSB of a threshold (1/8 LSB for the transistor rung) either neighbouring code"
insensitive_time = "codes strobed by the deck's own clock, which a stretch moves with the data: a uniform stretch keeps every edge on the same side of every strobe, so the codes cannot change"

[[q]]
id = "xab"
analysis = "tran"
variants = ["tr", "va", "wr", "sv"]
kind = "codes"
nets = ["q3", "q2", "q1", "q0"]
strobe = "clk"
oracle = "O7"
why = "codes agree across the rungs: supporting evidence only (O7), evaluated structurally by the harness"
insensitive_time = "codes strobed by the deck's own clock, which a stretch moves with the data: a uniform stretch keeps every edge on the same side of every strobe, so the codes cannot change"

# --- small-signal --------------------------------------------------------

[[q]]
id = "acH"
analysis = "ac"
variants = ["va"]
kind = "ac"
signal = "v(out)"
points = [100.0, 1e3, 5e3, 1e4, 2e4, 1e5, 1e6]
oracle = "O6"
expect = "c08::ach"
abs_db = 0.001
abs_deg = 0.01
why = "the Laplace operator is the transfer exactly"

# The transistor rung against the ideal transfer only in the passband. The
# design allowed 0.1 dB / 1° to 50 kHz for "the op-amp follower's finite gain
# and bandwidth", but the two-stage op-amp on these cards has a loop gain of
# about 140 (−0.062 dB at 100 Hz) and its error grows with frequency: ngspice-46
# on the same held circuit is 0.10 dB off at 5 kHz, 0.26 dB at 10 kHz, 0.69 dB
# at 20 kHz and 3.53 dB / 15.4° at 50 kHz. So the ideal biquad is the
# expectation where the follower's error is inside 0.1 dB (100 Hz, 1 kHz),
# and the circuit itself is checked over the band against ngspice (O5-O1).
[[q]]
id = "acH"
analysis = "ac"
variants = ["tr"]
kind = "ac"
signal = "v(out)"
points = [100.0, 1e3]
oracle = "O6"
expect = "c08::ach"
abs_db = 0.1
abs_deg = 1.0
why = "the op-amp follower's finite gain (≈140: 0.06 dB) in the passband"

[[q]]
id = "acH"
analysis = "ac"
variants = ["tr"]
kind = "ac"
signal = "v(out)"
points = [100.0, 1e3, 5e3, 1e4, 2e4, 5e4]
oracle = "O5-O1"
ref = "ref/tr.ac.O5-O1.out"
abs_db = 0.1
abs_deg = 1.0
why = "the held transistor circuit in ngspice-46: the same BSIM4 cards and small-signal model (C5's O5-O1 ac allowance)"

[[q]]
id = "acH"
analysis = "ac"
variants = ["tr", "va"]
kind = "ac"
signal = "v(out)"
points = [100.0, 1e3, 5e3, 1e4, 2e4, 5e4]
oracle = "O5"
abs_db = 1e-4
abs_deg = 1e-3
why = "corpus O5 rule: the testbench held at its t = 0 output, the readers removed; same equations and solver"

# sh: a timer sample-and-hold rung (net/sh_slew.va). The 0.1 V/us ramp is
# sampled at t_k = 0.5 us + k us, and the output slews at 1 V/us from the
# previous sample to the new one, 0.1 V in 0.1 us. A sample seen before its
# instant moves the output early: by the whole 0.1 V when slew() takes the
# new target over the preceding step, by 1 V/us times that step when it
# leads one step. The output is piecewise linear in time and exact at every
# accepted point; the timer's instant is dated to the 1 ps time precision,
# 1e-6 V at 1 V/us, and 1e-5 V allows ten of that.
[[q]]
id = "sh_start"
analysis = "tran"
variants = ["sh"]
kind = "interp_at"
signal = "v(out)"
times = { start = 1.5e-6, step = 1e-6, count = 8 }
oracle = "O6"
expect = "c08::sh"
abs = 1e-5
why = "at each sample instant the output still holds the previous sample (derivation above)"

[[q]]
id = "sh_slew"
analysis = "tran"
variants = ["sh"]
kind = "interp_at"
signal = "v(out)"
times = { start = 1.55e-6, step = 1e-6, count = 8 }
oracle = "O6"
expect = "c08::sh"
abs = 1e-5
why = "50 ns into each slew the output is halfway, previous sample + 0.05 V (derivation above)"

[[q]]
id = "sh_hold"
analysis = "tran"
variants = ["sh"]
kind = "interp_at"
signal = "v(out)"
times = { start = 2.0e-6, step = 1e-6, count = 8 }
oracle = "O6"
expect = "c08::sh"
abs = 1e-5
why = "half a period after each sample the output holds it, 0.1 V/us times its instant (derivation above)"
