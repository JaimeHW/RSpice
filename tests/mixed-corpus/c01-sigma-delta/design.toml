schema = "rspice-mixed-design/1"
id = "C1"
title = "Sigma-delta modulator"
# The headless path runs the product's default engine configuration; decks
# state any options they need.
dialect = "best-available"
features = []

[[variant]]
name = "xs"
families = ["spice", "xspice"]

[[variant]]
name = "vams"
families = ["spice", "xspice", "vams-digital", "vams-analog"]

[[analysis]]
id = "tran"
variants = ["xs", "vams"]
oracles = ["O1", "O2", "O6"]
timeout_s = 900

[[analysis]]
id = "op"
variants = ["xs", "vams"]
oracles = ["O1", "O2", "O6", "O8"]
timeout_s = 300

# The operating point as ngspice solves it, which reads .IC only for a
# transient: the deck selects the ngspice dialect.
[[analysis]]
id = "op-ngspice"
variants = ["xs", "vams"]
oracles = ["O1", "O2", "O6"]
timeout_s = 300

[[analysis]]
id = "ac"
variants = ["xs", "vams"]
oracles = ["O1", "O2", "O6"]
timeout_s = 300

[[analysis]]
id = "trnoise"
variants = ["xs", "vams"]
oracles = ["O1", "O2", "O6"]
timeout_s = 1800
