schema = "rspice-mixed-tolerance/1"
# sdq.vams: `timescale 1ns/1ps; XSPICE delays are 1 ns.
time_precision = 1e-12

[[q]]
id = "code"
analysis = "tran"
variants = ["xs", "vams"]
kind = "held_at"
signal = "v(adaclout)"
times = { start = 1.5e-4, step = 1e-4, count = 19 }
scale = 1024.0
oracle = "O6"
expect = "c01::code"
abs = 3.0
rel = 0.0
why = "code = 2·(ones among the window's first 498 counted decisions) + the last decision, against 997·(1/2 + v̄/4) (analytic/c01.rs): the first-order ΣΔ keeps the ones count within ±1 of 498·(1/2 + v̄/4) → ±2 codes, and the last decision is within 1 of its mean → ±1. Was 500 + 250·v̄ over 500 clocks, which missed the clock the counter's reset swallows and counted the last decision twice: 1.5 to 2.5 codes high against ngspice and Icarus+ngspice alike"

# The code gates against the independent oracles, set before any RSpice run
# from the oracles alone: allowed = max |O1 − O2| over the windows and both
# variants, plus one code (the quantizer's LSB). O1 (ngspice-46, the xs
# deck; ref/xs.tran.O1.out serves vams too) and O2 (ngspice-46 + d_cosim +
# Icarus, the vams deck; ref/vams.tran.O2.out) read the same code in all 19
# windows, so max |O1 − O2| = 0 and allowed = 0 + 1 = 1 code. The LSB covers
# ngspice's own step dependence: refined 10x (0.1 ns ceiling) it moves O1 by
# one code. xs carries a tie the oracles never meet: the clock's 2 ns ramp
# crosses adc_buff's 0.5 V threshold 1 ns after its breakpoint, RSpice puts
# an accepted point exactly there on 734 of its 9,999 rising edges, and the
# rounding of that point's time decides each such edge (both simulators test
# `in <= in_low` first, ngspice-46 icm/digital/adc_bridge/cfunc.mod:222,
# 237); ngspice-46 never lands on the crossing. vams dates the clock at its
# crossing, so no edge waits on a tie.
[[q]]
id = "code"
analysis = "tran"
variants = ["xs", "vams"]
kind = "held_at"
signal = "v(adaclout)"
times = { start = 1.5e-4, step = 1e-4, count = 19 }
scale = 1024.0
oracle = "O1"
ref = "ref/xs.tran.O1.out"
abs = 1.0
rel = 0.0
why = "max |O1 − O2| = 0 codes over the 19 windows, plus one LSB (derivation above)"

[[q]]
id = "code"
analysis = "tran"
variants = ["vams"]
kind = "held_at"
signal = "v(adaclout)"
times = { start = 1.5e-4, step = 1e-4, count = 19 }
scale = 1024.0
oracle = "O2"
ref = "ref/vams.tran.O2.out"
abs = 1.0
rel = 0.0
why = "max |O1 − O2| = 0 codes over the 19 windows, plus one LSB (derivation above)"

[[q]]
id = "lattice"
analysis = "tran"
variants = ["xs", "vams"]
kind = "events"
nets = ["dv"]
lattice = { t0 = 1.04e-7, period = 2e-7 }
oracle = "O6"
expect = "c01::lattice"
edge_abs = 1e-9
why = "dv moves only at 0.1 µs + 1 ns (the clock's 2 ns ramp at its 0.5 threshold) + 1 ns (adc_bridge rise_delay) + 2 ns (d_dff clk_delay + rise_delay; vams: dq <= #2) + k·200 ns. vams dates the clock at its crossing (every edge on the lattice); xs samples it at the first accepted point past the crossing, as ngspice's adc_bridge does, which put every edge 0.35 ns late in ngspice-46 at its 1 ns maximum step and up to 0.5 ns late here. Was t0 = 102 ns with 2.5 ns, which left out the 2 ns of delays and so allowed 0.5 ns of lateness"

[[q]]
id = "opdiff"
analysis = "op"
variants = ["xs", "vams"]
kind = "op"
signal = { xs = "v(xmod.outintp)-v(xmod.outintn)", vams = "v(outintp)-v(outintn)" }
oracle = "O8"
ref = "ref/xs.op.O8.out"
rel = 1e-6
abs = 1e-6
why = "linear circuit; QSPICE ties each .IC node through 1 mΩ to its value, so the integrator's inputs sit 2 µV off ground and its output at 1e5 × 4 µV"

[[q]]
id = "opdiff"
analysis = "op-ngspice"
variants = ["xs", "vams"]
kind = "op"
signal = { xs = "v(xmod.outintp)-v(xmod.outintn)", vams = "v(outintp)-v(outintn)" }
oracle = "O6"
expect = "c01::opdiff"
rel = 1e-4
why = "Rshunt 100 MΩ vs 500 Ω loading ≤ 1e-5"

[[q]]
id = "opdiff"
analysis = "op-ngspice"
variants = ["xs", "vams"]
kind = "op"
signal = { xs = "v(xmod.outintp)-v(xmod.outintn)", vams = "v(outintp)-v(outintn)" }
