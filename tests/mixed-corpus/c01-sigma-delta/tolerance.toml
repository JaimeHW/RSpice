[[q]]
id = "lattice"
analysis = "tran"
variants = ["xs", "vams"]
kind = "events"
nets = ["dv"]
lattice = { t0 = 1.02e-7, period = 2e-7 }
oracle = "O6"
expect = "c01::lattice"
edge_abs = 2.5e-9
why = "clock ramp 2 ns + clk_delay 1 ns exact: dv moves only at 0.1 µs + 1 ns + 1 ns + k·200 ns"

