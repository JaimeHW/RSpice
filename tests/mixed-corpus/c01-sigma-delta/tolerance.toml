schema = "rspice-mixed-tolerance/1"
# sdq.vams: `timescale 1ns/1ps; XSPICE delays are 1 ns.
time_precision = 1e-12

[[q]]
id = "code"
analysis = "tran"
variants = ["xs", "vams"]
kind = "held_at"
signal = "v(adaclout)"
times = { start = 1.5e-4, step = 1e-4, count = 19 }
scale = 1024.0
oracle = "O6"
expect = "c01::code"
abs = 3.0
rel = 0.0
why = "first-order ΣΔ: ones-count error ≤ ±1 per window → ±2 codes (code = 2·ones); +1 for window alignment"

# xs against ngspice-46. The clock's 2 ns ramp crosses adc_buff's 0.5 V
# threshold 1 ns after its breakpoint. 734 of RSpice's 9,999 rising edges put
# an accepted point exactly there: 0.5 V in exact arithmetic, and 0.5 V
# +/- 2.5e-13 to 4.6e-11 V (2,245 to 4.2e5 ulps) once the time is rounded.
# Both simulators test `in <= in_low` first (ngspice-46
# icm/digital/adc_bridge/cfunc.mod:222, 237), so that rounding decides each of
# these edges: 440 read low and fire on the next point, 0.5 ns later; 294 read
# high and fire on the crossing. ngspice-46 never lands on the crossing. The
# outcome is deterministic. One-ulp nudges of the clock's amplitude, delay,
# edge time and frequency and of the input's amplitude change none of the
# 8,404 dv events. It moves only when the engine's step arithmetic changes
# (7950364593 flipped one decision). Moving the threshold by 1 nV decides
# every tie low, or every tie high, and touches no other sample (the nearest
# is 50 mV away). Between those two extremes the codes move by up to 2, one
# decision. RSpice's deviation from ref over the 19 windows is 2 as run, 2
# with every tie low and 1 with every tie high. ngspice-46 refined 10x
# (0.1 ns ceiling) moves ref by 1. As the paranoia delta-sigma gates do, the
# tolerance is twice the larger of the two.
[[q]]
id = "code"
analysis = "tran"
variants = ["xs"]
kind = "held_at"
signal = "v(adaclout)"
times = { start = 1.5e-4, step = 1e-4, count = 19 }
scale = 1024.0
oracle = "O1"
ref = "ref/xs.tran.O1.out"
abs = 4.0
rel = 0.0
why = "twice the larger of ngspice's own 10x movement (1 code) and RSpice's deviation over both tie outcomes (2 codes). Was 2.0, which the tie rounding alone reaches"

[[q]]
id = "code"
analysis = "tran"
variants = ["vams"]
kind = "held_at"
signal = "v(adaclout)"
times = { start = 1.5e-4, step = 1e-4, count = 19 }
scale = 1024.0
oracle = "O1"
ref = "ref/xs.tran.O1.out"
abs = 2.0
rel = 0.0
why = "one decision flip per window between simulators (vams dates the clock at its crossing, so no edge waits on a tie)"

[[q]]
id = "code"
analysis = "tran"
variants = ["vams"]
kind = "held_at"
signal = "v(adaclout)"
times = { start = 1.5e-4, step = 1e-4, count = 19 }
scale = 1024.0
oracle = "O2"
ref = "ref/vams.tran.O2.out"
abs = 2.0
rel = 0.0
why = "one decision flip per window between simulators"

[[q]]
id = "lattice"
analysis = "tran"
variants = ["xs", "vams"]
kind = "events"
nets = ["dv"]
lattice = { t0 = 1.04e-7, period = 2e-7 }
oracle = "O6"
expect = "c01::lattice"
edge_abs = 1e-9
why = "dv moves only at 0.1 µs + 1 ns (the clock's 2 ns ramp at its 0.5 threshold) + 1 ns (adc_bridge rise_delay) + 2 ns (d_dff clk_delay + rise_delay; vams: dq <= #2) + k·200 ns. vams dates the clock at its crossing (every edge on the lattice); xs samples it at the first accepted point past the crossing, as ngspice's adc_bridge does, which put every edge 0.35 ns late in ngspice-46 at its 1 ns maximum step and up to 0.5 ns late here. Was t0 = 102 ns with 2.5 ns, which left out the 2 ns of delays and so allowed 0.5 ns of lateness"

[[q]]
id = "opdiff"
analysis = "op"
variants = ["xs", "vams"]
kind = "op"
signal = { xs = "v(xmod.outintp)-v(xmod.outintn)", vams = "v(outintp)-v(outintn)" }
oracle = "O8"
ref = "ref/xs.op.O8.out"
rel = 1e-6
abs = 1e-6
why = "linear circuit; QSPICE ties each .IC node through 1 mΩ to its value, so the integrator's inputs sit 2 µV off ground and its output at 1e5 × 4 µV"

[[q]]
id = "opdiff"
analysis = "op-ngspice"
variants = ["xs", "vams"]
kind = "op"
signal = { xs = "v(xmod.outintp)-v(xmod.outintn)", vams = "v(outintp)-v(outintn)" }
oracle = "O6"
expect = "c01::opdiff"
rel = 1e-4
why = "Rshunt 100 MΩ vs 500 Ω loading ≤ 1e-5"

