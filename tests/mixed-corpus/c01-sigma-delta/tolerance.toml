schema = "rspice-mixed-tolerance/1"
# sdq.vams: `timescale 1ns/1ps; XSPICE delays are 1 ns.
time_precision = 1e-12

[[q]]
id = "code"
analysis = "tran"
variants = ["xs", "vams"]
kind = "held_at"
signal = "v(adaclout)"
times = { start = 1.5e-4, step = 1e-4, count = 19 }
scale = 1024.0
oracle = "O6"
expect = "c01::code"
abs = 3.0
rel = 0.0
why = "first-order ΣΔ: ones-count error ≤ ±1 per window → ±2 codes (code = 2·ones); +1 for window alignment"

[[q]]
id = "code"
analysis = "tran"
variants = ["xs", "vams"]
kind = "held_at"
