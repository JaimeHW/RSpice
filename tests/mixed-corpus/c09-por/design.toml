schema = "rspice-mixed-design/1"
id = "C9"
title = "Power-on reset under a supply ramp"
dialect = "best-available"
features = []

# base: .param vcc=3.3, a static converter supply.
[[variant]]
name = "base"
families = ["spice", "xspice", "vams-digital"]

# p3: authored supply-sensitive connect modules with a supply port,
# bound to vdd by the port's inh_conn_def_value.
[[variant]]
name = "p3"
families = ["spice", "xspice", "vams-digital", "vams-analog"]

# live: no .param vcc; the supply is the vdd net, bound live:
# its connect rules (net/por_ctrl_live.vams) name vdd as vsup.
[[variant]]
name = "live"
families = ["spice", "xspice", "vams-digital"]

# p3ramp: p3's authored connect modules reading straight ramps through a
# fixed threshold (net/por_ramp.cir), rising and falling.
[[variant]]
name = "p3ramp"
families = ["spice", "xspice", "vams-digital", "vams-analog"]

# Budgets are about five times the slower route's measured case time (at
# least 30 s), so a hang surfaces quickly.
[[analysis]]
id = "tran"
variants = ["base", "p3", "live", "p3ramp", "chk", "aramp"]
oracles = ["O6"]
timeout_s = 50

# porn_up: the upward sweep, state carried from point to point (P1 S6).
[[analysis]]
id = "dc"
variants = ["base", "p3", "live"]
oracles = ["O6"]
timeout_s = 30

# porn_down: the downward sweep, state carried from point to point.
[[analysis]]
id = "dc-down"
variants = ["base", "p3", "live"]
oracles = ["O6"]
timeout_s = 30

# porn_restart: the upward sweep with RESTART=YES, every point a fresh .op.
[[analysis]]
id = "dc-restart"
variants = ["base", "p3", "live"]
oracles = ["O6"]
timeout_s = 30

# chk: the base controller on straight ramps, with a Verilog-A cross()
# checker dating hi's crossings of vcc/2 (net/hi_check.va).
[[variant]]
name = "chk"
families = ["spice", "xspice", "vams-digital", "va-runtime"]

# aramp: a straight ramp into a Verilog-AMS input through the default A/D,
# rising and falling (net/a2d_dates.vams).
[[variant]]
name = "aramp"
families = ["spice", "vams-digital", "vams-analog"]
