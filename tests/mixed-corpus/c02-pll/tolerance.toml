# The locked loop's phase noise (dBc/Hz, band means of L(f)) from v(vco_out)'s
# rising crossings over [20 us, 55 us]. The contract gives each band an
# interval fixed by the band's statistics before any comparison: the mean of
# M adjacent Hann bins of the 35 us record is chi-square with nu degrees of
# freedom (bins correlate 4/9 in power with their neighbours), taken at 99.9%
# two-sided, widened by the band's change under a 2% error in the pump gain
# and 0.3 dB for Hann leakage at the edges, the linearized pump and the
# acquisition residual. A free-running VCO would put the first band 15.9 dB
# high, outside its interval. No band edge lies within 0.35 bins of a bin.
[[q]]
id = "pn.suppress"
analysis = "trnoise"
variants = ["mx"]
kind = "phase_noise"
signal = "v(vco_out)"
level = 0.5
window = [2.0e-5, 5.5e-5]
points = [4.0e4, 2.1e5]
oracle = "O6"
expect = "c02::phase_noise"
why = "L(f) (analytic::c02::phase_noise), averaged over the record's bins k/35 us in the band: every rendered source is frequency noise at the VCO, S_f = [sf + Kv²·Σ 4kT/R·|Z_out,R|²]·sinc²(f·NT), with sf = 10 Hz²/Hz, |Kv| = 405.35 MHz/V at the 1.9439 V lock, R2's and R3's thermal noise through the filter to cont, and NT = 5 ns; the PFD samples the VCO phase once per 100 ns and the pump delivers K_q·Δ (K_q = 3.603 mA, oracle/mx.pump.ngspice.cir), so with G_c = K_q·Z·|Kv|/(N·s) and G_eff = Σ_m G_c(s + j·m·ω_ref), L(f) = Σ_k |T_k|²·S_f(f + k·f_ref)/(2·(f + k·f_ref)²), T_0 = 1 − G_c/(1 + G_eff) (the closed loop's high-pass), T_k = −G_c/(1 + G_eff) (sampling aliases). L = −108.68; the loop holds the VCO 15.9 dB under its free-running noise; 6 bins, nu = 5.4: chi-square [−16.11, +6.34] dB, K_q 0.22 dB, so [−125.30, −101.82]"

