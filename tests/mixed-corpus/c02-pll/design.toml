schema = "rspice-mixed-design/1"
id = "C2"
title = "Charge-pump PLL"
dialect = "best-available"
features = []

[[variant]]
name = "xs"
families = ["spice", "xspice"]

[[variant]]
name = "mx"
families = ["spice", "xspice", "va-runtime", "vams-digital"]

[[analysis]]
id = "tran"
variants = ["xs", "mx"]
oracles = ["O1", "O2", "O6"]
timeout_s = 1800

[[analysis]]
id = "op"
variants = ["xs", "mx"]
oracles = ["O1", "O2", "O6", "O5", "O5-O1", "O8"]
timeout_s = 300

# The operating point as ngspice solves it, which reads .IC only for a
# transient: the deck selects the ngspice dialect.
[[analysis]]
id = "op-ngspice"
variants = ["xs"]
oracles = ["O1", "O2", "O6"]
timeout_s = 300

[[analysis]]
id = "ac"
variants = ["xs", "mx"]
oracles = ["O1", "O2", "O6", "O5"]
timeout_s = 300

# The ac card around the locked state at 25 us, with the divider and PFD
# held where the lock left them, against the loop filter's Z(jω).
[[analysis]]
id = "ac@lock"
variants = ["mx"]
oracles = ["O6"]
timeout_s = 1800

[[analysis]]
id = "mc-tran"
variants = ["xs", "mx"]
oracles = ["O1", "O2", "O6"]
timeout_s = 7200

# Transient noise of the locked loop: the VCO output's phase noise from its
# crossing times, against the sampled loop's transfer of the deck's sources.
[[analysis]]
id = "trnoise"
variants = ["mx"]
oracles = ["O1", "O2", "O6"]
timeout_s = 3600

[[analysis]]
id = "pss"
variants = ["xs", "mx"]
oracles = ["O1", "O2", "O6"]
timeout_s = 1800

[[analysis]]
id = "pnoise"
variants = ["mx"]
oracles = ["O1", "O2", "O6"]
timeout_s = 1800
