schema = "rspice-mixed-design/1"
id = "C4"
title = "8-bit SAR ADC"
dialect = "best-available"
features = []

# full: a Verilog testbench (clock, start, $display per conversion, $finish)
# and the SAR register in one source file (net/sar8_full.v).
[[variant]]
name = "full"
families = ["spice", "va-runtime", "vams-digital"]

# ports: the SAR register alone, clocked and started by SPICE sources.
[[variant]]
name = "ports"
families = ["spice", "va-runtime", "vams-digital"]

# split: full with the testbench in a file of its own (net/tb_sar.v, no
# `timescale) read after net/sar8.v; the deck's HDL sources are one
# compilation unit, so tb_sar inherits sar8.v's timescale.
[[variant]]
name = "split"
families = ["spice", "va-runtime", "vams-digital"]

# vcd: ports with clk and start replayed from a VCD file (net/sar_ports.vcd)
# by a d_vcd stimulus, onto the register's event nets.
[[variant]]
name = "vcd"
families = ["spice", "xspice", "va-runtime", "vams-digital"]

# vec: ports with clk and start driven by the input columns of an HSPICE
# digital vector file (net/c04.vec, through net/sar_vec.cir), whose output
# columns check the code on b7..b0 after each conversion.
[[variant]]
name = "vec"
families = ["spice", "va-runtime", "vams-digital"]

# Budgets are about five times the slower route's measured case time (at
# least 30 s), so a hang surfaces quickly.
[[analysis]]
id = "tran"
variants = ["full", "ports", "split", "vcd", "vec", "mon"]
oracles = ["O6", "O2", "O5"]
timeout_s = 520

# The coupled t = 0 fixed point (D-A): the sampling state.
[[analysis]]
id = "op"
variants = ["full", "ports", "split"]
oracles = ["O6", "O2", "O5", "O5-O1"]
timeout_s = 30

[[analysis]]
id = "ac"
variants = ["full", "ports"]
oracles = ["O6", "O2", "O5", "O5-O1"]
timeout_s = 30

[[analysis]]
id = "noise"
variants = ["full", "ports"]
oracles = ["O6", "O2", "O5", "O5-O1"]
timeout_s = 30

[[analysis]]
id = "mc-tran"
variants = ["full", "ports"]
oracles = ["O6", "O2", "O5"]
timeout_s = 310

# mon: C4's comparator on a sine, counted through the default A/D by a
# posedge block that drives a D/A and by a cross() on the same node.
[[variant]]
name = "mon"
families = ["spice", "va-runtime", "vams-digital", "vams-analog"]
