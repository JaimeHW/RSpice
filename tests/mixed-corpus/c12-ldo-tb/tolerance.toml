schema = "rspice-mixed-tolerance/1"
# tb_ldo and spi_trim: `timescale 1ns/1ps.
time_precision = 1e-12

# ---- op: the D-A state (trim code 0) ---------------------------------------

[[q]]
id = "op"
analysis = "op"
variants = ["full", "unrolled", "top", "oomr"]
kind = "op"
signals = ["v(vout)"]
oracle = "O5"
abs = 1e-5
rel = 1e-5
why = "§2.10: same equations and solver"

[[q]]
id = "op"
analysis = "op"
variants = ["full", "unrolled", "top", "oomr"]
kind = "op"
signals = ["v(vout)"]
oracle = "O5-O1"
ref = "ref/c0.op.O5-O1.out"
abs = 1e-3
rel = 1e-3
why = "the same BSIM4 4.8.2 equations (C5's op row)"

# ---- tran: the testbench's verdict and its sixteen readings -----------------

[[q]]
id = "ok"
analysis = "tran"
variants = ["full", "unrolled", "top", "oomr"]
kind = "events"
nets = { full = ["xtb.ok__event_0"], unrolled = ["xtb.ok__event_0"], top = ["xtop.ok__event_0"], oomr = ["xtb.ok__event_0"] }
window = [0.0, 1.65e-3]
oracle = "O6"
expect = "c12::ok"
edge_abs = 1e-9
why = "the trim ladder is monotonic: vref (1 + 100k/(75k - k 1k)) steps by 9.0 to 13.7 mV, inside [5 mV, 20 mV], so ok goes 0 -> 1 once, at 1600 us; digital, exact"

[[q]]
id = "okt"
analysis = "tran"
variants = ["full", "oomr"]
kind = "meas"
signal = "okt"
oracle = "O6"
expect = "c12::okt"
abs = 1e-12
why = "the deck's .MEASURE WHEN ok rises, on its exact event time: the testbench raises ok after 16 trim steps of 100 us, at 1600 us"

