schema = "rspice-mixed-design/1"
id = "C12"
title = "Verilog-AMS testbench over the C5 LDO"
dialect = "best-available"
features = []

# full: the testbench with a task, a loop, $display, $error and $finish.
[[variant]]
name = "full"
families = ["spice", "vams-digital", "vams-analog", "wreal"]

# unrolled: the same sequence as straight-line code, no system tasks.
[[variant]]
name = "unrolled"
families = ["spice", "vams-digital", "vams-analog", "wreal"]

# top: Verilog-AMS on top, instantiating the SPICE subcircuit ldo.
[[variant]]
name = "top"
families = ["spice", "vams-digital", "vams-analog", "wreal"]

# fail: full with its step window narrowed to [5 mV, 7 mV], so the testbench
# flags every code with $error; the cell compares those records.
[[variant]]
name = "fail"
families = ["spice", "vams-digital", "vams-analog", "wreal"]

# oomr: full, and at each reading the testbench also reads the LDO's feedback
# node xldo.fb, inside the SPICE hierarchy and no port of the testbench, with
# $cds_get_analog_value, onto a second wreal.
[[variant]]
name = "oomr"
families = ["spice", "vams-digital", "vams-analog", "wreal"]

# Budgets are about five times the slower route's measured case time (at
# least 30 s), so a hang surfaces quickly.
[[analysis]]
id = "tran"
variants = ["full", "unrolled", "top", "fail", "oomr"]
oracles = ["O5", "O6", "O5-O1"]
timeout_s = 30

[[analysis]]
id = "op"
variants = ["full", "unrolled", "top", "oomr"]
oracles = ["O5", "O6", "O5-O1"]
timeout_s = 30

# ckpt: full, checkpointed inside its trim sequence and resumed to the
# testbench's own $finish, which ends both runs.
[[analysis]]
id = "ckpt"
variants = ["full"]
oracles = ["O5", "O6", "O7"]
timeout_s = 30
checkpoint_at = [8.5e-4]
