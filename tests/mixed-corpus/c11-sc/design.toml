schema = "rspice-mixed-design/1"
id = "C11"
title = "Switched-capacitor filter with a Verilog non-overlapping clock"
dialect = "best-available"
features = []

[[variant]]
name = "mx"
families = ["spice", "vams-digital"]

# mx with a d_process peer clocked by ph1 beside the module, over 20 periods.
[[variant]]
name = "proc"
families = ["spice", "xspice", "vams-digital"]

# The analog-clock twin: the filter of net/sc.cir clocked by two PULSE sources
# with the module's edges, no HDL (net/sc_pulse.cir). Its periodic cells are the
# analog event-shooting carrier's; mx's stay with running HDL state.
[[variant]]
name = "pulse"
families = ["spice"]

# Budgets are about five times the slower route's measured case time (tran
# 8.3 s interp, 9.7 s native). The periodic cells stop at preparation today
# (0.1 s); their budget is a guess for the P7 runs.
[[analysis]]
id = "tran"
variants = ["mx", "proc", "pulse"]
oracles = ["O6"]
timeout_s = 50

# Periodic analyses: the mx variant refuses each at its mixed-signal guard
# while its digital half runs; the pulse twin's analog clock admits them.
[[analysis]]
id = "pss"
variants = ["mx", "pulse"]
oracles = ["O6"]
timeout_s = 60

[[analysis]]
id = "pac"
variants = ["mx", "pulse"]
oracles = ["O6"]
timeout_s = 60

[[analysis]]
id = "pnoise"
variants = ["mx", "pulse"]
oracles = ["O6"]
timeout_s = 60
