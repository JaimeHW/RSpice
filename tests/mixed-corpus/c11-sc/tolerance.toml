schema = "rspice-mixed-tolerance/1"
# nonov_clk.v: `timescale 1ns/1ps.
time_precision = 1e-12

# The value C2 holds after each ph2 (read 10 ns after the ph2 fall, while both
# switches are open), periods n = 1..298 (design: n ≥ 1).
[[q]]
id = "rec"
analysis = "tran"
variants = ["mx"]
kind = "held_at"
signal = "v(out)"
times = { start = 1.99e-6, step = 1e-6, count = 298 }
oracle = "O6"
expect = "c11::rec"
abs = 5e-5
why = "y[k] = 0.1·x[k] + 0.9·y[k−1] from the 0.5 V operating point, x at the ph1 fall; Ron·C ≈ 1 ns ≪ the 460 ns phases, input tracking lag ≤ 13 uV"

# The d_process toggle peer clocked by ph1: one exchange per ph1 rise.
[[q]]
id = "proc"
analysis = "tran"
variants = ["proc"]
kind = "events"
nets = ["d"]
window = [0.0, 2e-5]
oracle = "O6"
expect = "c11::proc"
edge_abs = 1e-12
why = "the peer answers each ph1 rise (20 ns + k us) with the complement of its last answer, taken clk_delay = 1 ns later; a replayed or repeated exchange would flip the sequence"

# The filter beside the peer: the value C2 holds after each ph2, as for mx,
# over the deck's 20 periods (n = 1..19). The peer reads the switches' clock
# nets, so a split that left the switches open holds v(out) at its 0.5 V
# operating point and misses the first held value, y[1], by 2.4e-3 V.
[[q]]
id = "filter"
analysis = "tran"
variants = ["proc", "pulse"]
kind = "held_at"
signal = "v(out)"
times = { start = 1.99e-6, step = 1e-6, count = 19 }
oracle = "O6"
expect = "c11::rec"
abs = 5e-5
why = "y[k] = 0.1·x[k] + 0.9·y[k−1] from the 0.5 V operating point, x at the ph1 fall; the deck steps at 2 ns as mx does, so mx's allowance and its reasons hold; the twin samples 0.556 ns after the fall edge, ≤ 7 uV at the input's slope"
insensitive_time = "held outputs read 10 ns before each clock edge: a 1 % stretch moves each read back by under 0.2 µs, inside the same 1 µs hold, and a switched-capacitor filter's held sequence depends on its charge transfers, not on when they happen"

# The design's transient FFT, on the deck's 300 us: the 10 kHz amplitude of
# v(out) over [100 us, 300 us] (two input periods, coherent; the recursion's
# start has decayed by 0.9^100), Hann.
[[q]]
id = "fft"
analysis = "tran"
variants = ["mx"]
kind = "fft"
signal = "v(out)"
window = [1e-4, 3e-4]
points = [1e4]
taper = "hann"
oracle = "O6"
expect = "c11::fft"
rel = 0.005
why = "0.2·|0.1/(1 − 0.9·e^−jωT)|·sinc(πfT) = 0.2·0.85903·0.999836 = 0.17178 V (design)"

# P7: the sampled output noise, integrated over the pnoise sweep (100 Hz to
# fs/2; below 100 Hz holds under 1 % of a spectrum flat to the 16 kHz pole).
[[q]]
id = "pn"
analysis = "pnoise"
variants = ["mx"]
kind = "noise_int"
window = [100.0, 5e5]
oracle = "O6"
expect = "c11::pn"
rel = 0.10
why = "kT/C2 = 4.60e-10 V² (design; derivation in analytic/c11.rs)"

# P7: sideband 0 of the periodic small-signal transfer.
[[q]]
id = "pac"
analysis = "pac"
variants = ["mx", "pulse"]
kind = "ac"
signal = "v(out)"
points = [100.0, 1e3, 1e4, 1e5]
oracle = "O6"
expect = "c11::pac"
abs_db = 0.05
abs_deg = 0.5
why = "0.1/(1 − 0.9·e^−jωT) · sinc(πfT) · e^−jω·0.54T: sampled at the ph1 fall (0.48 T), held from the ph2 rise (0.52 T) for one period; the twin's sample and update are both 0.556 ns later, 40 ns apart as the module's"

# P7, analog-clock twin: the periodic steady state. The 1 MHz carrier peaks
# where S1 opens, so every period samples the same value and v(out) holds it
# over the whole period.
[[q]]
id = "held"
analysis = "pss"
variants = ["pulse"]
kind = "mean"
signal = "v(out)"
window = [0.0, 1e-6]
oracle = "O6"
expect = "c11::held"
abs = 5e-5
why = "the fixed point of y = 0.1·x_s + 0.9·y is x_s = 0.5 + 0.2/(1 + (ω₀·Ron·C1)²) = 0.6999921 V (C1 follows the carrier through Ron·C1 = 1 ns, sampled at its lagged peak); ROFF leakage over a period < 1e-7 V; trapezoidal amplitude error of the tracking at T/256 steps ≈ 1e-5 V. Ten periods of transient from the 0.5 V operating point leave v(out) 0.07 V short"

# P7, analog-clock twin: v(a) in absolute time mod T, tracking the carrier
# while S1 is closed (300 ns) and holding the sample on ph2 (700 ns).
[[q]]
id = "track"
analysis = "pss"
variants = ["pulse"]
kind = "interp_at"
signal = "v(a)"
at = [3e-7, 7e-7]
oracle = "O6"
expect = "c11::track"
abs = 5e-5
why = "0.5 + 0.2·|H|·sin(ω₀t − 83° − atan(ω₀τ)), τ = Ron·C1, at 300 ns (slope 1.1e6 V/s: 44 ps of phase alignment) and the held x_s at 700 ns; linear interpolation of the sine between T/256 mesh points ≤ 7 uV, trapezoidal amplitude error ≈ 1e-5 V"

# P7, analog-clock twin: sideband −1 of the periodic small-signal transfer.
[[q]]
id = "pac_lsb"
analysis = "pac"
variants = ["pulse"]
kind = "ac"
signal = "v(out)[sb=-1]"
points = [1e3, 1e4, 1e5]
oracle = "O6"
expect = "c11::pac_lsb"
abs_db = 0.0433
abs_deg = 0.5
why = "the sampled hold's lower sideband: Y₋₁ = H_d·e^{jω(t_s − t_u)}·e^{jω₀t_u}·(1 − e^{−jωT})/(j(ω − ω₀)T), |Y₋₁(10 kHz)| = 0.0086755; 0.5 % in magnitude (0.0433 dB) and 0.5° as sideband 0; the Ron·C time constants (≈ 1 ns) shift the phase ≤ 0.04° at 100 kHz"

# P7, analog-clock twin: the sampled output noise over the pnoise sweep, as
# the one-sided spectrum of the sample sequence on [0, f₀/2].
[[q]]
id = "pn_band"
analysis = "pnoise"
variants = ["pulse"]
kind = "noise_int"
window = [100.0, 5e5]
oracle = "O6"
expect = "c11::pn_band"
rel = 1e-5
why = "the samples are AR(1) with innovation 0.19·kT/C2 and stationary variance kT/C2 (equipartition), so S_y is exact on any grid; the expectation integrates S_y on the frequencies RSpice solved with the measure's own power-law quadrature (exactly, [100 Hz, f₀/2] holds 4.5870e-10 V², and that quadrature on the dec 10 grid reads 0.18 % low), so the comparison holds the spectrum's error, not the quadrature's. The closed form leaves out the switches' 1e12 Ω off-resistance, whose noise adds 2T/(Roff·C2)/(1 − 0.81) = 1.2e-6 of kT/C2: allowed 1e-5. Was 2 %, the contract's allowance, which a 1 % error passed"

[[q]]
id = "pn_psd"
analysis = "pnoise"
variants = ["pulse"]
kind = "noise"
points = [100.0, 1e4, 1e5, 4.99e5]
oracle = "O6"
expect = "c11::pn_psd"
rel = 1e-5
why = "S_y(f) = (2/f₀)·0.19·(kT/C2)/|1 − 0.9·e^{−j2πf/f₀}|²: 1.7496e-14 V²/Hz at 100 Hz, 1.2911e-14 at 10 kHz, 4.9459e-16 at 100 kHz, 4.8469e-17 at 499 kHz, taken at the frequencies RSpice solved nearest each point. The closed form leaves out the switches' 1e12 Ω off-resistance noise, 1.2e-6 of kT/C2: allowed 1e-5. Was 5 %, the contract's allowance, which a 1 % error passed"
