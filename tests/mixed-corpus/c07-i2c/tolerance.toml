schema = "rspice-mixed-tolerance/1"
# i2c_ctrl.v / i2c_dev.v: `timescale 1ns/1ps.
time_precision = 1e-12

# --- protocol: SDA at every SCL rise (bus observers sda_d / scl_d) --------
#
# Not `set`: rspice_3v3_fast gives the A/D a 1 ns X timeout, and an
# open-drain release rises with Rp*Cbus = 440 ns, spending about 370 ns in the
# 0.99-2.31 V band. The bus nets read X there, and 0 -> X is a posedge
# (IEEE 1364-2005 Table 9-2), so the modules' edge-triggered processes fire at
# the X rather than at the 1. That is the set's law, not a fault: the same
# rules with txdel = inf give these codes exactly. The set's analog timing
# below still holds.

[[q]]
id = "proto"
analysis = "tran"
variants = ["flat", "tasks"]
kind = "codes"
nets = ["sda_d"]
strobe = "scl_d"
oracle = "O6"
expect = "c07::proto"
abs = 0.0
why = "the script's bits: 0x54 ACK 0xC5 ACK stop | 0x55 ACK 0xC5 NACK stop | 0x66 NACK stop; SDA changes only mid-SCL-low, so every sample is race-free"

# The O3 twin of `proto`: Icarus runs the variant's modules on a tri1 bus
# (oracle/<variant>.o3/tb.v), live on every run; nothing is replayed.
[[q]]
id = "proto"
analysis = "tran"
variants = ["flat", "tasks"]
kind = "codes"
nets = ["sda_d"]
strobe = "scl_d"
oracle = "O3"
abs = 0.0
why = "the same modules on an Icarus tri1 bus: protocol bits at SCL rises match exactly"

# --- analog timing of the first SCL release (20 us) and fall (25 us) ------
# The controller held SCL at V_OL = 3.3·20/2220 before the release; Rp·Cbus =
# 440 ns rising. Falling, the built-in connect-rule converter is 0 V behind
# 20 ohm, switched at the edge, so the line falls from 3.3 V towards V_OL with
# (20 ‖ 2200)·Cbus = 3.964 ns.
#
# The xcard variant's explicit bidi_bridge cards (ngspice's converter at its
# defaults) are a 20 ohm taper that never sinks more than drive_low = 20 mA,
# whose drive comes on over t_fall = 1 ns: the line falls at the 20 mA limit,
# an Rp·Cbus exponential towards 3.3 − 20 mA·2.2k = −40.7 V. ngspice-46 on
# this bus (O1): 70% at 25.01026 us, 30% at 25.02398 us.

[[q]]
id = "tr30"
analysis = "tran"
variants = ["flat", "tasks", "xcard", "set"]
kind = "cross"
signal = "v(scl)"
level = 0.99
edge = "rise"
window = [1.99e-5, 2.1e-5]
oracle = "O6"
expect = "c07::tr30"
abs = 3.06e-9
why = "20 us + Rp·Cbus·ln((3.3 − V_OL)/(3.3 − 0.99)) = 20 us + 153.0 ns; 2% of the RC delay"

[[q]]
id = "tr70"
analysis = "tran"
variants = ["flat", "tasks", "xcard", "set"]
kind = "cross"
signal = "v(scl)"
level = 2.31
edge = "rise"
window = [1.99e-5, 2.1e-5]
oracle = "O6"
expect = "c07::tr70"
abs = 1.05e-8
why = "20 us + Rp·Cbus·ln((3.3 − V_OL)/(3.3 − 2.31)) = 20 us + 525.8 ns (30→70% = 372.8 ns); 2% of the RC delay"

[[q]]
id = "tf70"
analysis = "tran"
variants = ["flat", "tasks", "set"]
kind = "cross"
signal = "v(scl)"
level = 2.31
edge = "fall"
window = [2.49e-5, 2.55e-5]
oracle = "O6"
expect = "c07::tf70"
abs = 5e-10
why = "25 us + (20 ‖ Rp)·Cbus·ln((3.3 − V_OL)/(2.31 − V_OL)) = 25 us + 1.429 ns"

[[q]]
id = "tf70"
analysis = "tran"
variants = ["xcard"]
kind = "cross"
signal = "v(scl)"
level = 2.31
edge = "fall"
window = [2.49e-5, 2.55e-5]
oracle = "O1"
ref = "ref/xcard.tran.O1.out"
abs = 5e-10
why = "ngspice-46's bidi_bridge, current-limited: 25.01026 us"

[[q]]
id = "tf30"
analysis = "tran"
variants = ["flat", "tasks", "set"]
kind = "cross"
signal = "v(scl)"
level = 0.99
edge = "fall"
window = [2.49e-5, 2.55e-5]
oracle = "O6"
expect = "c07::tf30"
abs = 5e-10
why = "25 us + (20 ‖ Rp)·Cbus·ln((3.3 − V_OL)/(0.99 − V_OL)) = 25 us + 4.857 ns (70→30% = 3.428 ns)"

[[q]]
id = "tf30"
analysis = "tran"
variants = ["xcard"]
kind = "cross"
signal = "v(scl)"
level = 0.99
edge = "fall"
window = [2.49e-5, 2.55e-5]
oracle = "O1"
ref = "ref/xcard.tran.O1.out"
abs = 5e-10
why = "ngspice-46's bidi_bridge, current-limited: 25.02398 us (70→30% = 13.715 ns)"

[[q]]
id = "vol"
analysis = "tran"
variants = ["flat", "tasks", "xcard", "set"]
kind = "held_at"
signal = "v(sda)"
at = [1.25e-5]
oracle = "O6"
expect = "c07::vol"
abs = 1e-3
why = "the START hold: only the controller sinks SDA, V_OL = 3.3·20/2220 = 29.7 mV"

# --- contention ------------------------------------------------------------

[[q]]
id = "vcont"
analysis = "tran"
variants = ["cont"]
kind = "mean"
signal = "v(sda)"
window = [3.02e-4, 3.08e-4]
oracle = "O6"
expect = "c07::vcont"
abs = 5e-3
why = "a converter driving 1 against one driving 0, each its level behind 20 ohm, with Rp to 3.3 V: V = 3.3·(1/20 + 1/2200)/(2/20 + 1/2200) = 1.6575 V"

[[q]]
id = "vcont"
analysis = "tran"
variants = ["xcard"]
kind = "mean"
signal = "v(sda2)"
window = [3.02e-4, 3.08e-4]
oracle = "O1"
ref = "ref/xcard.tran.O1.out"
abs = 5e-3
why = "two bidi_bridges, one driving 1 and one 0, each a 20 ohm taper limited to 20 mA: the sinking one is at its limit, (3.3 − V)·(1/20 + 1/2200) = 20 mA, V = 2.903604 V in ngspice-46"

# --- idle operating point --------------------------------------------------

[[q]]
id = "idle"
analysis = "op"
variants = ["flat", "tasks", "cont", "xcard", "set"]
kind = "op"
signals = ["v(sda)", "v(scl)"]
oracle = "O6"
expect = "c07::idle"
abs = 1e-3
why = "every driver starts released (z): the pull-ups hold both lines at 3.3 V"
