schema = "rspice-mixed-design/1"
id = "C7"
title = "Open-drain bus"
exit_phases = ["P3"]
dialect = "best-available"
features = []

# The controller script without tasks: what the digital front end runs today.
[[variant]]
name = "flat"
families = ["spice", "xspice", "vams-digital"]
today = "runs"

# The same script written with tasks (P2.2, lane L3).
[[variant]]
name = "tasks"
families = ["spice", "xspice", "vams-digital"]
today = "runs"

# Contention: i2c_dev51 drives SDA push-pull high while the controller holds
# it low.
[[variant]]
name = "cont"
families = ["spice", "xspice", "vams-digital"]
today = "runs"

# The flat and contention scripts with every port on an explicit ngspice
# bidi_bridge card instead of the built-in connect-rule converter: the stock
# current-limited law, measured against ngspice-46 itself
# (oracle/xcard.tran.ngspice.cir).
[[variant]]
name = "xcard"
families = ["spice", "xspice", "vams-digital"]
today = "runs"

# The flat script converted by the shipped rule set rspice_3v3_fast,
# selected by name: thresholds at 0.3 and 0.7 of 3.3 V, 100 ps edges and a
# 1 ns X timeout. The 100 ps edge moves a fall by about 50 ps, inside its
# 0.5 ns tolerance, and the protocol decodes exactly.
[[variant]]
name = "set"
families = ["spice", "xspice", "vams-digital"]
today = "runs"

# Budgets are about five times the slower route's measured case time (tran
# 3.7 s; op 0.1 s, floored at 10 s).
[[analysis]]
id = "tran"
variants = ["flat", "tasks", "cont", "xcard", "set"]
oracles = ["O6", "O3", "O1"]
timeout_s = 20
phase = "P3"

[[analysis]]
id = "op"
variants = ["flat", "tasks", "cont", "xcard", "set"]
oracles = ["O6", "O3"]
timeout_s = 10
phase = "P3"
